  owner: M5-S0b0, M5-S0b1a, M5-S0b1b, M5-S0b1c, M5-S0b2, M5-S0b3a,
    M5-S0b3b, M5-S0b3c, M5-S0b4, M5-S0b5, and M5-S3 coordinated worker
    qualification
  reason: Current Skylet exposes unauthenticated TCP mutation, permits direct SSH, mutable path and log
    ownership, and raw SQLite
    writers, starts handlers before recovery, owns local provider teardown through StopEvent, and
    cancels only a local process shape while Ray and Slurm can execute work outside that shape; no
    current direct executor provides one durable mutation owner, immutable executable and log owner,
    payload-inaccessible control, executable bridge confinement, lifetime startup lock, negative
    privilege and lifecycle-credential profile, recursive absence receipt, or escape isolation required
    before pool capacity can be released safely
  closure_gate: Merge the canonical single-owner design, then independently merge and deploy the
    standalone, release, and internal two-wheel packaging foundation with opaque-wheel preservation,
    installed-API reconstruction, manifest-hashed cache, verified transfer and local-path install,
    compatibility facade, dormant
    coordinated-only runtime and config schema, signed wire and key-lifetime identities, artifact owner,
    immutable manager and shim, restricted-login and SSH-policy packaging, and the standalone dormant
    reducer before fresh-worker-only activation; prove exact global guard catalog including unknown-trigger
    and explicit-index rejection, exact owned autoindex shape, the neutral fresh-or-upgraded legacy config
    prerequisite initializer and autoindex validation, and portable numeric-token canonicalization,
    side-row-first add, Unix-socket and forced-command isolation, signed replay fencing, key retirement,
    manager-held lock and predecessor recovery, lifecycle quiescence and hook-free planning, payload and
    worker credential isolation, old-binary no-effect, acyclic queue and artifact identities, bounded direct
    commands and mutation requests with typed legacy-only ineligibility, intent-first artifact prepare and
    every crash pairing, sealed-FD launch, protected log drain, durable log-quota receipt linearization
    before the winning cancellation or completion operation seals, immediate quota hard-kill ordering with
    no pre-kill root wait, and
    authenticated offset readback, durable all-member retention freeze with exact terminal receipt evidence,
    separate pre-freeze and post-freeze recorded-loss branches, down-request creation only after irreversible
    removal or loss disposition, explicit removal and recorded-local-loss destruction,
    never-launched response loss, shim-to-payload UID handoff,
    bounded request-ack IPC isolation, gate-closed failed-launch sealing, channel-loss completion and
    cancellation ordering, daemon escape, fork race, crash recovery, reaping, retirement, legacy
    compatibility, forbidden in-place rollback, and Ray and Slurm rejection
    conformance; and replace this gap with exact implementation and rollout evidence before
    coordinated birth or the M5 assignment and teardown removal gates
