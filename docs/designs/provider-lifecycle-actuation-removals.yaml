      \ a bare filename (resolved against\n    ``sky/templates/``) or an absolute path. Plugins ship their\
      \ own\n    templates inside their package and pass an absolute path so they\n    don't have to write\
      \ into SkyPilot's tree.\n    \"\"\"\n    assert template_ref.endswith('.j2'), template_ref\n   \
      \ if os.path.isabs(template_ref):\n        template_path = template_ref\n    else:\n        root_dir\
      \ = os.path.dirname(os.path.dirname(__file__))\n        template_path = os.path.join(root_dir, 'templates',\
      \ template_ref)\n    if not os.path.exists(template_path):\n        raise FileNotFoundError(f'Template\
      \ \"{template_ref}\" does not exist.')\n    with open(template_path, encoding='utf-8') as fin:\n\
      \        template = fin.read()\n    output_path = os.path.abspath(os.path.expanduser(output_path))\n\
      \    os.makedirs(os.path.dirname(output_path), exist_ok=True)\n\n    j2_template = jinja2.Template(template)\n\
      \    content = j2_template.render(**variables)\n    with open(output_path, 'w', encoding='utf-8')\
      \ as fout:\n        fout.write(content)"
