- id: PLA-GAP-005
  milestone: M5
  responsibility: Name and implement one generation-fenced pooled-worker provider actuation owner with
    pre-effect target identity, authoritative object query, signed no-later-create closure receipts,
    a worker role with negative lifecycle authority, and one central SkyPilot-issued lifecycle
    credential owner
  candidate_locators:
  - kind: python_symbol
    path: sky/serve/replica_managers.py
    symbol: launch_cluster
  - kind: python_symbol
    path: sky/serve/replica_managers.py
    symbol: terminate_cluster
  - kind: python_symbol
    path: sky/backends/cloud_vm_ray_backend.py
    symbol: CloudVmRayBackend.teardown_no_lock
  - kind: python_symbol
    path: sky/provision/provisioner.py
    symbol: bulk_provision
  - kind: python_symbol
    path: sky/provision/provisioner.py
    symbol: teardown_cluster
  owner: M5-S4 pooled-worker provider actuation qualification
  reason: No current provider implementation owns every create retry behind a generation fence or can
    issue the operation-closing receipt required to rule out a late create, so coordinated pool
    activation and final removal of version-0 launch or teardown ownership remain unsafe; current
    worker credentials may also permit a stale or uploaded worker binary to reclaim lifecycle actuation
  closure_gate: Update the canonical design with one named pilot provider and exact target and object
    schemas, sole-credential egress owner, retry ledger, issuer keys, authoritative query, signed
    generation and operation closure, worker-role policy that denies launch, stop, terminate, delete,
    resize, and scale, live negative worker-side actuation conformance, and deployment evidence; replace
    this gap with exact implementation and compatibility artifacts before any coordinated birth or M5
    removal gate
- id: PLA-GAP-006
  milestone: M5
  responsibility: Implement and qualify a separately versioned coordinated worker control plane and
    LOCAL_CGROUP_V2_DIRECT_V1 with one reducer, global SQLite mutation guards, a protected Unix control
    socket with signed controller authorization, a standalone top-level worker package with no sky or
    provider import edge, first-instruction lifecycle quiescence and hook-free
    admission, a manager-held lifetime lock, immutable native and SSH-policy packaging, a restricted
    bridge login, negative payload and worker credential profiles, immutable key validity and retirement,
    SubmissionArtifactOwnerV1 for intent-first sealed executable bytes, cursor-bound protected retained
    log readback, bounded direct commands and requests, durable log-quota failure, exact inventory freeze
    with frozen terminal receipt evidence, explicit removal and pre-freeze or post-freeze recorded loss, a root-owned
    supervisor, durable prepare ledgers, control, bridge, shim, and payload principal separation,
    submission-scoped payload and log channels, side-row-first add, race-free direct launch,
    crash-recoverable natural completion, durable no-later-launch seal, recursive cgroup kill and empty
    proof, reaping, finalization, explicit artifact removal, and permanent retirement
