name: Dashboard Testing and Formatting

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - master
      - improvements
      - 'releases/**'
  pull_request:
    branches:
      - master
      - improvements
      - 'releases/**'
  merge_group:

jobs:
  dashboard:
    runs-on: namespace-profile-skypilot-ci-2x4
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies and check
      run: |
        npm --prefix sky/dashboard install
        npm --prefix sky/dashboard test -- --runInBand \
          src/components/services.test.jsx \
          src/components/service-version-history.test.jsx \
          src/components/service-placement.test.jsx \
          src/components/recipe-hub.test.jsx \
          src/components/recipe-detail.test.jsx \
          src/components/clusters.test.jsx \
          src/components/utils.test.jsx \
          src/components/volumes.test.jsx \
          src/components/estimated-spend.test.jsx \
          src/components/infra.test.jsx \
          src/components/infra-refresh-lifecycle.test.jsx \
          src/components/infra-page.test.jsx \
          src/components/image-action-dialogs.test.jsx \
          src/components/image-detail.test.jsx \
          src/components/image-readiness.test.jsx \
          src/data/connectors/infra-kubernetes.test.jsx \
          src/data/connectors/infra-slurm.test.jsx \
          src/components/serve-replica-history.test.jsx \
          src/components/job-detail-logs.test.jsx \
          src/components/job-log-actions.test.jsx \
          src/components/jobs.test.jsx \
          src/components/pools-table.test.jsx \
          src/components/users.test.jsx \
          src/components/workspace-editor.test.jsx \
          src/components/workspaces.test.jsx \
          src/components/elements/deployment-version.test.jsx \
          src/components/elements/operator-notification-bell.test.jsx \
          src/components/elements/request-activity-indicator.test.jsx \
          src/components/elements/sidebar.test.jsx \
          src/components/operator-notifications.test.jsx \
          src/data/connectors/client.test.js \
          src/data/connectors/clusters.test.jsx \
          src/data/connectors/services.test.jsx \
          src/data/connectors/jobs.test.jsx \
          src/data/connectors/jobs-stream-timeout.test.jsx \
          src/data/connectors/ssh-node-pools-stream-timeout.test.jsx \
          src/data/connectors/jobs-download-logs.test.jsx \
          src/data/connectors/operator-notifications.test.js \
          src/data/connectors/stream-decoders.test.jsx \
          src/data/connectors/volumes.test.js \
          src/tests/managed-job-details.test.jsx \
          src/tests/task-details-route.test.jsx \
          src/tests/service-details.test.jsx \
          src/tests/cluster-details-route.test.jsx \
          src/tests/cluster-history-details.test.jsx \
          src/tests/volume-details.test.jsx \
          src/tests/pool-details.test.jsx \
          src/lib/cache.test.js \
          src/lib/jobs-cache-manager.test.js \
          src/lib/request-activity.test.js \
          src/lib/request-activity.persistence.test.js \
          src/hooks/useVisibleRefreshInterval.test.js \
          src/hooks/useLogStreamer.test.js \
          src/hooks/useTour.test.jsx \
          src/plugins/PluginProvider.test.jsx \
          src/utils/grafana.test.js
        npm --prefix sky/dashboard run lint
        npm --prefix sky/dashboard run format:check
        npm --prefix sky/dashboard run build
