name: Documentation Build

on:
  # Trigger the workflow on push or pull request for active release branches.
  push:
    branches:
      - improvements
      - master
      - 'releases/**'
  pull_request:
    branches:
      - improvements
      - master
      - 'releases/**'
  merge_group:

jobs:
  doc-build:
    runs-on: namespace-profile-skypilot-ci-2x4
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv venv --seed ~/test-env
        # shellcheck source=/dev/null
        source ~/test-env/bin/activate
        uv pip install "."
        cd docs
        uv pip install -r ./requirements-docs.txt
    - name: Build documentation
      run: |
        set -e
        # shellcheck source=/dev/null
        source ~/test-env/bin/activate
        cd ./docs
        # Set production environment for llms.txt generation
        export SPHINX_BUILD_PRODUCTION=true
        ./build.sh
