name: static-analysis

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - master
      - 'releases/**'
      - improvements
  pull_request:
    branches:
      - master
      - 'releases/**'
      - improvements
  merge_group:

jobs:
  ruff:
    runs-on: namespace-profile-skypilot-ci-2x4
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Run ruff
        run: |
          uv venv --seed ~/lint-env
          source ~/lint-env/bin/activate
          uv pip install ruff==0.15.21
          ruff check sky
          # Provider requests must not be able to block provisioning forever.
          # Scope S113 to audited provider wrappers while other clients still
          # have reviewed legacy findings.
          ruff check sky/adaptors/verda.py --select S113
          ruff check sky/provision/yotta/yotta_utils.py --select S113
          ruff check sky/skylet/providers/ibm/vpc_provider.py --select S113
          ruff check sky/server/rest.py --select S113
          # Resource construction invariants must survive `python -O`.
          ruff check sky/resources.py --select B011
          # Backend construction and dispatch guards must survive `python -O`.
          ruff check sky/backends/backend_utils.py --select B011
          # GCP fallback and deprecated-path guards must survive `python -O`.
          ruff check sky/clouds/gcp.py --select B011
          # Cloud storage dispatch guards must survive `python -O`.
          ruff check sky/cloud_stores.py --select B011
          # Connection metadata must not silently omit provisioned nodes.
          ruff check sky/provision/__init__.py --select B905
          # GCS source and lifecycle validation must survive `python -O`.
          ruff check sky/data/storage_gcs.py --select S101
          # Kubernetes volume validation must survive `python -O`.
          ruff check sky/provision/kubernetes/volume.py --select S101
          # ZIP extraction security checks must survive `python -O`.
          ruff check sky/server/file_mount_uploads.py --select S101
          # EFA setup has a nested network-card loop inside the subnet retry
          # loop. Shadowing its attempt index can silently skip failover.
          ruff check sky/provision/aws/instance_requests.py --select PLW2901
          # API payload validation must survive `python -O`.
          ruff check sky/server/requests/payloads.py --select S101
          # Stream response identity checks must survive `python -O`.
          ruff check sky/client/sdk.py --select S101
          # Client download protocol guards must survive `python -O`.
          ruff check sky/client/common.py --select S101
          # API request and local-server guards must survive `python -O`.
          ruff check sky/server/common.py --select S101
          # Parallel cluster metadata must not silently truncate nodes.
          ruff check sky/backends/cloud_vm_ray_backend.py --select B905
          # Batch worker validation errors must reach the coordinator result.
          ruff check sky/batch/coordinator.py --select S110
          # SQLite database-name validation must survive `python -O`.
          ruff check sky/utils/db/db_utils.py --select S101
          # Infrastructure sentinel validation must survive `python -O`.
          ruff check sky/utils/infra_utils.py --select S101
          # A mutable class default bypasses threading.local's per-thread
          # attribute storage and is shared by every thread. RUF012 is noisy
          # for intentional class constants, so scope it to local subclasses.
          git grep -lE 'class .*\(threading\.local\)' -- sky \
            | xargs ruff check --select RUF012

  basedpyright:
    runs-on: namespace-profile-skypilot-ci-2x4
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          python-version: "3.14"
      - name: Check coroutine and control-flow types
        run: |
          uv venv --seed ~/lint-env
          source ~/lint-env/bin/activate
          uv pip install basedpyright==1.39.9
          # To accept reviewed baseline changes, add --writebaseline locally.
          basedpyright --project . \
            --baselinefile .basedpyright-baseline.json

  stub-runtime-contracts:
    runs-on: namespace-profile-skypilot-ci-2x4
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          python-version: "3.14"
      - name: Compare hand-written stubs with runtime signatures
        run: |
          uv venv --seed ~/lint-env
          source ~/lint-env/bin/activate
          uv pip install -e .
          uv pip install mypy==1.19.1
          python -m mypy.stubtest \
            sky.skylet.log_lib sky.utils.command_runner \
            --concise \
            --allowlist .stubtest-allowlist \
            --mypy-config-file .stubtest.ini

  async-lifecycle:
    runs-on: namespace-profile-skypilot-ci-2x4
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          python-version: "3.14"
      - name: Check cancellation and async resource lifecycles
        run: |
          uv venv --seed ~/lint-env
          source ~/lint-env/bin/activate
          uv pip install flake8==7.3.0 flake8-async==27.7.1
          # flake8 appends to output files, so make repeated local runs stable.
          truncate -s 0 /tmp/flake8-async-current.txt
          set +e
          flake8 sky --asyncio \
            --select=ASYNC103,ASYNC104,ASYNC119,ASYNC120,ASYNC231,ASYNC232 \
            --exclude=sky/schemas/generated,sky/dashboard \
            --format='%(path)s:%(row)d:%(col)d: %(code)s %(text)s' \
            --output-file=/tmp/flake8-async-current.txt
          lint_status=$?
          set -e
          if (( lint_status > 1 )); then
            exit "${lint_status}"
          fi
          # Regenerate the baseline only after reviewing every changed finding.
          diff -u .flake8-async-baseline.txt \
            /tmp/flake8-async-current.txt

  import-linter:
    runs-on: namespace-profile-skypilot-ci-2x4
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Check import contracts
        run: |
          uv venv --seed ~/lint-env
          source ~/lint-env/bin/activate
          uv pip install import-linter==2.13
          # Contracts are static (grimp parses imports); no dep install needed.
          lint-imports

  lifecycle-removal-manifest:
    runs-on: namespace-profile-skypilot-ci-2x4
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          python-version: "3.14"
      - name: Check lifecycle removal obligations
        run: |
          uv venv --seed "${RUNNER_TEMP}/lifecycle-removals-env"
          uv pip install \
            --python "${RUNNER_TEMP}/lifecycle-removals-env/bin/python" \
            pyyaml==6.0.3
          "${RUNNER_TEMP}/lifecycle-removals-env/bin/python" \
            tools/check_lifecycle_removals.py \
            --manifest \
            docs/designs/provider-lifecycle-actuation-removals.yaml \
            --phase current

  # NOT a legacy-Python lane: our deployment is 3.14-only, but SkyPilot
  # bootstraps cluster workers with a Python 3.10 env (ray 2.9.3 has no
  # newer wheels; see requires_python in setup.py) and pip-installs this
  # wheel into it. This job only proves the wheel still installs and
  # imports on that worker floor. Delete it when the remote runtime
  # (SKY_REMOTE_RAY_VERSION + remote --python pin) moves to 3.14.
  worker-floor-import:
    runs-on: namespace-profile-skypilot-ci-2x4
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          python-version: "3.10"
      - name: Install and import sky on the cluster-worker Python
        run: |
          uv venv --seed ~/worker-env
          source ~/worker-env/bin/activate
          uv pip install -e .
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import unicodedata

          import sky
          import sky.batch.coordinator
          import sky.provision.ray_commands
          import sky.skylet.constants
          import sky.jobs.state
          import sky.data.storage
          import sky.placement.offer
          import sky.utils.json_types

          frozen = sky.utils.json_types.freeze_json({
              'z': [],
              'a': {
                  'value': True,
              },
          })
          assert isinstance(frozen, sky.utils.json_types.FrozenJSONDict)
          assert tuple(frozen) == ('a', 'z')

          probe_b64 = sky.provision.ray_commands.host_network_probe_b64()
          assert probe_b64.isascii()
          compressed_probe = base64.b64decode(probe_b64, validate=True)
          assert compressed_probe[:10].hex() == '1f8b08000000000002ff'
          assert hashlib.sha256(compressed_probe).hexdigest() == (
              '75aa9fefe49fe72bd89bcf70158467754871fa19c9541fd5fcbe5181ae285895')
          probe_source = gzip.decompress(compressed_probe).decode('utf-8')
          compile(probe_source, '<host-network-probe>', 'exec')

          for suffix in ('\U00016ff0', '\U00016ff1'):
              source = f'\u0301{suffix}'
              expected = f'{suffix}\u0301'
              assert unicodedata.ucd_3_2_0.normalize('NFC',
                                                    source) == expected
              try:
                  sky.placement.offer.OfferAcceleratorV1(name=source, count=1)
              except ValueError:
                  pass
              else:
                  raise AssertionError(
                      'Non-NFC placement text must be rejected.')
              sky.placement.offer.OfferAcceleratorV1(name=expected, count=1)

          print(sky.__version__)
          PY
      - name: Compile the whole package on the cluster-worker Python
        # The imports above only reach modules on those four import paths; a
        # 3.11+ syntax construct anywhere else in the package would still
        # install fine and only explode when a worker first imports it.
        # compileall parses every shipped module with the 3.10 grammar.
        run: |
          source ~/worker-env/bin/activate
          python -m compileall -q -x 'schemas/generated' sky

  host-network-probe-portability:
    name: "Host-network probe payload (Python ${{ matrix.python-version }})"
    runs-on: namespace-profile-skypilot-ci-2x4
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Verify deterministic probe packaging
        run: |
          uv venv --seed "$RUNNER_TEMP/probe-env"
          source "$RUNNER_TEMP/probe-env/bin/activate"
          uv pip install -e .
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import subprocess
          import sys

          script = (
              'from sky.provision import ray_commands; '
              'print(ray_commands.host_network_probe_b64())'
          )
          outputs = []
          for _ in range(2):
              result = subprocess.run(
                  [sys.executable, '-c', script],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              outputs.append(result.stdout.splitlines()[-1])

          assert outputs[0] == outputs[1]
          assert outputs[0].isascii()
          compressed = base64.b64decode(outputs[0], validate=True)
          assert compressed[:10].hex() == '1f8b08000000000002ff'
          assert hashlib.sha256(compressed).hexdigest() == (
              '75aa9fefe49fe72bd89bcf70158467754871fa19c9541fd5fcbe5181ae285895'
          )
          source = gzip.decompress(compressed).decode('utf-8')
          compile(source, '<host-network-probe>', 'exec')
          PY

  actionlint:
    runs-on: namespace-profile-skypilot-ci-1x2
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Run actionlint on workflow files
        uses: docker://rhysd/actionlint:1.7.7
        with:
          # Pre-existing style noise is ignored so real errors (invalid
          # workflow syntax, unknown keys, broken expressions) still fail:
          # shellcheck findings and the checkout@v3 age warning.
          args: >-
            -color
            -ignore "shellcheck reported issue in this script"
            -ignore "action is too old to run on GitHub Actions"
