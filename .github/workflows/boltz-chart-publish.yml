name: Publish boltz Helm chart

# Packages the fork's `charts/skypilot` Helm chart and pushes it to the private
# distribution ECR OCI registry (account 699626303757). The platform repo
# consumes it via a terraform `helm_release` pointed at
# `oci://699626303757.dkr.ecr.us-east-1.amazonaws.com/helm-charts/skypilot`,
# replacing the raw-manifest + inline-values bridge.
#
# This is the chart-publish sibling of boltz-overlay-publish.yml (which ships the
# image). It does NOT touch upstream's public chart on helm.skypilot.co.
#
# One-time setup to enable pushes (external, terraform-managed — see the platform
# repo's ecr-distribution module): create the IMMUTABLE `helm-charts/skypilot` ECR
# repo in 699626303757 and a GitHub-OIDC push role trusting this repo, then set its
# ARN as the `CHART_ECR_ROLE_ARN` repo variable. Until then the push steps no-op
# (packaging + dependency build are still exercised on every run, so PRs validate).

on:
  push:
    branches: [improvements]
    paths: ['charts/**', '.github/workflows/boltz-chart-publish.yml']
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 699626303757.dkr.ecr.us-east-1.amazonaws.com
  # OCI repository (namespace) the chart is pushed under. The chart's own name
  # (`skypilot`, from Chart.yaml) is appended by helm on push.
  OCI_REPO: helm-charts
  CHART_NAME: skypilot
  # Keep BASE_VER in sync with boltz-overlay-publish.yml and chart_version in the
  # platform repo. Normalized to SemVer below (PEP440 "-dev." -> ".dev").
  BASE_VER: 1.0.0.dev20260620

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The overlay workflow does NOT install Helm; the chart workflow must.
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.16.4'

      - name: Resolve config
        id: cfg
        run: |
          set -euo pipefail
          if [ -z "${{ vars.CHART_ECR_ROLE_ARN }}" ]; then
            echo "::warning::CHART_ECR_ROLE_ARN not set — packaging only, skipping push."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          short_sha="$(git rev-parse --short HEAD)"
          # Convert PEP440 BASE_VER to SemVer (same sed block as upstream
          # publish-helm.yml), then attach the commit as SemVer2 build metadata.
          # Build metadata keeps every commit's chart immutable/distinct while
          # remaining a valid SemVer2 that `helm push`/`helm show` accept (helm
          # maps the '+' to '_' for the OCI tag automatically).
          semver="$(echo "${BASE_VER}" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.dev([0-9]+)/\1-dev.\2/')"
          semver="$(echo "${semver}" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)/\1-rc.\2/')"
          semver="$(echo "${semver}" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)/\1-alpha.\2/')"
          semver="$(echo "${semver}" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)/\1-beta.\2/')"
          semver="$(echo "${semver}" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.post([0-9]+)/\1+post.\2/')"
          ver="${semver}+g${short_sha}"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          echo "oci_ref=oci://${ECR_REGISTRY}/${OCI_REPO}" >> "$GITHUB_OUTPUT"
          echo "chart_ref=oci://${ECR_REGISTRY}/${OCI_REPO}/${CHART_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved chart version: ${ver}"

      - name: Configure AWS credentials
        if: steps.cfg.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CHART_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR (Docker)
        if: steps.cfg.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to ECR (Helm registry)
        # amazon-ecr-login logs in the Docker client, NOT Helm. Helm needs its
        # own OCI registry login for `helm show chart` / `helm push`.
        if: steps.cfg.outputs.push == 'true'
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | helm registry login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Build chart dependencies
        # The three subchart tarballs + Chart.lock are gitignored, so they are
        # absent in CI; pull them from the public repos before packaging. `helm
        # repo add` is defensive for older helm where `dependency build` needs the
        # repos registered (helm >= 3.16 can resolve from Chart.yaml directly).
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm dependency build charts/skypilot

      - name: Version-stamp Chart.yaml
        run: |
          set -euo pipefail
          ver='${{ steps.cfg.outputs.ver }}'
          sed -i "s/^version:.*$/version: ${ver}/" charts/skypilot/Chart.yaml
          # appVersion tracks the upstream/PEP440 image version (BASE_VER).
          sed -i "s/^appVersion:.*$/appVersion: \"${BASE_VER}\"/" charts/skypilot/Chart.yaml
          echo "--- Chart.yaml (version/appVersion) ---"
          grep -E '^(version|appVersion):' charts/skypilot/Chart.yaml

      - name: Package, push (immutability-guarded) and summarize
        run: |
          set -euo pipefail
          VER='${{ steps.cfg.outputs.ver }}'
          PUSH='${{ steps.cfg.outputs.push }}'
          CHART_REF='${{ steps.cfg.outputs.chart_ref }}'
          OCI_REF='${{ steps.cfg.outputs.oci_ref }}'

          helm package charts/skypilot -d dist
          pkg="$(ls dist/${CHART_NAME}-*.tgz)"
          echo "Packaged: ${pkg}"

          pushed=false
          if [ "${PUSH}" = 'true' ]; then
            # Immutability skip-guard: ECR repos here are IMMUTABLE, so a repeat
            # push of an existing version hard-fails the job. If the version is
            # already present, skip the push (do NOT fail) — mirrors the platform
            # repo's release.yml `helm show chart` guard.
            if helm show chart "${CHART_REF}" --version "${VER}" >/dev/null 2>&1; then
              echo "::notice::${CHART_REF}:${VER} already exists — skipping push (immutable)."
            else
              helm push "${pkg}" "${OCI_REF}"
              pushed=true
            fi
          else
            echo "::warning::push disabled (CHART_ECR_ROLE_ARN unset) — packaged only."
          fi

          {
            echo "### boltz Helm chart"
            echo ""
            echo "- chart:   \`${CHART_REF}\`"
            echo "- version: \`${VER}\`"
            echo "- package: \`${pkg}\`"
            echo "- pushed:  ${pushed}"
            echo ""
            echo "Consume via a terraform \`helm_release\` with \`repository = \"${OCI_REF}\"\`, \`chart = \"${CHART_NAME}\"\`, \`version = \"${VER}\"\`."
          } >> "$GITHUB_STEP_SUMMARY"
