name: Pylint

on:
  # Trigger the workflow on push or pull request,
  # including the boltz fork's integration branch
  push:
    branches:
      - master
      - improvements
      - 'releases/**'
  pull_request:
    branches:
      - master
      - improvements
      - 'releases/**'
  merge_group:

jobs:
  pylint:
    runs-on: namespace-profile-ci-2x4
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv venv --seed ~/test-env
        source ~/test-env/bin/activate
        uv pip install --prerelease=allow "azure-cli>=2.65.0,<2.87.0"
        uv pip install ".[all]"
        uv pip install pylint==4.0.4
    - name: Analysing the code with pylint
      run: |
        source ~/test-env/bin/activate
        pylint --ignore-paths 'sky/schemas/generated' sky
