name: Publish boltz overlay image

# Builds the boltz overlay image (this fork's changed sky/ files layered on the
# pinned upstream nightly) and pushes it to the gitops-hub ECR. The platform repo
# consumes it via apiService.image in the skypilot-control-plane terragrunt.
#
# One-time setup to enable pushes: create an OIDC role in the gitops-hub account
# (255203429798) trusting this repo, with ECR push on `skypilot-nightly-boltz`,
# and set it as the `OVERLAY_ECR_ROLE_ARN` repo variable. Until then the publish
# steps no-op (the build is still exercised on demand via workflow_dispatch).

on:
  push:
    branches: [improvements]
    paths: ['sky/**', 'boltz/**', '.github/workflows/boltz-overlay-publish.yml']
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 255203429798.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: skypilot-nightly-boltz
  # Keep BASE_VER in sync with chart_version in the platform repo
  # (deployment/terragrunt/environments/gitops-hub-rainier/skypilot-control-plane),
  # normalized "-dev." -> ".dev".
  BASE_VER: 1.0.0.dev20260620

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the overlay diff against the fork base

      - name: Resolve config
        id: cfg
        run: |
          if [ -z "${{ vars.OVERLAY_ECR_ROLE_ARN }}" ]; then
            echo "::warning::OVERLAY_ECR_ROLE_ARN not set — building only, skipping push."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag_immutable=${ECR_REGISTRY}/${ECR_REPO}:${BASE_VER}-g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag_moving=${ECR_REGISTRY}/${ECR_REPO}:${BASE_VER}-improvements" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.cfg.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OVERLAY_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.cfg.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build (+ push) overlay
        run: |
          set -euo pipefail
          PUSH='${{ steps.cfg.outputs.push }}' TAG='${{ steps.cfg.outputs.tag_immutable }}' \
            ./boltz/build-overlay.sh
          if [ '${{ steps.cfg.outputs.push }}' = 'true' ]; then
            docker tag '${{ steps.cfg.outputs.tag_immutable }}' '${{ steps.cfg.outputs.tag_moving }}'
            docker push '${{ steps.cfg.outputs.tag_moving }}'
          fi
          {
            echo "### boltz overlay"
            echo ""
            echo "- immutable: \`${{ steps.cfg.outputs.tag_immutable }}\`"
            echo "- moving:    \`${{ steps.cfg.outputs.tag_moving }}\`"
            echo "- pushed:    ${{ steps.cfg.outputs.push }}"
            echo ""
            echo "Bump \`apiService.image\` in the platform repo to the immutable tag to deploy."
          } >> "$GITHUB_STEP_SUMMARY"
