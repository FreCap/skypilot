name: format

on:
  # Trigger the workflow on push or pull request,
  # including the boltz fork's integration branch
  push:
    branches:
      - master
      - improvements
      - 'releases/**'
  pull_request:
    branches:
      - master
      - improvements
      - 'releases/**'
  merge_group:

jobs:
  format:
    runs-on: namespace-profile-skypilot-ci-2x4
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v3
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv venv --seed ~/test-env
        source ~/test-env/bin/activate
        uv pip install yapf==0.43.0
        uv pip install toml==0.10.2
        uv pip install isort==5.12.0
    - name: Running yapf
      run: |
        source ~/test-env/bin/activate
        yapf --diff --recursive ./ --exclude 'sky/skylet/ray_patches/**' \
            --exclude 'infra/terraform/modules/skypilot-control-plane/scripts/seed_config.py' \
            --exclude 'sky/schemas/generated/**' \
            --exclude 'tests/unit_tests/test_sky/backends/testdata/**' \
            --exclude 'boltz/reserved_fill_reclaim_policy/**'
    - name: Running isort for yapf formatted files
      run: |
        source ~/test-env/bin/activate
        isort --diff --check ./ --sg 'sky/skylet/ray_patches/**' \
            --sg 'infra/terraform/modules/skypilot-control-plane/scripts/seed_config.py' \
            --sg 'sky/schemas/generated/**' \
            --sg 'tests/unit_tests/test_sky/backends/testdata/**' \
            --sg 'boltz/reserved_fill_reclaim_policy/**'
