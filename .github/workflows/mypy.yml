name: mypy

on:
  # Trigger the workflow on push or pull request,
  # including the boltz fork's integration branch
  push:
    branches:
      - master
      - improvements
      - 'releases/**'
  pull_request:
    branches:
      - master
      - improvements
      - 'releases/**'
  merge_group:

jobs:
  mypy:
    runs-on: namespace-profile-skypilot-ci-2x4
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv venv --seed ~/test-env
        source ~/test-env/bin/activate
        uv pip install mypy==$(grep mypy requirements-dev.txt | cut -d'=' -f3)
        uv pip install $(grep types- requirements-dev.txt | tr '\n' ' ')
        # boto3-stubs is not matched by the types- grep but several
        # type: ignore comments are only meaningful with it installed
        # (warn_unused_ignores flags them otherwise).
        uv pip install "$(grep boto3-stubs requirements-dev.txt)"
    - name: Running mypy
      run: |
        source ~/test-env/bin/activate
        mypy $(cat tests/mypy_files.txt)
    - name: Check unresolved Python references with ty
      run: |
        # This file is a runtime template whose names are injected by Ray.
        uvx ty@0.0.60 check \
          --output-format github \
          --ignore all \
          --error unresolved-reference \
          --exclude sky/backends/monkey_patches/monkey_patch_ray_up.py \
          sky
