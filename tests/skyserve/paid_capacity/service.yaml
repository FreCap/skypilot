service:
  load_balancing_policy: instance_aware_least_load
  readiness_probe:
    path: /health
    initial_delay_seconds: 10
  graceful_drain_async_occupancy: true
  load_balancer:
    stream_timeout_seconds: 180
    request_queue:
      min_size: 4
      size_per_replica: 1
      max_size: 32
      max_concurrency_per_replica: 8
      max_concurrency: 4
      timeout_seconds: 600
      max_request_body_bytes: 65536
      use_async_occupancy: true
  replica_policy:
    min_replicas: 0
    max_replicas: 2
    target_concurrency_per_replica: 1
    target_utilization_percentage: 100
    expected_request_duration_seconds: 10
    max_scale_up_rate_percentage: 100
    scale_up_rate_min_replicas: 2
    scale_up_rate_period_seconds: 10
    max_scale_down_rate_percentage: 100
    upscale_delay_seconds: 0
    downscale_delay_seconds: 60
    spot_placer: dynamic_fallback_per_gpu
    max_live_paid_gpu_units: 2
    cost_rebalance: false

resources:
  accelerators: L4:1
  use_spot: true
  ports: 8080
  any_of:
    - infra: aws
    - infra: gcp

run: |
  exec python3 - <<'PY'
  import http.server
  import json
  import os
  import re
  import threading
  import time
  import uuid

  try:
      _capacity = int(os.environ['SKYPILOT_NUM_GPUS_PER_NODE'])
  except (KeyError, TypeError, ValueError) as error:
      raise RuntimeError('SKYPILOT_NUM_GPUS_PER_NODE must be an integer') from error
  if _capacity < 1:
      raise RuntimeError('SKYPILOT_NUM_GPUS_PER_NODE must be positive')
  _lock = threading.Lock()
  _running = 0
  _MAX_SYNTHETIC_DURATION_SECONDS = 360

  class Handler(http.server.BaseHTTPRequestHandler):
      server_version = 'SkyServePaidCapacityTest/1'

      def log_message(self, _format, *_args):
          pass

      def write_json(self, status, payload):
          body = json.dumps(payload, sort_keys=True).encode()
          self.send_response(status)
          self.send_header('Content-Type', 'application/json')
          self.send_header('Content-Length', str(len(body)))
          self.end_headers()
          try:
              self.wfile.write(body)
          except (BrokenPipeError, ConnectionResetError):
              pass

      def do_GET(self):
          if self.path == '/health':
              self.write_json(200, {'status': 'ok'})
          else:
              self.write_json(404, {'error': 'not found'})

      def do_POST(self):
          global _running
          if self.path != '/v1/models/model:predict':
              self.write_json(404, {'error': 'not found'})
              return
          try:
              length = int(self.headers.get('Content-Length', '0'))
              payload = json.loads(self.rfile.read(length) or b'{}')
          except (ValueError, json.JSONDecodeError):
              self.write_json(400, {'error': 'invalid JSON'})
              return
          if payload.get('action') == 'async_capacity':
              with _lock:
                  running = _running
              self.write_json(200, {
                  'status': 'READY',
                  'running_count': running,
                  'predict_concurrency': _capacity,
                  'max_workers': _capacity,
              })
              return
          if payload.get('action') == 'async_predict':
              request_id = payload.get('request_id')
              work = payload.get('payload')
              duration = (work.get('duration_seconds')
                          if isinstance(work, dict) else None)
              attempt_id = self.headers.get('X-SkyServe-Async-Attempt-Id')
              try:
                  canonical_attempt_id = str(uuid.UUID(attempt_id))
                  attempt_no = int(
                      self.headers.get('X-SkyServe-Async-Attempt-No', '0'))
                  revision = int(
                      self.headers.get('X-SkyServe-Async-Ledger-Revision', '0'))
              except (TypeError, ValueError):
                  canonical_attempt_id = None
                  attempt_no = 0
                  revision = 0
              intent = self.headers.get('X-SkyServe-Async-Intent-Sha256', '')
              if (set(payload) != {'action', 'payload', 'request_id'} or
                      set(work or {}) != {'duration_seconds'} or
                      not isinstance(duration, (int, float)) or
                      isinstance(duration, bool) or
                      not 0 <= duration <= _MAX_SYNTHETIC_DURATION_SECONDS or
                      not isinstance(request_id, str) or not request_id or
                      self.headers.get('X-SkyServe-Async-Ledger-Protocol') != '1' or
                      not self.headers.get('X-SkyServe-Service-Incarnation') or
                      self.headers.get('X-SkyServe-Execution-Request-Id') != request_id or
                      re.fullmatch(r'[0-9a-f]{64}', intent) is None or
                      canonical_attempt_id != attempt_id or attempt_no < 1 or
                      revision < 1):
                  self.write_json(400, {'error': 'invalid exact request'})
                  return
              with _lock:
                  if _running >= _capacity:
                      self.write_json(429, {'error': 'worker capacity full'})
                      return
                  _running += 1

              def finish_async():
                  global _running
                  try:
                      time.sleep(float(duration))
                  finally:
                      with _lock:
                          _running -= 1

              threading.Thread(target=finish_async, daemon=True).start()
              self.write_json(202, {
                  'request_id': request_id,
                  'status': 'accepted',
              })
              return
          duration = payload.get('duration_seconds', 0)
          request_id = payload.get('request_id')
          if (not isinstance(duration, (int, float)) or
                  isinstance(duration, bool) or
                  not 0 <= duration <= _MAX_SYNTHETIC_DURATION_SECONDS or
                  not isinstance(request_id, str) or not request_id):
              self.write_json(400, {'error': 'invalid request'})
              return
          with _lock:
              if _running >= _capacity:
                  self.write_json(429, {'error': 'worker capacity full'})
                  return
              _running += 1
          try:
              time.sleep(float(duration))
              self.write_json(200, {
                  'request_id': request_id,
                  'status': 'ok',
              })
          finally:
              with _lock:
                  _running -= 1

  port = int(os.environ.get('PORT', '8080'))
  http.server.ThreadingHTTPServer(('0.0.0.0', port), Handler).serve_forever()
  PY
