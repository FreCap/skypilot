{{- if .Values.apiService.highAvailability.enabled }}
{{- $fullName := include "skypilot.fullname" . -}}
{{- $requestStore := include "skypilot.effectiveRequestStore" . | fromJson -}}
{{- $stateClaimName := include "skypilot.storageClaimName" . -}}
{{- $guardedHA := and (eq $requestStore.backend "postgres") (not .Values.storage.enabled) -}}
{{- $ephemeralStorage := .Values.storage.ephemeral | default (dict) -}}
{{- $stateSizeLimit := get $ephemeralStorage "stateSizeLimit" -}}
{{- $sshSizeLimit := get $ephemeralStorage "sshSizeLimit" -}}
{{- $logsSizeLimit := get $ephemeralStorage "logsSizeLimit" -}}
{{- $runtimeSizeLimit := get $ephemeralStorage "runtimeSizeLimit" -}}
{{- $credentialSizeLimit := get $ephemeralStorage "credentialSizeLimit" -}}
{{- $haConfig := .Values.apiService.highAvailability | default (dict) -}}
{{- $readinessDrainSeconds := dig "readinessDrainSeconds" 20 $haConfig -}}
{{- $executionDrainSeconds := dig "executionDrainSeconds" 30 $haConfig -}}
{{- $executorService := .Values.executorService | default (dict) -}}
{{- $executorImage := default .Values.apiService.image (get $executorService "image") -}}
{{- $executorPullPolicy := default .Values.apiService.imagePullPolicy (get $executorService "imagePullPolicy") -}}
{{- $executorReplicas := dig "replicas" 2 $executorService -}}
{{- $executorRollingUpdate := get $executorService "rollingUpdate" | default (dict) -}}
{{- $executorMaxSurge := dig "maxSurge" 0 $executorRollingUpdate -}}
{{- $executorMaxUnavailable := dig "maxUnavailable" 1 $executorRollingUpdate -}}
{{- $executorHealthPort := dig "healthPort" 46581 $executorService -}}
{{- if and .Values.apiService.metrics.enabled (eq (int $executorHealthPort) (int .Values.apiService.metrics.port)) -}}
{{- fail "executorService.healthPort must differ from apiService.metrics.port when metrics are enabled" -}}
{{- end -}}
{{- $executorTerminationGracePeriodSeconds := dig "terminationGracePeriodSeconds" 60 $executorService -}}
{{- $executorResources := dig "resources" .Values.apiService.resources $executorService -}}
{{- $executorResourceLimits := get $executorResources "limits" | default (dict) -}}
{{- $executorMemoryBudgetResource := "requests.memory" -}}
{{- if not (empty (get $executorResourceLimits "memory")) -}}
{{- $executorMemoryBudgetResource = "limits.memory" -}}
{{- end -}}
{{- $executorExtraEnvs := get $executorService "extraEnvs" -}}
{{- $executorExtraVolumes := get $executorService "extraVolumes" -}}
{{- $executorExtraVolumeMounts := get $executorService "extraVolumeMounts" -}}
{{- $executorNodeSelector := get $executorService "nodeSelector" -}}
{{- $executorTolerations := get $executorService "tolerations" -}}
{{- $executorAffinity := get $executorService "affinity" -}}
{{- $executorTopologySpreadTopologyKey := "kubernetes.io/hostname" -}}
{{- if hasKey $executorService "topologySpreadTopologyKey" -}}
{{- $executorTopologySpreadTopologyKey = get $executorService "topologySpreadTopologyKey" -}}
{{- end -}}
{{- $externalLB := .Values.serve.externalLoadBalancer | default (dict) -}}
{{- $externalLBEnabled := get $externalLB "enabled" | default false -}}
{{- $externalLBResources := get $externalLB "resources" | default (dict) -}}
{{- $externalLBAuth := get $externalLB "auth" | default (dict) -}}
{{- $lbSyncAuth := get $externalLBAuth "lbSync" | default (dict) -}}
{{- $controllerAdminAuth := get $externalLBAuth "controllerAdmin" | default (dict) -}}
{{- $lbDataPlaneAuth := get $externalLBAuth "lbDataPlane" | default (dict) -}}
{{- $lbSyncSecret := get $lbSyncAuth "existingSecret" | default "" -}}
{{- $lbSyncKey := get $lbSyncAuth "key" | default "" -}}
{{- $controllerAdminSecret := get $controllerAdminAuth "existingSecret" | default "" -}}
{{- $controllerAdminKey := get $controllerAdminAuth "key" | default "" -}}
{{- $lbDataPlaneSecret := get $lbDataPlaneAuth "existingSecret" | default "" -}}
{{- $lbDataPlaneKey := get $lbDataPlaneAuth "key" | default "" -}}
{{- $lbDataPlaneAuthEnabled := and $externalLBEnabled (not (empty $lbDataPlaneSecret)) (not (empty $lbDataPlaneKey)) -}}
{{- $executorReservedEnvNames := list "IS_SKYPILOT_SERVER" "KUBECONFIG" "POD_IP" "PROMETHEUS_MULTIPROC_DIR" "SKY_API_SERVER_METRICS_ENABLED" "SKYPILOT_API_DEPLOYMENT_NAME" "SKYPILOT_API_REQUEST_BACKEND" "SKYPILOT_API_REQUEST_CUTOVER_GATE_PATH" "SKYPILOT_API_REQUIRE_EXECUTION_QUIESCENCE_BACKENDS" "SKYPILOT_API_SERVER_ENDPOINT" "SKYPILOT_API_SERVER_INSTANCE_ID" "SKYPILOT_API_SERVER_ROLE" "SKYPILOT_API_SERVER_STORAGE_ENABLED" "SKYPILOT_DB_CONNECTION_URI" "SKYPILOT_DEV" "SKYPILOT_EXECUTION_DRAIN_SECONDS" "SKYPILOT_IN_CLUSTER_NAMESPACE" "SKYPILOT_POD_CPU_CORE_LIMIT" "SKYPILOT_POD_MEMORY_BYTES_LIMIT" "SKYPILOT_POD_NAME" "SKYPILOT_POD_NAMESPACE" "SKYPILOT_POD_UID" "SKYPILOT_RELEASE_NAME" "SKYPILOT_ROLLING_UPDATE_ENABLED" "SKYPILOT_SERVER_CONFIG_MODE" "SKYPILOT_SERVER_SERVE_CONTROLLER_HOLD" "SKYPILOT_SERVE_API_SERVICE_URL" "SKYPILOT_SERVE_CONTROLLER_ADMIN_AUTH_TOKENS_FILE" "SKYPILOT_SERVE_EXTERNAL_LB_ENABLED" "SKYPILOT_SERVE_EXTERNAL_LB_SERVICE_ANNOTATIONS_JSON" "SKYPILOT_SERVE_LB_AUTH_TOKENS_FILE" "SKYPILOT_SERVE_LB_DATA_PLANE_AUTH_ENABLED" "SKYPILOT_SERVE_LB_HA_RBAC_READY" "SKYPILOT_SERVE_LB_RESOURCES_JSON" "SKYPILOT_SERVE_LB_SYNC_AUTH_TOKENS_FILE" "SKYPILOT_STATE_DB_MIGRATION_MODE" -}}
{{- if .Values.awsCredentials.enabled -}}
{{- $executorReservedEnvNames = concat $executorReservedEnvNames (list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY") -}}
{{- end -}}
{{- if .Values.digitaloceanCredentials.enabled -}}
{{- $executorReservedEnvNames = append $executorReservedEnvNames "DIGITALOCEAN_CREDENTIALS" -}}
{{- end -}}
{{- if .Values.gcpCredentials.enabled -}}
{{- $executorReservedEnvNames = append $executorReservedEnvNames "GOOGLE_APPLICATION_CREDENTIALS" -}}
{{- end -}}
{{- if .Values.lambdaCredentials.enabled -}}
{{- $executorReservedEnvNames = append $executorReservedEnvNames "LAMBDA_API_KEY" -}}
{{- end -}}
{{- if .Values.r2Credentials.enabled -}}
{{- $executorReservedEnvNames = concat $executorReservedEnvNames (list "R2_ACCOUNT_ID" "R2_CREDENTIALS") -}}
{{- end -}}
{{- if .Values.runpodCredentials.enabled -}}
{{- $executorReservedEnvNames = append $executorReservedEnvNames "RUNPOD_API_KEY" -}}
{{- end -}}
{{- if .Values.vastCredentials.enabled -}}
{{- $executorReservedEnvNames = append $executorReservedEnvNames "VAST_API_KEY" -}}
{{- end -}}

{{- $executorReservedVolumeNames := list "kube-volume" "logs-volume" "skypilot-role-runtime" "skypilot-serve-controller-admin-auth" "skypilot-serve-lb-auth" "skypilot-serve-lb-sync-auth" "skypilot-server-config" "skypilot-ssh-identity" "skypilot-ssh-node-pools" "ssh-volume" "state-volume" -}}
{{- if .Values.awsCredentials.enabled -}}
{{- $executorReservedVolumeNames = concat $executorReservedVolumeNames (list "aws-config" "aws-config-files") -}}
{{- end -}}
{{- if .Values.coreweaveCredentials.enabled -}}
{{- $executorReservedVolumeNames = concat $executorReservedVolumeNames (list "coreweave-config" "coreweave-credentials") -}}
{{- end -}}
{{- if .Values.digitaloceanCredentials.enabled -}}
{{- $executorReservedVolumeNames = append $executorReservedVolumeNames "digitalocean-config" -}}
{{- end -}}
{{- if .Values.gcpCredentials.enabled -}}
{{- $executorReservedVolumeNames = concat $executorReservedVolumeNames (list "gcp-config" "gcp-credentials") -}}
{{- end -}}
{{- if .Values.kubernetesCredentials.useKubeconfig -}}
{{- $executorReservedVolumeNames = append $executorReservedVolumeNames "kube-config" -}}
{{- end -}}
{{- if .Values.lambdaCredentials.enabled -}}
{{- $executorReservedVolumeNames = append $executorReservedVolumeNames "lambda-config" -}}
{{- end -}}
{{- if .Values.nebiusCredentials.enabled -}}
{{- $executorReservedVolumeNames = append $executorReservedVolumeNames "nebius-credentials" -}}
{{- end -}}
{{- if .Values.r2Credentials.enabled -}}
{{- $executorReservedVolumeNames = append $executorReservedVolumeNames "r2-config" -}}
{{- end -}}
{{- if .Values.runpodCredentials.enabled -}}
{{- $executorReservedVolumeNames = append $executorReservedVolumeNames "runpod-config" -}}
{{- end -}}
{{- if .Values.slurmCredentials.config -}}
{{- $executorReservedVolumeNames = append $executorReservedVolumeNames "slurm-config" -}}
{{- end -}}
{{- if .Values.vastCredentials.enabled -}}
{{- $executorReservedVolumeNames = append $executorReservedVolumeNames "vast-config" -}}
{{- end -}}

{{- $executorReservedMountPaths := list "/etc/skypilot/serve-auth/controller-admin" "/etc/skypilot/serve-auth/lb-data-plane" "/etc/skypilot/serve-auth/lb-sync" "/root/.sky" "/root/.sky/.server.yaml" "/root/.ssh" "/root/sky_logs" "/var/run/skypilot" "/var/skypilot/ssh_keys" "/var/skypilot/ssh_node_pool" -}}
{{- if .Values.awsCredentials.enabled -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.aws" -}}
{{- end -}}
{{- if .Values.coreweaveCredentials.enabled -}}
{{- $executorReservedMountPaths = concat $executorReservedMountPaths (list "/root/.coreweave" "/root/.coreweave_credentials") -}}
{{- end -}}
{{- if .Values.digitaloceanCredentials.enabled -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.config/doctl" -}}
{{- end -}}
{{- if .Values.gcpCredentials.enabled -}}
{{- $executorReservedMountPaths = concat $executorReservedMountPaths (list "/root/.config/gcloud" "/root/gcp-cred.json") -}}
{{- end -}}
{{- if .Values.kubernetesCredentials.useKubeconfig -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/var/skypilot/kubeconfig" -}}
{{- end -}}
{{- if .Values.apiService.sshNodePools -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.kube" -}}
{{- else if .Values.kubernetesCredentials.useKubeconfig -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.kube" -}}
{{- end -}}
{{- if .Values.lambdaCredentials.enabled -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.lambda_cloud" -}}
{{- end -}}
{{- if .Values.nebiusCredentials.enabled -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.nebius_credentials" -}}
{{- end -}}
{{- if .Values.r2Credentials.enabled -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.cloudflare" -}}
{{- end -}}
{{- if .Values.runpodCredentials.enabled -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.runpod" -}}
{{- end -}}
{{- if .Values.slurmCredentials.config -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.slurm" -}}
{{- end -}}
{{- if .Values.vastCredentials.enabled -}}
{{- $executorReservedMountPaths = append $executorReservedMountPaths "/root/.config/vastai" -}}
{{- end -}}
{{- if $guardedHA }}
{{ include "skypilot.requireRoleEphemeralStorage" (dict "role" "executorService" "resources" $executorResources "ephemeralStorage" $ephemeralStorage) }}
{{- end }}
{{ include "skypilot.validatePodExtras" (dict "envLists" (list .Values.global.extraEnvs .Values.databaseConnection.extraEnvs .Values.apiService.extraEnvs $executorExtraEnvs) "reservedEnvNames" $executorReservedEnvNames "volumeLists" (list .Values.databaseConnection.extraVolumes .Values.apiService.extraVolumes $executorExtraVolumes) "reservedVolumeNames" $executorReservedVolumeNames "mountLists" (list .Values.databaseConnection.extraVolumeMounts .Values.apiService.extraVolumeMounts $executorExtraVolumeMounts) "reservedMountPaths" $executorReservedMountPaths "guardedEphemeralProfile" $guardedHA) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-executor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ $executorReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- /* Use dig rather than default so an explicit integer zero is kept. */}}
      maxSurge: {{ $executorMaxSurge }}
      maxUnavailable: {{ $executorMaxUnavailable }}
  selector:
    matchLabels:
      app: {{ $fullName }}-executor
  template:
    metadata:
      annotations:
        {{- if .Values.apiService.metrics.enabled }}
        {{- if .Values.prometheus.useDedicatedScrapeConfig }}
        skypilot.co/scrape: "true"
        skypilot.co/path: "/metrics"
        skypilot.co/port: {{ .Values.apiService.metrics.port | quote }}
        {{- else }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.apiService.metrics.port | quote }}
        {{- end }}
        {{- end }}
      labels:
        app: {{ $fullName }}-executor
        app.kubernetes.io/instance: {{ .Release.Name }}
        skypilot.co/role: executor
    spec:
      automountServiceAccountToken: {{ or .Values.kubernetesCredentials.useApiServerCluster $externalLBEnabled }}
      serviceAccountName: {{ include "skypilot.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ $executorTerminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: skypilot-executor
        image: {{ include "common.image" (dict "root" . "image" $executorImage) }}
        imagePullPolicy: {{ $executorPullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml $executorResources | nindent 10 }}
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - touch /var/run/skypilot/draining && sleep {{ $readinessDrainSeconds }}
        env:
        {{- with .Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.databaseConnection.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.apiService.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $executorExtraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: SKYPILOT_DEV
          value: {{ .Values.apiService.skypilotDev | quote }}
        - name: SKYPILOT_RELEASE_NAME
          value: {{ $fullName | quote }}
        - name: SKYPILOT_API_REQUEST_BACKEND
          value: postgres
        - name: SKYPILOT_API_REQUIRE_EXECUTION_QUIESCENCE_BACKENDS
          value: {{ default false $requestStore.enforceBuiltinExecutionQuiescenceBackends | quote }}
        - name: SKYPILOT_API_REQUEST_CUTOVER_GATE_PATH
          value: {{ $requestStore.cutoverGatePath | quote }}
        - name: SKYPILOT_API_SERVER_ENDPOINT
          value: {{ printf "http://%s-api-service.%s.svc" $fullName .Release.Namespace | quote }}
        - name: SKYPILOT_API_SERVER_ROLE
          value: executor
        - name: IS_SKYPILOT_SERVER
          value: "true"
        - name: SKYPILOT_SERVER_CONFIG_MODE
          value: postgres
        {{- if .Values.apiService.metrics.enabled }}
        - name: SKY_API_SERVER_METRICS_ENABLED
          value: "true"
        - name: PROMETHEUS_MULTIPROC_DIR
          value: /tmp/metrics
        {{- end }}
        - name: SKYPILOT_API_SERVER_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: SKYPILOT_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: SKYPILOT_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SKYPILOT_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SKYPILOT_ROLLING_UPDATE_ENABLED
          value: "true"
        - name: SKYPILOT_API_SERVER_STORAGE_ENABLED
          value: {{ ternary "true" "false" .Values.storage.enabled | quote }}
        - name: SKYPILOT_SERVER_SERVE_CONTROLLER_HOLD
          value: {{ ternary "true" "false" .Values.serve.controllerHold | quote }}
        - name: SKYPILOT_EXECUTION_DRAIN_SECONDS
          value: {{ $executionDrainSeconds | quote }}
        {{- if .Values.apiService.dbConnectionSecretName }}
        - name: SKYPILOT_DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.apiService.dbConnectionSecretName }}
              key: connection_string
        {{- else }}
        - name: SKYPILOT_DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-db-connection
              key: connection_string
        {{- end }}
        - name: SKYPILOT_STATE_DB_MIGRATION_MODE
          value: verify
        - name: SKYPILOT_POD_CPU_CORE_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: skypilot-executor
              resource: requests.cpu
        - name: SKYPILOT_POD_MEMORY_BYTES_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: skypilot-executor
              resource: {{ $executorMemoryBudgetResource }}
        {{- if .Values.gcpCredentials.enabled }}
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /root/gcp-cred.json
        {{- end }}
        {{- if .Values.kubernetesCredentials.inclusterNamespace }}
        - name: SKYPILOT_IN_CLUSTER_NAMESPACE
          value: {{ .Values.kubernetesCredentials.inclusterNamespace }}
        {{- end }}
        {{- if and .Values.kubernetesCredentials.useKubeconfig .Values.apiService.sshNodePools }}
        - name: KUBECONFIG
          value: /root/.kube/config:/var/skypilot/kubeconfig/config
        {{- end }}
        - name: SKYPILOT_SERVE_EXTERNAL_LB_ENABLED
          value: {{ ternary "true" "false" $externalLBEnabled | quote }}
        {{- if $externalLBEnabled }}
        - name: SKYPILOT_SERVE_LB_HA_RBAC_READY
          value: "true"
        - name: SKYPILOT_API_DEPLOYMENT_NAME
          value: {{ printf "%s-api-server" $fullName | quote }}
        - name: SKYPILOT_SERVE_API_SERVICE_URL
          value: {{ printf "http://%s-api-service.%s.svc" $fullName .Release.Namespace | quote }}
        - name: SKYPILOT_SERVE_LB_RESOURCES_JSON
          value: {{ toJson $externalLBResources | quote }}
        - name: SKYPILOT_SERVE_EXTERNAL_LB_SERVICE_ANNOTATIONS_JSON
          value: {{ include "skypilot.externalLBServiceAnnotationsJson" . | quote }}
        - name: SKYPILOT_SERVE_LB_SYNC_AUTH_TOKENS_FILE
          value: /etc/skypilot/serve-auth/lb-sync/tokens
        - name: SKYPILOT_SERVE_CONTROLLER_ADMIN_AUTH_TOKENS_FILE
          value: /etc/skypilot/serve-auth/controller-admin/tokens
        - name: SKYPILOT_SERVE_LB_DATA_PLANE_AUTH_ENABLED
          value: {{ ternary "true" "false" $lbDataPlaneAuthEnabled | quote }}
        {{- if $lbDataPlaneAuthEnabled }}
        - name: SKYPILOT_SERVE_LB_AUTH_TOKENS_FILE
          value: /etc/skypilot/serve-auth/lb-data-plane/tokens
        {{- end }}
        {{- end }}
        command: ["tini", "--"]
        args:
        - /bin/sh
        - -c
        - |
          set -e
          {{- if .Values.apiService.metrics.enabled }}
          # Make the directory available to pre-deploy hooks. It is reset
          # after every hook/setup command and immediately before Python.
          mkdir -p /tmp/metrics
          {{- end }}
          {{- if .Values.apiService.preDeployHook }}
          {{ .Values.apiService.preDeployHook | nindent 10 }}
          {{- end }}
          mkdir -p /root/.sky
          {{- if .Values.apiService.sshNodePools }}
          ln -sf /var/skypilot/ssh_node_pool/ssh_node_pools.yaml /root/.sky/ssh_node_pools.yaml
          mkdir -p /root/.kube
          if [ ! -s /root/.kube/config ]; then
            kubeconfig_tmp="/root/.kube/.config.${SKYPILOT_POD_UID}.tmp"
            printf '{}\n' > "$kubeconfig_tmp"
            if [ ! -e /root/.kube/config ]; then
              mv -n "$kubeconfig_tmp" /root/.kube/config
            fi
            if [ ! -s /root/.kube/config ]; then
              mv -f "$kubeconfig_tmp" /root/.kube/config
            else
              rm -f "$kubeconfig_tmp"
            fi
          fi
          {{- end }}
          {{- if .Values.apiService.sshKeySecret }}
          mkdir -p /root/.ssh
          for file in /var/skypilot/ssh_keys/*; do
            if [ -f "$file" ]; then
              ln -sf "$file" "/root/.ssh/$(basename "$file")"
            fi
          done
          {{- end }}
          {{- if .Values.nebiusCredentials.enabled }}
          mkdir -p /root/.nebius
          for file in /root/.nebius_credentials/*; do
            if [ -f "$file" ]; then
              ln -sf "$file" "/root/.nebius/$(basename "$file")"
            fi
          done
          echo "{{ .Values.nebiusCredentials.tenantId }}" > /root/.nebius/NEBIUS_TENANT_ID.txt
          nebius profile create --profile sky --endpoint api.nebius.cloud --service-account-file /root/.nebius/credentials.json || true
          {{- end }}
          {{- if .Values.apiService.metrics.enabled }}
          # The reaper removes only dead-process live gauges. Counters and
          # histograms survive, so never inherit files created by a hook or a
          # previous supervisor invocation.
          export PROMETHEUS_MULTIPROC_DIR=/tmp/metrics
          rm -rf /tmp/metrics
          mkdir -p /tmp/metrics
          {{- end }}
          exec python -m sky.server.server --deploy --host 0.0.0.0 \
            --role executor --role-health-port {{ $executorHealthPort }} \
            --metrics-port {{ .Values.apiService.metrics.port }}
        ports:
        - name: health
          containerPort: {{ $executorHealthPort }}
        {{- if .Values.apiService.metrics.enabled }}
        - name: metrics
          containerPort: {{ .Values.apiService.metrics.port }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /readyz
            port: health
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /livez
            port: health
          periodSeconds: 10
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 1
        volumeMounts:
        - name: skypilot-role-runtime
          mountPath: /var/run/skypilot
        {{- if $guardedHA }}
        - name: state-volume
          mountPath: /root/.sky
        - name: ssh-volume
          mountPath: /root/.ssh
        - name: logs-volume
          mountPath: /root/sky_logs
        {{- else }}
        - name: state-volume
          mountPath: /root/.sky
          subPath: .sky
        - name: state-volume
          mountPath: /root/.ssh
          subPath: .ssh
        - name: state-volume
          mountPath: /root/sky_logs
          subPath: sky_logs
        {{- end }}
        {{- if or .Values.auth.externalProxy.enabled (eq (include "skypilot.ingressOAuthEnabled" .) "true") }}
        - name: skypilot-server-config
          mountPath: /root/.sky/.server.yaml
          subPath: server.yaml
          readOnly: true
        {{- end }}
        {{- if .Values.apiService.sshNodePools }}
        - name: skypilot-ssh-node-pools
          mountPath: /var/skypilot/ssh_node_pool
        {{- end }}
        {{- if .Values.apiService.sshKeySecret }}
        - name: skypilot-ssh-identity
          mountPath: /var/skypilot/ssh_keys
        {{- end }}
        {{- if .Values.slurmCredentials.config }}
        - name: slurm-config
          mountPath: /root/.slurm
        {{- end }}
        {{- if .Values.awsCredentials.enabled }}
        - name: {{ ternary "aws-config-files" "aws-config" .Values.awsCredentials.useCredentialsFile }}
          mountPath: /root/.aws
          readOnly: true
        {{- end }}
        {{- if .Values.r2Credentials.enabled }}
        - name: r2-config
          mountPath: /root/.cloudflare
          readOnly: true
        {{- end }}
        {{- if .Values.coreweaveCredentials.enabled }}
        - name: coreweave-config
          mountPath: /root/.coreweave
          readOnly: true
        {{- end }}
        {{- if .Values.gcpCredentials.enabled }}
        - name: gcp-config
          mountPath: /root/.config/gcloud
        - name: gcp-credentials
          mountPath: /root/gcp-cred.json
          subPath: gcp-cred.json
        {{- end }}
        {{- if .Values.kubernetesCredentials.useKubeconfig }}
        - name: kube-config
          mountPath: {{ ternary "/var/skypilot/kubeconfig" "/root/.kube" (not (empty .Values.apiService.sshNodePools)) }}
        {{- end }}
        {{- if .Values.apiService.sshNodePools }}
        {{- if $guardedHA }}
        - name: kube-volume
          mountPath: /root/.kube
        {{- else }}
        - name: state-volume
          mountPath: /root/.kube
          subPath: .kube
        {{- end }}
        {{- end }}
        {{- if .Values.runpodCredentials.enabled }}
        - name: runpod-config
          mountPath: /root/.runpod
          readOnly: true
        {{- end }}
        {{- if .Values.digitaloceanCredentials.enabled }}
        - name: digitalocean-config
          mountPath: /root/.config/doctl
          readOnly: true
        {{- end }}
        {{- if .Values.lambdaCredentials.enabled }}
        - name: lambda-config
          mountPath: /root/.lambda_cloud
          readOnly: true
        {{- end }}
        {{- if .Values.vastCredentials.enabled }}
        - name: vast-config
          mountPath: /root/.config/vastai
          readOnly: true
        {{- end }}
        {{- if .Values.nebiusCredentials.enabled }}
        - name: nebius-credentials
          mountPath: /root/.nebius_credentials
        {{- end }}
        {{- if $externalLBEnabled }}
        - name: skypilot-serve-lb-sync-auth
          mountPath: /etc/skypilot/serve-auth/lb-sync
          readOnly: true
        - name: skypilot-serve-controller-admin-auth
          mountPath: /etc/skypilot/serve-auth/controller-admin
          readOnly: true
        {{- if $lbDataPlaneAuthEnabled }}
        - name: skypilot-serve-lb-auth
          mountPath: /etc/skypilot/serve-auth/lb-data-plane
          readOnly: true
        {{- end }}
        {{- end }}
        {{- with .Values.databaseConnection.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.apiService.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $executorExtraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      initContainers:
      {{- if and .Values.awsCredentials.enabled (not .Values.awsCredentials.useCredentialsFile) }}
      - name: create-aws-credentials
        image: {{ include "common.image" (dict "root" . "image" $executorImage) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          mkdir -p /root/.aws
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.awsCredentials.awsSecretName }}
              key: {{ .Values.awsCredentials.accessKeyIdKeyName }}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.awsCredentials.awsSecretName }}
              key: {{ .Values.awsCredentials.secretAccessKeyKeyName }}
        volumeMounts:
        - name: aws-config
          mountPath: /root/.aws
      {{- end }}
      {{- if .Values.r2Credentials.enabled }}
      - name: setup-r2-credentials
        image: {{ include "common.image" (dict "root" . "image" $executorImage) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          mkdir -p /root/.cloudflare
          printf '%s\n' "$R2_CREDENTIALS" > /root/.cloudflare/r2.credentials
          printf '%s\n' "$R2_ACCOUNT_ID" > /root/.cloudflare/accountid
          chmod 600 /root/.cloudflare/r2.credentials /root/.cloudflare/accountid
        env:
        - name: R2_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.r2Credentials.r2SecretName }}
              key: r2.credentials
        - name: R2_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.r2Credentials.r2SecretName }}
              key: accountid
        volumeMounts:
        - name: r2-config
          mountPath: /root/.cloudflare
      {{- end }}
      {{- if .Values.gcpCredentials.enabled }}
      - name: setup-gcp-credentials
        image: {{ include "common.image" (dict "root" . "image" .Values.gcpCredentials.image) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          gcloud auth activate-service-account --key-file=/root/gcp-cred.json
          gcloud config set project {{ .Values.gcpCredentials.projectId }}
        volumeMounts:
        - name: gcp-credentials
          mountPath: /root/gcp-cred.json
          subPath: gcp-cred.json
        - name: gcp-config
          mountPath: /root/.config/gcloud
      {{- end }}
      {{- if .Values.coreweaveCredentials.enabled }}
      - name: setup-coreweave-credentials
        image: {{ include "common.image" (dict "root" . "image" $executorImage) }}
        command: ["/bin/sh", "-c"]
        args:
        - cp /root/.coreweave_credentials/* /root/.coreweave/
        volumeMounts:
        - name: coreweave-credentials
          mountPath: /root/.coreweave_credentials
        - name: coreweave-config
          mountPath: /root/.coreweave
      {{- end }}
      {{- if .Values.runpodCredentials.enabled }}
      - name: create-runpod-credentials
        image: {{ include "common.image" (dict "root" . "image" $executorImage) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          mkdir -p /root/.runpod
          printf '[default]\napi_key = "%s"\n' "$RUNPOD_API_KEY" > /root/.runpod/config.toml
        env:
        - name: RUNPOD_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.runpodCredentials.runpodSecretName }}
              key: api_key
        volumeMounts:
        - name: runpod-config
          mountPath: /root/.runpod
      {{- end }}
      {{- if .Values.digitaloceanCredentials.enabled }}
      - name: create-digitalocean-credentials
        image: {{ include "common.image" (dict "root" . "image" $executorImage) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          mkdir -p /root/.config/doctl
          printf 'access-token: %s\n' "$DIGITALOCEAN_CREDENTIALS" > /root/.config/doctl/config.yaml
        env:
        - name: DIGITALOCEAN_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.digitaloceanCredentials.digitaloceanSecretName }}
              key: api_key
        volumeMounts:
        - name: digitalocean-config
          mountPath: /root/.config/doctl
      {{- end }}
      {{- if .Values.lambdaCredentials.enabled }}
      - name: create-lambda-credentials
        image: {{ include "common.image" (dict "root" . "image" $executorImage) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          mkdir -p /root/.lambda_cloud
          printf 'api_key = %s\n' "$LAMBDA_API_KEY" > /root/.lambda_cloud/lambda_keys
        env:
        - name: LAMBDA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.lambdaCredentials.lambdaSecretName }}
              key: api_key
        volumeMounts:
        - name: lambda-config
          mountPath: /root/.lambda_cloud
      {{- end }}
      {{- if .Values.vastCredentials.enabled }}
      - name: create-vast-credentials
        image: {{ include "common.image" (dict "root" . "image" $executorImage) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          mkdir -p /root/.config/vastai
          printf '%s\n' "$VAST_API_KEY" > /root/.config/vastai/vast_api_key
        env:
        - name: VAST_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.vastCredentials.vastSecretName }}
              key: api_key
        volumeMounts:
        - name: vast-config
          mountPath: /root/.config/vastai
      {{- end }}
      {{- with .Values.extraInitContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      volumes:
      - name: skypilot-role-runtime
        emptyDir:
          sizeLimit: {{ $runtimeSizeLimit | quote }}
      {{- if $guardedHA }}
      - name: state-volume
        emptyDir:
          sizeLimit: {{ $stateSizeLimit | quote }}
      - name: ssh-volume
        emptyDir:
          sizeLimit: {{ $sshSizeLimit | quote }}
      - name: logs-volume
        emptyDir:
          sizeLimit: {{ $logsSizeLimit | quote }}
      {{- if .Values.apiService.sshNodePools }}
      - name: kube-volume
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
      {{- end }}
      {{- else }}
      - name: state-volume
        persistentVolumeClaim:
          claimName: {{ $stateClaimName }}
      {{- end }}
      {{- if or .Values.auth.externalProxy.enabled (eq (include "skypilot.ingressOAuthEnabled" .) "true") }}
      - name: skypilot-server-config
        configMap:
          name: {{ $fullName }}-server-config
      {{- end }}
      {{- if .Values.apiService.sshNodePools }}
      - name: skypilot-ssh-node-pools
        secret:
          secretName: {{ $fullName }}-ssh-node-pools
      {{- end }}
      {{- if .Values.apiService.sshKeySecret }}
      - name: skypilot-ssh-identity
        secret:
          secretName: {{ .Values.apiService.sshKeySecret }}
          defaultMode: 0600
      {{- end }}
      {{- if .Values.slurmCredentials.config }}
      - name: slurm-config
        secret:
          secretName: {{ $fullName }}-slurm-config
      {{- end }}
      {{- if .Values.awsCredentials.enabled }}
      - name: {{ ternary "aws-config-files" "aws-config" .Values.awsCredentials.useCredentialsFile }}
        {{- if .Values.awsCredentials.useCredentialsFile }}
        secret:
          secretName: {{ .Values.awsCredentials.awsSecretName }}
        {{- else }}
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.gcpCredentials.enabled }}
      - name: gcp-credentials
        secret:
          secretName: {{ .Values.gcpCredentials.gcpSecretName }}
      - name: gcp-config
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
      {{- end }}
      {{- if .Values.coreweaveCredentials.enabled }}
      - name: coreweave-credentials
        secret:
          secretName: {{ .Values.coreweaveCredentials.coreweaveSecretName }}
      - name: coreweave-config
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
      {{- end }}
      {{- if .Values.runpodCredentials.enabled }}
      - name: runpod-config
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
      {{- end }}
      {{- if .Values.digitaloceanCredentials.enabled }}
      - name: digitalocean-config
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
      {{- end }}
      {{- if .Values.lambdaCredentials.enabled }}
      - name: lambda-config
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
      {{- end }}
      {{- if .Values.vastCredentials.enabled }}
      - name: vast-config
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
      {{- end }}
      {{- if .Values.r2Credentials.enabled }}
      - name: r2-config
        emptyDir:
          sizeLimit: {{ $credentialSizeLimit | quote }}
      {{- end }}
      {{- if .Values.nebiusCredentials.enabled }}
      - name: nebius-credentials
        secret:
          secretName: {{ .Values.nebiusCredentials.nebiusSecretName }}
      {{- end }}
      {{- if .Values.kubernetesCredentials.useKubeconfig }}
      - name: kube-config
        secret:
          secretName: {{ .Values.kubernetesCredentials.kubeconfigSecretName }}
      {{- end }}
      {{- if $externalLBEnabled }}
      - name: skypilot-serve-lb-sync-auth
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: {{ $lbSyncSecret | quote }}
              items:
              - key: {{ $lbSyncKey | quote }}
                path: tokens
      - name: skypilot-serve-controller-admin-auth
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: {{ $controllerAdminSecret | quote }}
              items:
              - key: {{ $controllerAdminKey | quote }}
                path: tokens
      {{- if $lbDataPlaneAuthEnabled }}
      - name: skypilot-serve-lb-auth
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: {{ $lbDataPlaneSecret | quote }}
              items:
              - key: {{ $lbDataPlaneKey | quote }}
                path: tokens
      {{- end }}
      {{- end }}
      {{- with .Values.databaseConnection.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.apiService.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with $executorExtraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with $executorNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $executorTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $executorAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $executorTopologySpreadTopologyKey }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: {{ $executorTopologySpreadTopologyKey }}
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: {{ $fullName }}-executor
      {{- end }}
{{- end }}
