{{- $haConfig := .Values.apiService.highAvailability | default (dict) -}}
{{- $haEnabled := get $haConfig "enabled" | default false -}}
{{- if not $haEnabled }}
{{- $fullName := include "skypilot.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |-
    {{- if .Values.apiService.config }}
    {{- .Values.apiService.config | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
{{- end }}
