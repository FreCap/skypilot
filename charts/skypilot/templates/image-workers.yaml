      terminationGracePeriodSeconds: {{ int $canaryTerminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: image-canary-worker
        image: {{ include "common.image" (dict "root" . "image" (default .Values.apiService.image .Values.imageCanaryWorker.image)) }}
