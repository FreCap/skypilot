        - name: SKYPILOT_IMAGE_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: SKYPILOT_IMAGE_MAX_IN_FLIGHT
          value: {{ .Values.imageCanaryWorker.maxInFlight | quote }}
        - name: SKYPILOT_IMAGE_HEALTH_PORT
          value: {{ .Values.imageCanaryWorker.healthPort | quote }}
        - name: SKYPILOT_IMAGE_LIVENESS_DEADLINE_SECONDS
          value: {{ .Values.imageCanaryWorker.livenessDeadlineSeconds | quote }}
        - name: SKYPILOT_STATE_DB_MIGRATION_MODE
          value: {{ ternary "verify" "auto" .Values.databaseMigration.enabled | quote }}
        {{- if $authorityV1RetirementActive }}
        - name: SKYPILOT_SERVER_SERVE_SCHEMA_MIGRATION_CEILING
          value: "037"
        {{- end }}
        {{- if .Values.imageCanaryWorker.kubeconfigSecretName }}
        - name: KUBECONFIG
          value: /var/skypilot/kubeconfig/config
        {{- end }}
        {{- if .Values.apiService.dbConnectionSecretName }}
        - name: SKYPILOT_DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.apiService.dbConnectionSecretName }}
              key: connection_string
        {{- else }}
        - name: SKYPILOT_DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-db-connection
              key: connection_string
        {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - name: health
          containerPort: {{ .Values.imageCanaryWorker.healthPort }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /live
            port: health
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /live
            port: health
          periodSeconds: 10
          failureThreshold: 3
        resources:
          {{- toYaml .Values.imageCanaryWorker.resources | nindent 10 }}
        volumeMounts:
        - name: skypilot-config
          mountPath: /var/skypilot/config
          readOnly: true
        {{- if .Values.imageCanaryWorker.kubeconfigSecretName }}
        - name: kubeconfig
          mountPath: /var/skypilot/kubeconfig
          readOnly: true
        {{- end }}
        {{- with .Values.databaseConnection.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      - name: skypilot-config
        configMap:
          name: {{ $fullName }}-config
      {{- if .Values.imageCanaryWorker.kubeconfigSecretName }}
      - name: kubeconfig
        secret:
          secretName: {{ .Values.imageCanaryWorker.kubeconfigSecretName }}
      {{- end }}
      {{- with .Values.databaseConnection.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.imageCanaryWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imageCanaryWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imageCanaryWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
