        command: ["tini", "--", "python", "-m", "sky.container_images.canary_worker_service"]
        env:
        {{- range concat (default (list) $.Values.global.extraEnvs) (default (list) .Values.databaseConnection.extraEnvs) (default (list) .Values.imageCanaryWorker.extraEnvs) }}
        {{- if eq .name "SKYPILOT_STATE_DB_MIGRATION_MODE" }}
        {{- fail "SKYPILOT_STATE_DB_MIGRATION_MODE is managed by databaseMigration and cannot be set through extraEnvs" }}
        {{- end }}
        {{- end }}
        {{- with .Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.databaseConnection.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.imageCanaryWorker.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: IS_SKYPILOT_SERVER
          value: "true"
        - name: SKYPILOT_GLOBAL_CONFIG
