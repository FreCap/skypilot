  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if .Values.imageCanaryWorker.enabled }}
{{ include "skypilot.validatePodExtras" (dict "envLists" (list .Values.global.extraEnvs .Values.databaseConnection.extraEnvs .Values.imageCanaryWorker.extraEnvs) "reservedEnvNames" $workerReservedEnvNames "volumeLists" (list .Values.databaseConnection.extraVolumes) "reservedVolumeNames" (list "skypilot-config" "kubeconfig") "mountLists" (list .Values.databaseConnection.extraVolumeMounts) "reservedMountPaths" (list "/var/skypilot/config" "/var/skypilot/kubeconfig")) }}
