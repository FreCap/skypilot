{{- $fullName := include "skypilot.fullname" . -}}
{{- $stateClaimName := include "skypilot.storageClaimName" . -}}
{{- $haConfig := .Values.apiService.highAvailability | default (dict) -}}
{{- $haEnabled := get $haConfig "enabled" | default false -}}
{{- $rollingUpdate := .Values.apiService.rollingUpdate | default (dict) -}}
{{- $rollingUpdateMaxSurge := dig "maxSurge" 1 $rollingUpdate -}}
{{- $rollingUpdateMaxUnavailable := dig "maxUnavailable" 0 $rollingUpdate -}}
{{- if and (not .Values.storage.enabled) (not (empty (get .Values.storage "existingClaim"))) -}}
{{- fail "storage.existingClaim requires storage.enabled=true" -}}
{{- end -}}
{{- $readinessDrainSeconds := dig "readinessDrainSeconds" 20 $haConfig -}}
{{- $apiTopologySpreadTopologyKey := get .Values.apiService "topologySpreadTopologyKey" -}}
{{- if and $haEnabled (not (hasKey .Values.apiService "topologySpreadTopologyKey")) -}}
{{- $apiTopologySpreadTopologyKey = "kubernetes.io/hostname" -}}
{{- end -}}
{{- $executorService := .Values.executorService | default (dict) -}}
{{- $executorReplicas := dig "replicas" 2 $executorService -}}
{{- $controllerService := .Values.controllerService | default (dict) -}}
{{- $controllerReplicas := dig "replicas" 2 $controllerService -}}
{{- $externalLB := .Values.serve.externalLoadBalancer | default (dict) -}}
{{- $externalLBEnabled := get $externalLB "enabled" | default false -}}
{{- $externalLBResources := get $externalLB "resources" | default (dict) -}}
{{- $externalLBAuth := get $externalLB "auth" | default (dict) -}}
{{- $lbSyncAuth := get $externalLBAuth "lbSync" | default (dict) -}}
{{- $controllerAdminAuth := get $externalLBAuth "controllerAdmin" | default (dict) -}}
{{- $lbDataPlaneAuth := get $externalLBAuth "lbDataPlane" | default (dict) -}}
{{- $lbSyncSecret := get $lbSyncAuth "existingSecret" | default "" -}}
{{- $lbSyncKey := get $lbSyncAuth "key" | default "" -}}
{{- $controllerAdminSecret := get $controllerAdminAuth "existingSecret" | default "" -}}
{{- $controllerAdminKey := get $controllerAdminAuth "key" | default "" -}}
{{- $lbDataPlaneSecret := get $lbDataPlaneAuth "existingSecret" | default "" -}}
{{- $lbDataPlaneKey := get $lbDataPlaneAuth "key" | default "" -}}
{{- if and $externalLBEnabled (not (empty $lbSyncSecret)) (not (empty $lbSyncKey)) (eq $lbSyncSecret $controllerAdminSecret) (eq $lbSyncKey $controllerAdminKey) -}}
{{- fail "serve.externalLoadBalancer.auth.lbSync and serve.externalLoadBalancer.auth.controllerAdmin must reference different Secret keys" -}}
{{- end -}}
{{- if and $externalLBEnabled (ne (empty $lbDataPlaneSecret) (empty $lbDataPlaneKey)) -}}
{{- fail "serve.externalLoadBalancer.auth.lbDataPlane.existingSecret and serve.externalLoadBalancer.auth.lbDataPlane.key must either both be set or both be empty when serve.externalLoadBalancer.enabled=true" -}}
{{- end -}}
{{- $lbDataPlaneAuthEnabled := and $externalLBEnabled (not (empty $lbDataPlaneSecret)) (not (empty $lbDataPlaneKey)) -}}
{{- if and $externalLBEnabled $lbDataPlaneAuthEnabled (eq $lbSyncSecret $lbDataPlaneSecret) (eq $lbSyncKey $lbDataPlaneKey) -}}
{{- fail "serve.externalLoadBalancer.auth.lbSync and serve.externalLoadBalancer.auth.lbDataPlane must reference different Secret keys" -}}
{{- end -}}
{{- if and $externalLBEnabled $lbDataPlaneAuthEnabled (eq $controllerAdminSecret $lbDataPlaneSecret) (eq $controllerAdminKey $lbDataPlaneKey) -}}
{{- fail "serve.externalLoadBalancer.auth.controllerAdmin and serve.externalLoadBalancer.auth.lbDataPlane must reference different Secret keys" -}}
{{- end -}}
{{- if and $externalLBEnabled (not (empty $lbSyncSecret)) (not (empty $lbSyncKey)) (not (empty $controllerAdminSecret)) (not (empty $controllerAdminKey)) (not $lbDataPlaneAuthEnabled) -}}
{{- fail "serve.externalLoadBalancer.auth.lbDataPlane is required when serve.externalLoadBalancer.enabled=true" -}}
{{- end -}}
{{- /* Custom credential wiring is the compatibility path when a native chart
      credential block is disabled. Reserve provider-owned credential fields
      only when the chart will actually emit them. */ -}}
{{- $apiReservedEnvNames := list "ENABLE_SERVICE_ACCOUNTS" "KUBECONFIG" "SKYPILOT_APISERVER_UUID" "SKYPILOT_API_DEPLOYMENT_NAME" "SKYPILOT_API_REQUEST_BACKEND" "SKYPILOT_API_REQUEST_CUTOVER_GATE_PATH" "SKYPILOT_API_REQUIRE_EXECUTION_QUIESCENCE_BACKENDS" "SKYPILOT_API_SERVER_INSTANCE_ID" "SKYPILOT_API_SERVER_ROLE" "SKYPILOT_API_SERVER_STORAGE_ENABLED" "SKYPILOT_AUTH_OAUTH2_PROXY_BASE_URL" "SKYPILOT_AUTH_OAUTH2_PROXY_ENABLED" "SKYPILOT_AUTH_USER_HEADER" "SKYPILOT_DB_CONNECTION_URI" "SKYPILOT_DEV" "SKYPILOT_DISABLE_BASIC_AUTH_MIDDLEWARE" "SKYPILOT_GRACE_PERIOD_SECONDS" "SKYPILOT_INGRESS_BASIC_AUTH_ENABLED" "SKYPILOT_INGRESS_HOST" "SKYPILOT_INITIAL_BASIC_AUTH" "SKYPILOT_IN_CLUSTER_NAMESPACE" "SKYPILOT_POD_CPU_CORE_LIMIT" "SKYPILOT_POD_MEMORY_BYTES_LIMIT" "SKYPILOT_POD_NAME" "SKYPILOT_POD_NAMESPACE" "SKYPILOT_POD_UID" "SKYPILOT_RELEASE_NAME" "SKYPILOT_ROLLING_UPDATE_ENABLED" "SKYPILOT_SERVER_SERVE_CONTROLLER_HOLD" "SKYPILOT_SERVE_API_SERVICE_URL" "SKYPILOT_SERVE_CONTROLLER_ADMIN_AUTH_TOKENS_FILE" "SKYPILOT_SERVE_EXTERNAL_LB_ENABLED" "SKYPILOT_SERVE_LB_AUTH_TOKENS_FILE" "SKYPILOT_SERVE_LB_DATA_PLANE_AUTH_ENABLED" "SKYPILOT_SERVE_LB_HA_RBAC_READY" "SKYPILOT_SERVE_LB_RESOURCES_JSON" "SKYPILOT_SERVE_LB_SYNC_AUTH_TOKENS_FILE" "SKYPILOT_STATE_DB_MIGRATION_MODE" "SKY_API_SERVER_METRICS_ENABLED" -}}
{{- if .Values.awsCredentials.enabled -}}
{{- $apiReservedEnvNames = concat $apiReservedEnvNames (list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY") -}}
{{- end -}}
{{- if .Values.digitaloceanCredentials.enabled -}}
{{- $apiReservedEnvNames = append $apiReservedEnvNames "DIGITALOCEAN_CREDENTIALS" -}}
{{- end -}}
{{- if .Values.gcpCredentials.enabled -}}
{{- $apiReservedEnvNames = append $apiReservedEnvNames "GOOGLE_APPLICATION_CREDENTIALS" -}}
{{- end -}}
{{- if .Values.lambdaCredentials.enabled -}}
{{- $apiReservedEnvNames = append $apiReservedEnvNames "LAMBDA_API_KEY" -}}
{{- end -}}
{{- if .Values.r2Credentials.enabled -}}
{{- $apiReservedEnvNames = concat $apiReservedEnvNames (list "R2_ACCOUNT_ID" "R2_CREDENTIALS") -}}
{{- end -}}
{{- if .Values.runpodCredentials.enabled -}}
{{- $apiReservedEnvNames = append $apiReservedEnvNames "RUNPOD_API_KEY" -}}
{{- end -}}
{{- if .Values.vastCredentials.enabled -}}
{{- $apiReservedEnvNames = append $apiReservedEnvNames "VAST_API_KEY" -}}
{{- end -}}

{{- $apiReservedVolumeNames := list "sky-ephemeral" "skypilot-config" "skypilot-role-runtime" "skypilot-serve-controller-admin-auth" "skypilot-serve-lb-auth" "skypilot-serve-lb-sync-auth" "skypilot-server-config" "skypilot-ssh-identity" "skypilot-ssh-node-pools" "state-volume" -}}
{{- if .Values.awsCredentials.enabled -}}
{{- $apiReservedVolumeNames = concat $apiReservedVolumeNames (list "aws-config" "aws-config-files") -}}
{{- end -}}
{{- if .Values.coreweaveCredentials.enabled -}}
{{- $apiReservedVolumeNames = concat $apiReservedVolumeNames (list "coreweave-config" "coreweave-credentials") -}}
{{- end -}}
{{- if .Values.digitaloceanCredentials.enabled -}}
{{- $apiReservedVolumeNames = append $apiReservedVolumeNames "digitalocean-config" -}}
{{- end -}}
{{- if .Values.gcpCredentials.enabled -}}
{{- $apiReservedVolumeNames = concat $apiReservedVolumeNames (list "gcp-config" "gcp-credentials") -}}
{{- end -}}
{{- if .Values.kubernetesCredentials.useKubeconfig -}}
{{- $apiReservedVolumeNames = append $apiReservedVolumeNames "kube-config" -}}
{{- end -}}
{{- if .Values.lambdaCredentials.enabled -}}
{{- $apiReservedVolumeNames = append $apiReservedVolumeNames "lambda-config" -}}
{{- end -}}
{{- if .Values.nebiusCredentials.enabled -}}
{{- $apiReservedVolumeNames = append $apiReservedVolumeNames "nebius-credentials" -}}
{{- end -}}
{{- if .Values.r2Credentials.enabled -}}
{{- $apiReservedVolumeNames = append $apiReservedVolumeNames "r2-config" -}}
{{- end -}}
{{- if .Values.runpodCredentials.enabled -}}
{{- $apiReservedVolumeNames = append $apiReservedVolumeNames "runpod-config" -}}
{{- end -}}
{{- if .Values.slurmCredentials.config -}}
{{- $apiReservedVolumeNames = append $apiReservedVolumeNames "slurm-config" -}}
{{- end -}}
{{- if .Values.vastCredentials.enabled -}}
{{- $apiReservedVolumeNames = append $apiReservedVolumeNames "vast-config" -}}
{{- end -}}

{{- $apiReservedMountPaths := list "/etc/skypilot/serve-auth/controller-admin" "/etc/skypilot/serve-auth/lb-data-plane" "/etc/skypilot/serve-auth/lb-sync" "/root/.sky" "/root/.sky/.server.yaml" "/root/.sky/api_server/clients" "/root/.ssh" "/root/sky_logs" "/var/run/skypilot" "/var/skypilot/config" "/var/skypilot/ssh_keys" "/var/skypilot/ssh_node_pool" -}}
{{- if .Values.awsCredentials.enabled -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/root/.aws" -}}
{{- end -}}
{{- if .Values.coreweaveCredentials.enabled -}}
{{- $apiReservedMountPaths = concat $apiReservedMountPaths (list "/root/.coreweave" "/root/.coreweave_credentials") -}}
{{- end -}}
{{- if .Values.digitaloceanCredentials.enabled -}}
{{- $apiReservedMountPaths = concat $apiReservedMountPaths (list "/.config/doctl" "/root/.config/doctl") -}}
{{- end -}}
{{- if .Values.gcpCredentials.enabled -}}
{{- $apiReservedMountPaths = concat $apiReservedMountPaths (list "/root/.config/gcloud" "/root/gcp-cred.json") -}}
{{- end -}}
{{- if or .Values.kubernetesCredentials.useKubeconfig .Values.apiService.sshNodePools -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/root/.kube" -}}
{{- end -}}
{{- if and .Values.kubernetesCredentials.useKubeconfig .Values.apiService.sshNodePools -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/var/skypilot/kubeconfig" -}}
{{- end -}}
{{- if .Values.lambdaCredentials.enabled -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/root/.lambda_cloud" -}}
{{- end -}}
{{- if .Values.nebiusCredentials.enabled -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/root/.nebius_credentials" -}}
{{- end -}}
{{- if .Values.r2Credentials.enabled -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/root/.cloudflare" -}}
{{- end -}}
{{- if .Values.runpodCredentials.enabled -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/root/.runpod" -}}
{{- end -}}
{{- if .Values.slurmCredentials.config -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/root/.slurm" -}}
{{- end -}}
{{- if .Values.vastCredentials.enabled -}}
{{- $apiReservedMountPaths = append $apiReservedMountPaths "/root/.config/vastai" -}}
{{- end -}}
{{- if eq .Values.requestStore.backend "postgres" -}}
{{- if and (not .Values.apiService.dbConnectionSecretName) (not .Values.apiService.dbConnectionString) -}}
{{- fail "requestStore.backend=postgres requires external PostgreSQL via apiService.dbConnectionSecretName or apiService.dbConnectionString" -}}
{{- end -}}
{{- if not .Values.databaseMigration.enabled -}}
{{- fail "requestStore.backend=postgres requires databaseMigration.enabled=true" -}}
{{- end -}}
{{- if $haEnabled -}}
{{- if not .Values.apiService.dbConnectionSecretName -}}
{{- fail "apiService.highAvailability.enabled=true requires a pre-existing apiService.dbConnectionSecretName for the blocking migration hook" -}}
{{- end -}}
{{- if .Values.apiService.dbConnectionString -}}
{{- fail "apiService.highAvailability.enabled=true does not support chart-managed apiService.dbConnectionString; use apiService.dbConnectionSecretName" -}}
{{- end -}}
{{- if lt (int .Values.apiService.replicas) 2 -}}
{{- fail "apiService.highAvailability.enabled=true requires apiService.replicas>=2" -}}
{{- end -}}
{{- if lt (int $executorReplicas) 2 -}}
{{- fail "apiService.highAvailability.enabled=true requires executorService.replicas>=2" -}}
{{- end -}}
{{- if lt (int $controllerReplicas) 2 -}}
{{- fail "apiService.highAvailability.enabled=true requires controllerService.replicas>=2" -}}
{{- end -}}
{{- if ne .Values.apiService.upgradeStrategy "RollingUpdate" -}}
{{- fail "apiService.highAvailability.enabled=true requires apiService.upgradeStrategy=RollingUpdate" -}}
{{- end -}}
{{- $rollingUpdateMaxUnavailableString := toString $rollingUpdateMaxUnavailable -}}
{{- if and (ne $rollingUpdateMaxUnavailableString "0") (ne $rollingUpdateMaxUnavailableString "0%") -}}
{{- fail "apiService.highAvailability.enabled=true requires apiService.rollingUpdate.maxUnavailable=0 or 0%" -}}
{{- end -}}
{{- if ne (toString $rollingUpdateMaxSurge) "1" -}}
{{- fail "apiService.highAvailability.enabled=true requires apiService.rollingUpdate.maxSurge=1" -}}
{{- end -}}
{{- if not .Values.storage.enabled -}}
{{- fail "apiService.highAvailability.enabled=true requires storage.enabled=true" -}}
{{- end -}}
{{- if ne .Values.storage.accessMode "ReadWriteMany" -}}
{{- fail "apiService.highAvailability.enabled=true requires storage.accessMode=ReadWriteMany" -}}
{{- end -}}
{{- $readinessProbe := .Values.apiService.readinessProbe | default (dict) -}}
{{- if not (hasKey $readinessProbe "httpGet") -}}
{{- fail "apiService.highAvailability.enabled=true requires an HTTP apiService.readinessProbe" -}}
{{- end -}}
{{- $readinessPeriodSeconds := dig "periodSeconds" 10 $readinessProbe | int -}}
{{- $readinessFailureThreshold := dig "failureThreshold" 3 $readinessProbe | int -}}
{{- $readinessTimeoutSeconds := dig "timeoutSeconds" 1 $readinessProbe | int -}}
{{- $readinessDetectionSeconds := add (mul $readinessPeriodSeconds $readinessFailureThreshold) $readinessTimeoutSeconds -}}
{{- if lt (int $readinessDrainSeconds) (int $readinessDetectionSeconds) -}}
{{- fail (printf "apiService.highAvailability.readinessDrainSeconds must be at least the API readiness failure-detection window (%d seconds)" (int $readinessDetectionSeconds)) -}}
{{- end -}}
{{- if lt (int $readinessDrainSeconds) 16 -}}
{{- fail "apiService.highAvailability.readinessDrainSeconds must be at least 16 seconds for executor and controller readiness propagation" -}}
{{- end -}}
{{- $minimumTerminationSeconds := add (int $readinessDrainSeconds) 10 -}}
{{- if lt (int .Values.apiService.terminationGracePeriodSeconds) (int $minimumTerminationSeconds) -}}
{{- fail (printf "apiService.terminationGracePeriodSeconds must be at least readinessDrainSeconds+10 (%d seconds) in HA mode" (int $minimumTerminationSeconds)) -}}
{{- end -}}
{{- if lt (int (dig "terminationGracePeriodSeconds" 60 $executorService)) (int $minimumTerminationSeconds) -}}
{{- fail (printf "executorService.terminationGracePeriodSeconds must be at least readinessDrainSeconds+10 (%d seconds) in HA mode" (int $minimumTerminationSeconds)) -}}
{{- end -}}
{{- if lt (int (dig "terminationGracePeriodSeconds" 60 $controllerService)) (int $minimumTerminationSeconds) -}}
{{- fail (printf "controllerService.terminationGracePeriodSeconds must be at least readinessDrainSeconds+10 (%d seconds) in HA mode" (int $minimumTerminationSeconds)) -}}
{{- end -}}
{{- else -}}
{{- if ne (int .Values.apiService.replicas) 1 -}}
{{- fail "requestStore.backend=postgres supports exactly one all-role API pod until role-split HA is enabled" -}}
{{- end -}}
{{- if ne .Values.apiService.upgradeStrategy "Recreate" -}}
{{- fail "requestStore.backend=postgres requires apiService.upgradeStrategy=Recreate until role-split HA is enabled" -}}
{{- end -}}
{{- end -}}
{{- else if $haEnabled -}}
{{- fail "apiService.highAvailability.enabled=true requires requestStore.backend=postgres" -}}
{{- end -}}
{{- if and (default false .Values.requestStore.enforceBuiltinExecutionQuiescenceBackends) (ne .Values.requestStore.backend "postgres") -}}
{{- fail "requestStore.enforceBuiltinExecutionQuiescenceBackends=true requires requestStore.backend=postgres" -}}
{{- end -}}
{{ include "skypilot.validatePodExtras" (dict "envLists" (list .Values.global.extraEnvs .Values.databaseConnection.extraEnvs .Values.apiService.extraEnvs) "reservedEnvNames" $apiReservedEnvNames "volumeLists" (list .Values.databaseConnection.extraVolumes .Values.apiService.extraVolumes) "reservedVolumeNames" $apiReservedVolumeNames "mountLists" (list .Values.databaseConnection.extraVolumeMounts .Values.apiService.extraVolumeMounts) "reservedMountPaths" $apiReservedMountPaths) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-api-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.apiService.replicas }}
  {{- if $haEnabled }}
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  {{- end }}
  {{- if eq .Values.apiService.upgradeStrategy "RollingUpdate" }}
  {{- if and (not .Values.apiService.dbConnectionSecretName) (not .Values.apiService.dbConnectionString) }}
  {{- fail "External database must be configured via .apiService.dbConnectionSecretName or .apiService.dbConnectionString when using RollingUpdate strategy" }}
  {{- end }}
  {{- if and .Values.storage.enabled (ne .Values.storage.accessMode "ReadWriteMany") }}
  {{- fail "Local storage with ReadWriteOnce access mode is not supported when using RollingUpdate strategy. Either use Recreate upgrade strategy, set storage.enabled to false, or use ReadWriteMany access mode with a compatible storage class (e.g., NFS-backed storage like Google Filestore)." }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- /* dig (not `default`) so an explicit 0 is honored — Go templates treat
             0 as empty, which would silently fall back to the default. */}}
      maxSurge: {{ $rollingUpdateMaxSurge }}
      maxUnavailable: {{ $rollingUpdateMaxUnavailable }}
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ $fullName }}-api
  template:
    metadata:
      annotations:
        {{- if .Values.apiService.metrics.enabled }}
        {{- if .Values.prometheus.useDedicatedScrapeConfig }}
        skypilot.co/scrape: "true"
        skypilot.co/path: "/metrics"
        skypilot.co/port: {{ .Values.apiService.metrics.port | quote }}
        {{- else}}
        # Well-known annotations for Prometheus to scrape the metrics.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.apiService.metrics.port | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.apiService.annotations }}
        {{- toYaml .Values.apiService.annotations | nindent 8 }}
        {{- end }}
      labels:
        app: {{ $fullName }}-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        # This label indicates that the API server is ready to serve requests.
        skypilot.co/ready: "true"
    spec:
      # External-LB mode also needs the SA token: the consolidated controller
      # uses in-cluster config to reconcile each service's LB resources.
      automountServiceAccountToken: {{ or .Values.kubernetesCredentials.useApiServerCluster $externalLBEnabled }}
      serviceAccountName: {{ include "skypilot.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      terminationGracePeriodSeconds: {{ .Values.apiService.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: skypilot-api
        image: {{ include "common.image" (dict "root" . "image" .Values.apiService.image) }}
        imagePullPolicy: {{ .Values.apiService.imagePullPolicy }}
        {{- if .Values.apiService.devMode.enabled }}
        # Dev mode: fully open securityContext. Runs as root and
        # `privileged: true` implicitly grants all capabilities (including
        # SYS_PTRACE for py-spy/strace) and allowPrivilegeEscalation, so the
        # developer can edit site-packages and restart the server regardless
        # of what the tenant configured. NEVER enable in production.
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
          readOnlyRootFilesystem: false
        {{- else }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.apiService.resources | nindent 10 }}
        {{- if $haEnabled }}
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - touch /var/run/skypilot/draining && sleep {{ $readinessDrainSeconds }}
        {{- end }}
        env:
        {{- /* Detect whether POD_IP is already declared in extraEnvs (e.g. */ -}}
        {{- /* injected by a downstream chart) so we don't emit duplicates. */ -}}
        {{- $podIpInExtraEnvs := false }}
        {{- range concat (default (list) $.Values.global.extraEnvs) (default (list) .Values.databaseConnection.extraEnvs) (default (list) .Values.apiService.extraEnvs) }}
        {{- if eq .name "POD_IP" }}{{- $podIpInExtraEnvs = true }}{{- end }}
        {{- if eq .name "SKYPILOT_STATE_DB_MIGRATION_MODE" }}
        {{- fail "SKYPILOT_STATE_DB_MIGRATION_MODE is managed by databaseMigration and cannot be set through extraEnvs" }}
        {{- end }}
        {{- end }}
        {{- with $.Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.databaseConnection.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.apiService.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: SKYPILOT_DEV
          value: {{ .Values.apiService.skypilotDev | quote }}
        - name: SKYPILOT_RELEASE_NAME
          value: {{ $fullName | quote }}
        - name: SKYPILOT_API_REQUEST_BACKEND
          value: {{ .Values.requestStore.backend | quote }}
        - name: SKYPILOT_API_REQUIRE_EXECUTION_QUIESCENCE_BACKENDS
          value: {{ default false .Values.requestStore.enforceBuiltinExecutionQuiescenceBackends | quote }}
        - name: SKYPILOT_API_SERVER_ROLE
          value: {{ ternary "api" "all" $haEnabled | quote }}
        - name: SKYPILOT_API_SERVER_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: SKYPILOT_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: SKYPILOT_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SKYPILOT_API_REQUEST_CUTOVER_GATE_PATH
          value: {{ .Values.requestStore.cutoverGatePath | quote }}
        {{- if .Values.ingress.enabled }}
        - name: SKYPILOT_INGRESS_HOST
          value: {{ .Values.ingress.host | quote }}
        {{- end }}
        {{- if and (eq (include "skypilot.enableBasicAuthInAPIServer" . | trim) "true") (ne (include "skypilot.initialBasicAuthSecretName" . | trim) "") }}
        - name: SKYPILOT_INITIAL_BASIC_AUTH
          valueFrom:
            secretKeyRef:
              name: {{ include "skypilot.initialBasicAuthSecretName" . }}
              key: auth
        {{- end }}
        {{- if include "skypilot.serviceAccountAuthEnabled" . | trim | eq "true" }}
        - name: ENABLE_SERVICE_ACCOUNTS
          value: "true"
        {{- end }}
        {{- if include "skypilot.ingressBasicAuthEnabled" . | trim | eq "true" }}
        - name: SKYPILOT_INGRESS_BASIC_AUTH_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.gcpCredentials.enabled }}
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /root/gcp-cred.json
        {{- end }}
        {{- if .Values.kubernetesCredentials.inclusterNamespace }}
        - name: SKYPILOT_IN_CLUSTER_NAMESPACE
          value: {{ .Values.kubernetesCredentials.inclusterNamespace }}
        {{- end }}
        {{- if and .Values.kubernetesCredentials.useKubeconfig .Values.apiService.sshNodePools }}
        - name: KUBECONFIG
          value: /root/.kube/config:/var/skypilot/kubeconfig/config
        {{- end }}
        {{- if .Values.apiService.dbConnectionSecretName }}
        - name: SKYPILOT_DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.apiService.dbConnectionSecretName }}
              key: connection_string
        {{- else if .Values.apiService.dbConnectionString }}
        - name: SKYPILOT_DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-db-connection
              key: connection_string
        {{- end }}
        {{- if and (or .Values.apiService.dbConnectionSecretName .Values.apiService.dbConnectionString) .Values.databaseMigration.enabled }}
        - name: SKYPILOT_STATE_DB_MIGRATION_MODE
          value: verify
        {{- end }}
        {{- if .Values.apiService.authUserHeaderName }}
        - name: SKYPILOT_AUTH_USER_HEADER
          value: {{ .Values.apiService.authUserHeaderName | quote }}
        {{- end }}
        - name: SKYPILOT_GRACE_PERIOD_SECONDS
          value: {{ .Values.apiService.terminationGracePeriodSeconds | quote}}
        {{- if eq .Values.apiService.upgradeStrategy "RollingUpdate" }}
        - name: SKYPILOT_APISERVER_UUID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: SKYPILOT_ROLLING_UPDATE_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.storage.enabled }}
        - name: SKYPILOT_API_SERVER_STORAGE_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.apiService.metrics.enabled }}
        - name: SKY_API_SERVER_METRICS_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.auth.disableBasicAuthMiddleware }}
        - name: SKYPILOT_DISABLE_BASIC_AUTH_MIDDLEWARE
          value: "true"
        {{- end }}
        {{- if .Values.auth.oauth.enabled }}
        - name: SKYPILOT_AUTH_OAUTH2_PROXY_ENABLED
          value: "true"
        - name: SKYPILOT_AUTH_OAUTH2_PROXY_BASE_URL
          value: {{ include "skypilot.oauth2ProxyURL" . }}
        {{- end }}
        - name: SKYPILOT_POD_CPU_CORE_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: skypilot-api
              resource: requests.cpu
        - name: SKYPILOT_POD_MEMORY_BYTES_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: skypilot-api
              resource: requests.memory
        {{- if not $podIpInExtraEnvs }}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        {{- end }}
        # Keep the API pod namespace available even when external LB creation
        # is disabled. Cleanup code can still remove residual LB objects when
        # this pod retains in-cluster credentials (the supported disable flow
        # downs services before changing the Helm capability).
        - name: SKYPILOT_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SKYPILOT_SERVER_SERVE_CONTROLLER_HOLD
          value: {{ ternary "true" "false" .Values.serve.controllerHold | quote }}
        - name: SKYPILOT_SERVE_EXTERNAL_LB_ENABLED
          value: {{ ternary "true" "false" $externalLBEnabled | quote }}
        {{- if $externalLBEnabled }}
        # Charts that emit this marker also install the PDB RBAC required by
        # default-on two-slot Serve LBs. A newer image paired with an older
        # chart fails before creating service state instead of failing during
        # load-balancer boot.
        - name: SKYPILOT_SERVE_LB_HA_RBAC_READY
          value: "true"
        # Stable owner for controller-created LB Deployments and Services.
        # Its UID survives ordinary Pod/ReplicaSet rollouts and Kubernetes
        # garbage-collects the LB objects when the Helm Deployment is removed.
        - name: SKYPILOT_API_DEPLOYMENT_NAME
          value: {{ printf "%s-api-server" $fullName | quote }}
        # Stable API Service address for controller administration/recovery.
        - name: SKYPILOT_SERVE_API_SERVICE_URL
          value: {{ printf "http://%s-api-service.%s.svc" $fullName .Release.Namespace | quote }}
        - name: SKYPILOT_SERVE_LB_RESOURCES_JSON
          value: {{ toJson $externalLBResources | quote }}
        # Projected files are re-read by SkyServe, allowing overlap-token
        # rotation without restarting the API server or external LB pods.
        - name: SKYPILOT_SERVE_LB_SYNC_AUTH_TOKENS_FILE
          value: /etc/skypilot/serve-auth/lb-sync/tokens
        - name: SKYPILOT_SERVE_CONTROLLER_ADMIN_AUTH_TOKENS_FILE
          value: /etc/skypilot/serve-auth/controller-admin/tokens
        - name: SKYPILOT_SERVE_LB_DATA_PLANE_AUTH_ENABLED
          value: {{ ternary "true" "false" $lbDataPlaneAuthEnabled | quote }}
        {{- if $lbDataPlaneAuthEnabled }}
        - name: SKYPILOT_SERVE_LB_AUTH_TOKENS_FILE
          value: /etc/skypilot/serve-auth/lb-data-plane/tokens
        {{- end }}
        {{- end }}
        # Use tini as the init process
        command: ["tini", "--"]
        # Start API server in foreground (if supported) to:
        # 1. Bypass the healthz check of `sky api start`, let kubernetes probes manage the lifecycle directly.
        # 2. Capture all logs in container to stdout/stderr, bypass in-container log file overhead.
        # 3. Exec ensures the process is a direct child of tini, enables correct signal handling.
        # Note: this comment is moved here to avoid appearing in the final start script.
        args:
        - /bin/sh
        - -c
        - |
          set -e
          {{- if .Values.apiService.preDeployHook }}
          {{ .Values.apiService.preDeployHook | nindent 10 }}
          {{- end }}
          mkdir -p /root/.sky
          # When the config.yaml is a symlink, it should be from the old API
          # server code. We remove the symlink and copy the ConfigMap config to
          # PVC location for backward compatibility.
          # TODO(zhwu): remove this after 0.12.0.
          if [ -L /root/.sky/config.yaml ]; then
            echo "Config.yaml is a symlink to ConfigMap config, deleting symlink"
            rm -f /root/.sky/config.yaml
          fi
          # Initialize the SkyPilot config.
          if [ -s /root/.sky/config.yaml ]; then
            # If the config.yaml is not empty, sync the PVC config to ConfigMap
            python3 -c "from sky.utils.kubernetes import config_map_utils; config_map_utils.initialize_configmap_sync_on_startup('~/.sky/config.yaml')"
          else
            # If the config.yaml is empty, we initialize the config on PVC with
            # user specified config. Stage a complete file and rename it so
            # concurrent HA replicas never expose a partially copied config.
            config_tmp="/root/.sky/.config.yaml.${SKYPILOT_POD_UID}.tmp"
            cp /var/skypilot/config/config.yaml "$config_tmp"
            if [ ! -e /root/.sky/config.yaml ]; then
              mv -n "$config_tmp" /root/.sky/config.yaml
            fi
            if [ ! -s /root/.sky/config.yaml ]; then
              mv -f "$config_tmp" /root/.sky/config.yaml
            else
              rm -f "$config_tmp"
            fi
          fi
          {{- if .Values.apiService.sshNodePools }}
          mkdir -p /root/.sky
          echo "Linking ssh_node_pools.yaml from secret to /root/.sky/ssh_node_pools.yaml"
          # The secret serves as the ground truth for the ssh_node_pools.yaml file, read-only
          ln -sf /var/skypilot/ssh_node_pool/ssh_node_pools.yaml /root/.sky/ssh_node_pools.yaml
          # ~/.kube/config is required to be persistent when sshNodePools is enabled, init it if it is empty to avoid parsing error.
          if [ ! -s /root/.kube/config ]; then
            kubeconfig_tmp="/root/.kube/.config.${SKYPILOT_POD_UID}.tmp"
            printf '{}\n' > "$kubeconfig_tmp"
            if [ ! -e /root/.kube/config ]; then
              mv -n "$kubeconfig_tmp" /root/.kube/config
            fi
            if [ ! -s /root/.kube/config ]; then
              mv -f "$kubeconfig_tmp" /root/.kube/config
            else
              rm -f "$kubeconfig_tmp"
            fi
          fi
          {{- end }}
          # Nebius credentials mounting
          # Since the ~/.nebius directory is also used by the Nebius CLI, we mount the credentials to /root/.nebius_credentials
          # and create a symlink to /root/.nebius. This cannot be done in the init container because the Nebius CLI needs read-write access to ~/.nebius.
          {{- if .Values.nebiusCredentials.enabled }}
          echo "Setting up Nebius credentials..."
          mkdir -p /root/.nebius
          # Link all files from .nebius_credentials to .nebius
          # In workspace, it is possible to use multiple credentials files. We need to link all of them to .nebius
          for file in /root/.nebius_credentials/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              ln -sf "$file" "/root/.nebius/$filename"
            fi
          done
          echo "{{ .Values.nebiusCredentials.tenantId }}" >> /root/.nebius/NEBIUS_TENANT_ID.txt
          # Create a Nebius profile for the nebius CLI to use as default
          nebius profile create --profile sky --endpoint api.nebius.cloud --service-account-file /root/.nebius/credentials.json || echo "Unable to create Nebius profile."
          {{- end }}
          {{- if .Values.apiService.sshKeySecret }}
          mkdir -p /root/.ssh
          echo "Linking ssh keys to /root/.ssh"
          for file in /var/skypilot/ssh_keys/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              ln -sf "$file" "/root/.ssh/$filename"
            fi
          done
          {{- end }}

          {{- if .Values.apiService.devMode.enabled }}
          # Dev mode: hold the container without starting the API server so a
          # developer can drive `sky api start` / `sky api stop` via kubectl exec.
          exec tail -f /dev/null
          {{- else }}
          # Optional log mirror: when $SKYPILOT_SERVER_LOG_MIRROR_DIR is set,
          # also write server stdout/stderr to a per-pod, per-boot file under
          # <dir>/<HOSTNAME>/server-<UTC_ISO>.log. Survives local logrotate
          # (copytruncate) and pod restarts; placing $HOSTNAME in the path
          # keeps replicas from clobbering each other when the dir is shared
          # (RWX) storage. Mirroring is opportunistic — if directory creation
          # fails (RO mount, permissions, NFS blip) we log a warning and
          # carry on rather than crash-loop the API server pod.
          # Resolve mirror sink first so both the serveServerLog=true and the
          # =false branch can use it.
          SKYPILOT_LOG_MIRROR_FILE=""
          if [ -n "${SKYPILOT_SERVER_LOG_MIRROR_DIR:-}" ]; then
            SKYPILOT_LOG_MIRROR_PER_POD_DIR="${SKYPILOT_SERVER_LOG_MIRROR_DIR}/${HOSTNAME:-unknown}"
            if mkdir -p "$SKYPILOT_LOG_MIRROR_PER_POD_DIR"; then
              SKYPILOT_LOG_MIRROR_FILE="${SKYPILOT_LOG_MIRROR_PER_POD_DIR}/server-$(date -u +%Y%m%dT%H%M%SZ).log"
            else
              echo "warning: failed to create log mirror directory $SKYPILOT_LOG_MIRROR_PER_POD_DIR; mirroring disabled" >&2
            fi
          fi
          {{- if and .Values.apiService.serveServerLog (not $haEnabled) }}
          mkdir -p /root/.sky/api_server
          # Use a FIFO instead of a pipe so that exec replaces the shell,
          # allowing tini to send SIGTERM directly to the API server process
          rm -f /tmp/skylog && mkfifo /tmp/skylog
          if [ -n "$SKYPILOT_LOG_MIRROR_FILE" ]; then
            tee -a /root/.sky/api_server/server.log "$SKYPILOT_LOG_MIRROR_FILE" < /tmp/skylog &
          else
            tee -a /root/.sky/api_server/server.log < /tmp/skylog &
          fi
          exec sky api start {{ include "skypilot.apiArgs" . }} --foreground > /tmp/skylog 2>&1
          {{- else }}
          if [ -n "$SKYPILOT_LOG_MIRROR_FILE" ]; then
            # Mirror without local server.log. Still route through a FIFO so
            # tee can fan out; tee's stdout inherits the container's stdout,
            # so k8s pod logs continue to work just like the no-mirror case.
            rm -f /tmp/skylog && mkfifo /tmp/skylog
            tee -a "$SKYPILOT_LOG_MIRROR_FILE" < /tmp/skylog &
            exec sky api start {{ include "skypilot.apiArgs" . }} --foreground > /tmp/skylog 2>&1
          else
            exec sky api start {{ include "skypilot.apiArgs" . }} --foreground
          fi
          {{- end }}
          {{- end }}
        ports:
        - containerPort: 46580
        {{- if not .Values.apiService.devMode.enabled }}
        {{- with .Values.apiService.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.apiService.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.apiService.readinessProbe }}
        {{- $readinessProbe := deepCopy . }}
        {{- if $haEnabled }}
        {{- $readinessHttpGet := get $readinessProbe "httpGet" | default (dict) }}
        {{- $_ := set $readinessHttpGet "path" "/api/health/ready" }}
        {{- $_ := set $readinessHttpGet "port" 46580 }}
        {{- $_ := set $readinessProbe "httpGet" $readinessHttpGet }}
        {{- end }}
        readinessProbe:
          {{- if not (hasKey $readinessProbe "successThreshold") }}
          {{- if eq $.Values.apiService.upgradeStrategy "RollingUpdate" }}
          # When using RollingUpdate strategy, be more patient with the new
          # API server to avoid flaky serving where one of the server process
          # returns ready of the healthz check endpoint while others may still
          # be starting up.
          successThreshold: 3
          {{- else }}
          # For fast startup, just serve when healthz check passes. There is no
          # other replica to serve requests anyway.
          successThreshold: 1
          {{- end }}
          {{- end }}
          {{- toYaml $readinessProbe | nindent 10 }}
        {{- end }}
        {{- end }}
        volumeMounts:
        {{- if $haEnabled }}
        - name: skypilot-role-runtime
          mountPath: /var/run/skypilot
        {{- end }}
        {{- if and .Values.storage.enabled (eq .Values.apiService.upgradeStrategy "RollingUpdate") (not $haEnabled) }}
        # For RollingUpdate with storage enabled, use emptyDir for ~/.sky to avoid
        # running SQLite on NFS. Only persist the clients directory for file mounts.
        # An ephemeral volume is still required since we have to share ~/.sky between
        # containers.
        - name: sky-ephemeral
          mountPath: /root/.sky
        - name: state-volume
          mountPath: /root/.sky/api_server/clients
          subPath: api_server/clients
        {{- else }}
        - name: state-volume
          mountPath: /root/.sky
          subPath: .sky
        {{- end }}
        {{- if .Values.storage.enabled }}
        - name: state-volume
          mountPath: /root/.ssh # To preserve the SSH keys for the user when using the API server
          subPath: .ssh
        # Mount the entire sky_logs folder because the request
        # logs have been moved out of this directory
        - name: state-volume
          mountPath: /root/sky_logs
          subPath: sky_logs
        {{- end }}
        - name: skypilot-config
          mountPath: /var/skypilot/config
        {{- if or .Values.auth.externalProxy.enabled (eq (include "skypilot.ingressOAuthEnabled" .) "true") }}
        - name: skypilot-server-config
          mountPath: /root/.sky/.server.yaml
          subPath: server.yaml
          readOnly: true
        {{- end }}
        {{- if .Values.apiService.sshNodePools }}
        - name: skypilot-ssh-node-pools
          mountPath: /var/skypilot/ssh_node_pool
        {{- end }}
        {{- if .Values.apiService.sshKeySecret }}
        - name: skypilot-ssh-identity
          mountPath: /var/skypilot/ssh_keys
        {{- end }}
        {{- if .Values.slurmCredentials.config }}
        - name: slurm-config
          mountPath: /root/.slurm
        {{- end }}
        {{- if .Values.awsCredentials.enabled }}
        {{- if .Values.awsCredentials.useCredentialsFile }}
          # Mount the config and credentials files directly from secret
        - name: aws-config-files
          mountPath: /root/.aws
          readOnly: true
        {{- else }}
        # Mount emptyDir that will be populated by initContainer
        - name: aws-config
          mountPath: /root/.aws
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if .Values.r2Credentials.enabled }}
        - name: r2-config
          mountPath: /root/.cloudflare
          readOnly: true
        {{- end }}
        {{- if .Values.coreweaveCredentials.enabled }}
        - name: coreweave-config
          mountPath: /root/.coreweave
          readOnly: true
        {{- end }}
        {{- if .Values.gcpCredentials.enabled }}
        - name: gcp-config
          mountPath: /root/.config/gcloud
        - name: gcp-credentials
          mountPath: /root/gcp-cred.json
          subPath: gcp-cred.json
        {{- end }}
        {{- if .Values.kubernetesCredentials.useKubeconfig }}
        {{- if .Values.apiService.sshNodePools }}
        - name: kube-config
          mountPath: /var/skypilot/kubeconfig
        {{- else }}
        - name: kube-config
          mountPath: /root/.kube
        {{- end }}
        {{- end }}
        {{- if .Values.apiService.sshNodePools }}
        - name: state-volume
          mountPath: /root/.kube
          subPath: .kube
        {{- end }}
        {{- if .Values.runpodCredentials.enabled }}
        - name: runpod-config
          mountPath: /root/.runpod
          readOnly: true
        {{- end }}
        {{- if .Values.digitaloceanCredentials.enabled }}
        - name: digitalocean-config
          mountPath: /root/.config/doctl
          readOnly: true
        {{- end }}
        {{- if .Values.lambdaCredentials.enabled }}
        - name: lambda-config
          mountPath: /root/.lambda_cloud
          readOnly: true
        {{- end }}
        {{- if .Values.vastCredentials.enabled }}
        - name: vast-config
          mountPath: /root/.config/vastai
          readOnly: true
        {{- end }}
        {{- if .Values.nebiusCredentials.enabled }}
        - name: nebius-credentials
          mountPath: /root/.nebius_credentials
        {{- end }}
        {{- if $externalLBEnabled }}
        # Keep the trust domains in independent mounts. lb_k8s mirrors the
        # sync volume and, when configured, the data-plane volume into LB
        # pods; the controller-admin ring must never be present there.
        - name: skypilot-serve-lb-sync-auth
          mountPath: /etc/skypilot/serve-auth/lb-sync
          readOnly: true
        - name: skypilot-serve-controller-admin-auth
          mountPath: /etc/skypilot/serve-auth/controller-admin
          readOnly: true
        {{- if $lbDataPlaneAuthEnabled }}
        - name: skypilot-serve-lb-auth
          mountPath: /etc/skypilot/serve-auth/lb-data-plane
          readOnly: true
        {{- end }}
        {{- end }}
        {{- with .Values.databaseConnection.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.apiService.extraVolumeMounts }}
        {{- toYaml .Values.apiService.extraVolumeMounts | nindent 8 }}
        {{- end }}
      {{- if and .Values.apiService.serveServerLog .Values.apiService.logs.retention.enabled (not $haEnabled) }}
      - name: logrotate
        image: {{ include "common.image" (dict "root" . "image" .Values.apiService.image) }}
        command: ["/bin/sh", "-c"]
        # Warn if logrotate is missing in the image and keep the sidecar running
        args:
        - |
          # Track foreground work through wait so the shell can handle signals
          # immediately instead of deferring them until a long sleep exits.
          child_pid=""
          shutdown() {
            trap - TERM INT
            if [ -n "${child_pid}" ]; then
              kill "${child_pid}" 2>/dev/null || true
            fi
            exit 0
          }
          run_interruptibly() {
            "$@" &
            child_pid=$!
            wait "${child_pid}"
            child_status=$?
            child_pid=""
            return "${child_status}"
          }
          trap shutdown TERM INT

          if ! command -v logrotate >/dev/null 2>&1; then
            echo "warning: logrotate not found; skipping log retention" >&2
            while true; do
              run_interruptibly sleep 3600
            done
          fi
          set -x
          cat > /etc/logrotate.conf <<EOF
          /root/.sky/api_server/server.log {
              size {{ .Values.apiService.logs.retention.size }}
              rotate 1
              missingok
              notifempty
              copytruncate
          }
          /root/.sky/serve/*/controller.log
          /root/.sky/serve/*/batch_controller.log {
              size {{ .Values.apiService.logs.retention.size }}
              rotate 1
              missingok
              notifempty
              copytruncate
          }
          EOF
          while true; do
            run_interruptibly logrotate -s /var/lib/logrotate/status /etc/logrotate.conf
            run_interruptibly sleep 60
          done
        volumeMounts:
        {{- if and .Values.storage.enabled (eq .Values.apiService.upgradeStrategy "RollingUpdate") (not $haEnabled) }}
        - name: sky-ephemeral
          mountPath: /root/.sky
        {{- else }}
        - name: state-volume
          mountPath: /root/.sky
          subPath: .sky
        {{- end }}
      {{- end }}
      {{- with .Values.apiService.sidecarContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      initContainers:
      {{- if and .Values.awsCredentials.enabled (not .Values.awsCredentials.useCredentialsFile) }}
      - name: create-aws-credentials
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "common.image" (dict "root" . "image" .Values.apiService.image) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Setting up AWS credentials..."
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS credentials found in environment variables."
            aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
            aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
            echo "Credentials file created successfully."
          else
            echo "AWS credentials not found in environment variables. Skipping credentials setup."
            echo "Sleeping for 10 minutes before exiting for debugging purposes."
            sleep 600
          fi
        env:
        {{- with $.Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.awsCredentials.awsSecretName }}
              key: {{ .Values.awsCredentials.accessKeyIdKeyName }}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.awsCredentials.awsSecretName }}
              key: {{ .Values.awsCredentials.secretAccessKeyKeyName }}
        volumeMounts:
        - name: aws-config
          mountPath: /root/.aws
      {{- end }}
      {{- if .Values.r2Credentials.enabled }}
      - name: setup-r2-credentials
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "common.image" (dict "root" . "image" .Values.apiService.image) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "Setting up R2 credentials..."
          mkdir -p /root/.cloudflare

          # Direct echo of environment variables (no quotes around EOF)
          cat > /root/.cloudflare/r2.credentials <<EOF
          $R2_CREDENTIALS
          EOF

          cat > /root/.cloudflare/accountid <<EOF
          $R2_ACCOUNT_ID
          EOF

          chmod 600 /root/.cloudflare/r2.credentials
          chmod 600 /root/.cloudflare/accountid

          echo "R2 credentials setup complete:"
          ls -la /root/.cloudflare/
          echo "First line of r2.credentials:"
          head -n 1 /root/.cloudflare/r2.credentials
          echo "Account ID:"
          cat /root/.cloudflare/accountid
        env:
        {{- with $.Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: R2_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.r2Credentials.r2SecretName }}
              key: r2.credentials
        - name: R2_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.r2Credentials.r2SecretName }}
              key: accountid
        volumeMounts:
        - name: r2-config
          mountPath: /root/.cloudflare
      {{- end }}
      {{- if .Values.gcpCredentials.enabled }}
      - name: setup-gcp-credentials
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "common.image" (dict "root" . "image" .Values.gcpCredentials.image) }}
        command: ["/bin/sh", "-c"]
        env:
        {{- with $.Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /root/gcp-cred.json
        args:
        - |
          gcloud auth activate-service-account --key-file=/root/gcp-cred.json
          gcloud config set project {{ .Values.gcpCredentials.projectId }}
        volumeMounts:
        - name: gcp-credentials
          mountPath: /root/gcp-cred.json
          subPath: gcp-cred.json
        - name: gcp-config
          mountPath: /root/.config/gcloud
      {{- end }}
      {{- if .Values.coreweaveCredentials.enabled }}
      - name: setup-coreweave-credentials
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "common.image" (dict "root" . "image" .Values.apiService.image) }}
        command: ["/bin/sh", "-c"]
        {{- if $.Values.global.extraEnvs }}
        env:
        {{- with $.Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        args:
        - |
          cp /root/.coreweave_credentials/* /root/.coreweave/
        volumeMounts:
        - name: coreweave-credentials
          mountPath: /root/.coreweave_credentials
        - name: coreweave-config
          mountPath: /root/.coreweave
      {{- end }}
      {{- if .Values.runpodCredentials.enabled }}
      - name: create-runpod-credentials
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "common.image" (dict "root" . "image" .Values.apiService.image) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Setting up RunPod credentials..."
          if [ -n "$RUNPOD_API_KEY" ]; then
            echo "RunPod credentials found in environment variable."
            mkdir -p /root/.runpod
            echo "[default]" > /root/.runpod/config.toml
            echo "api_key = \"$RUNPOD_API_KEY\"" >> /root/.runpod/config.toml
          else
            echo "RunPod credentials not found in environment variables. Skipping credentials setup."
            echo "Sleeping for 10 minutes before exiting for debugging purposes."
            sleep 600
          fi
        env:
        {{- with $.Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: RUNPOD_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.runpodCredentials.runpodSecretName }}
              key: api_key
        volumeMounts:
        - name: runpod-config
          mountPath: /root/.runpod
      {{- end }}
      {{- if .Values.digitaloceanCredentials.enabled }}
      - name: create-digitalocean-credentials
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ .Values.apiService.image }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Setting up Digital Ocean credentials..."
          if [ -n "$DIGITALOCEAN_CREDENTIALS" ]; then
            echo "Digital Ocean credentials found in environment variable."
            mkdir -p /.config/doctl
            cat > /.config/doctl/config.yaml <<EOF
          access-token: $DIGITALOCEAN_CREDENTIALS
          EOF
          else
            echo "Digital Ocean credentials not found in environment variables. Skipping credentials setup."
            echo "Sleeping for 10 minutes before exiting for debugging purposes."
            sleep 600
          fi
        env:
        - name: DIGITALOCEAN_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.digitaloceanCredentials.digitaloceanSecretName }}
              key: api_key
        volumeMounts:
        - name: digitalocean-config
          mountPath: /.config/doctl
      {{- end }}
      {{- if .Values.lambdaCredentials.enabled }}
      - name: create-lambda-credentials
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "common.image" (dict "root" . "image" .Values.apiService.image) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Setting up Lambda credentials..."
          if [ -n "$LAMBDA_API_KEY" ]; then
            echo "Lambda credentials found in environment variable."
            mkdir -p /root/.lambda_cloud
            echo "api_key = $LAMBDA_API_KEY" > /root/.lambda_cloud/lambda_keys
          else
            echo "Lambda credentials not found in environment variables. Skipping credentials setup."
            echo "Sleeping for 10 minutes before exiting for debugging purposes."
            sleep 600
          fi
        env:
        {{- with $.Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: LAMBDA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.lambdaCredentials.lambdaSecretName }}
              key: api_key
        volumeMounts:
        - name: lambda-config
          mountPath: /root/.lambda_cloud
      {{- end }}
      {{- if .Values.vastCredentials.enabled }}
      - name: create-vast-credentials
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "common.image" (dict "root" . "image" .Values.apiService.image) }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Setting up Vast credentials..."
          if [ -n "$VAST_API_KEY" ]; then
            echo "Vast credentials found in environment variable."
            mkdir -p /root/.config/vastai
            echo "$VAST_API_KEY" > /root/.config/vastai/vast_api_key
          else
            echo "Vast credentials not found in environment variables. Skipping credentials setup."
            echo "Sleeping for 10 minutes before exiting for debugging purposes."
            sleep 600
          fi
        env:
        {{- with $.Values.global.extraEnvs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: VAST_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.vastCredentials.vastSecretName }}
              key: api_key
        volumeMounts:
        - name: vast-config
          mountPath: /root/.config/vastai
      {{- end }}
      {{- if .Values.extraInitContainers }}
      {{- toYaml .Values.extraInitContainers | nindent 6 }}
      {{- end }}

      volumes:
      {{- if $haEnabled }}
      - name: skypilot-role-runtime
        emptyDir: {}
      {{- end }}
      {{- if .Values.storage.enabled }}
      - name: state-volume
        persistentVolumeClaim:
          claimName: {{ $stateClaimName }}
      {{- if and (eq .Values.apiService.upgradeStrategy "RollingUpdate") (not $haEnabled) }}
      # When using RollingUpdate with storage enabled, use a separate emptyDir
      # for ~/.sky to avoid running SQLite on NFS. Only specific subdirectories
      # like api_server/clients are persisted to the PVC.
      - name: sky-ephemeral
        emptyDir: {}
      {{- end }}
      {{- else }}
      - name: state-volume
        emptyDir: {}
      {{- end }}
      {{- if .Values.awsCredentials.enabled }}
      {{- if .Values.awsCredentials.useCredentialsFile }}
      # Mount the config and credentials files directly from secret
      - name: aws-config-files
        secret:
          secretName: {{ .Values.awsCredentials.awsSecretName }}
      {{- else }}
      # Mount emptyDir that will be populated by initContainer
      - name: aws-config
        emptyDir: {}
      {{- end }}
      {{- end }}
      {{- if .Values.gcpCredentials.enabled }}
      - name: gcp-credentials
        secret:
          secretName: {{ .Values.gcpCredentials.gcpSecretName }}
      - name: gcp-config
        emptyDir: {}
      {{- end }}
      {{- if .Values.coreweaveCredentials.enabled }}
      - name: coreweave-credentials
        secret:
          secretName: {{ .Values.coreweaveCredentials.coreweaveSecretName }}
      - name: coreweave-config
        emptyDir: {}
      {{- end }}
      {{- if .Values.runpodCredentials.enabled }}
      - name: runpod-config
        emptyDir: {}
      {{- end }}
      {{- if .Values.digitaloceanCredentials.enabled }}
      - name: digitalocean-config
        emptyDir: {}
      {{- end }}
      {{- if .Values.lambdaCredentials.enabled }}
      - name: lambda-config
        emptyDir: {}
      {{- end }}
      {{- if .Values.vastCredentials.enabled }}
      - name: vast-config
        emptyDir: {}
      {{- end }}
      {{- if .Values.nebiusCredentials.enabled }}
      - name: nebius-credentials
        secret:
          secretName: {{ .Values.nebiusCredentials.nebiusSecretName }}
      {{- end }}
      {{- if .Values.kubernetesCredentials.useKubeconfig }}
      - name: kube-config
        secret:
          secretName: {{ .Values.kubernetesCredentials.kubeconfigSecretName }}
      {{- end }}
      - name: skypilot-config
        configMap:
          name: {{ $fullName }}-config
      {{- if or .Values.auth.externalProxy.enabled (eq (include "skypilot.ingressOAuthEnabled" .) "true") }}
      - name: skypilot-server-config
        configMap:
          name: {{ $fullName }}-server-config
      {{- end }}
      {{- if .Values.apiService.sshNodePools }}
      - name: skypilot-ssh-node-pools
        secret:
          secretName: {{ $fullName }}-ssh-node-pools
      {{- end }}
      {{- if .Values.apiService.sshKeySecret }}
      - name: skypilot-ssh-identity
        secret:
          secretName: {{ .Values.apiService.sshKeySecret }}
          defaultMode: 0600
      {{- end }}
      {{- if .Values.slurmCredentials.config }}
      - name: slurm-config
        secret:
          secretName: {{ $fullName }}-slurm-config
      {{- end }}
      {{- if $externalLBEnabled }}
      # Separate projected volumes make the source Secret metadata explicit to
      # lb_k8s while preserving strict trust-domain boundaries.
      - name: skypilot-serve-lb-sync-auth
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: {{ required "serve.externalLoadBalancer.auth.lbSync.existingSecret is required when serve.externalLoadBalancer.enabled=true" $lbSyncSecret | quote }}
              items:
              - key: {{ required "serve.externalLoadBalancer.auth.lbSync.key is required when serve.externalLoadBalancer.enabled=true" $lbSyncKey | quote }}
                path: tokens
      - name: skypilot-serve-controller-admin-auth
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: {{ required "serve.externalLoadBalancer.auth.controllerAdmin.existingSecret is required when serve.externalLoadBalancer.enabled=true" $controllerAdminSecret | quote }}
              items:
              - key: {{ required "serve.externalLoadBalancer.auth.controllerAdmin.key is required when serve.externalLoadBalancer.enabled=true" $controllerAdminKey | quote }}
                path: tokens
      {{- if $lbDataPlaneAuthEnabled }}
      - name: skypilot-serve-lb-auth
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: {{ $lbDataPlaneSecret | quote }}
              items:
              - key: {{ $lbDataPlaneKey | quote }}
                path: tokens
      {{- end }}
      {{- end }}
      {{- with .Values.databaseConnection.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.apiService.extraVolumes }}
      {{- toYaml .Values.apiService.extraVolumes | nindent 6 }}
      {{- end }}
      {{- if .Values.r2Credentials.enabled }}
      - name: r2-config
        emptyDir: {}
      {{- end }}
      {{- include "skypilot.apiPodScheduling" . }}
      {{- if $apiTopologySpreadTopologyKey }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ $apiTopologySpreadTopologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ $fullName }}-api
      {{- end }}
