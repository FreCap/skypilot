{{- $bindExistingServiceAccount := .Values.rbac.bindExistingServiceAccount | default false -}}
{{- if and .Values.rbac.create $bindExistingServiceAccount }}
{{- fail "rbac.create and rbac.bindExistingServiceAccount are mutually exclusive" }}
{{- end }}
{{- if and $bindExistingServiceAccount (not .Values.rbac.serviceAccountName) }}
{{- fail "rbac.serviceAccountName is required when rbac.bindExistingServiceAccount=true" }}
{{- end }}
{{- if or .Values.rbac.create $bindExistingServiceAccount }}
{{- $fullName := include "skypilot.fullname" . -}}
{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "skypilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.rbac.serviceAccountAnnotations }}
  annotations:
    {{- toYaml .Values.rbac.serviceAccountAnnotations | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-api-role
rules:
{{ toYaml .Values.rbac.clusterRules | indent 2 }}
{{- if .Values.rbac.manageRbacPolicies }}
  - apiGroups: [ "rbac.authorization.k8s.io" ]
    resources: [ "clusterroles", "clusterrolebindings" ]
    verbs: [ "*" ]
{{- end }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-api-role-binding
subjects:
- kind: ServiceAccount
  name: {{ include "skypilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $fullName }}-api-role
  apiGroup: rbac.authorization.k8s.io
{{- $namespace := .Values.kubernetesCredentials.inclusterNamespace | default .Release.Namespace }}
{{- if ne $namespace .Release.Namespace }}
---
{{- include "skypilot.ensureNamespace" $namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-api-role
  namespace: {{ $namespace }}
rules:
{{ toYaml .Values.rbac.namespaceRules | indent 2 }}
{{- if .Values.rbac.manageRbacPolicies }}
  - apiGroups: [ "rbac.authorization.k8s.io" ]
    resources: [ "roles", "rolebindings" ]
    verbs: [ "*" ]
  - apiGroups: [ "" ]
    resources: [ "serviceaccounts" ]
    verbs: [ "*" ]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-api-role-binding
  namespace: {{ $namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "skypilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullName }}-api-role
  apiGroup: rbac.authorization.k8s.io
{{- /* Workspace configuration is always synchronized with the ConfigMap in
       the API release namespace, even when in-cluster workloads use another
       namespace. Keep this permission separate from namespaceRules so split-
       namespace installations cannot silently lose config synchronization. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-config-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    resourceNames: [ {{ printf "%s-config" $fullName | quote }} ]
    verbs: [ "get", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-config-role-binding
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "skypilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullName }}-config-role
  apiGroup: rbac.authorization.k8s.io
{{- /* External SkyServe LBs always stay beside the API pod. Keep their exact
       permissions in a dedicated Role even when workloads share the release
       namespace: unlike namespaceRules, this survives --reuse-values upgrades
       from charts whose old computed defaults lack a newly required verb or
       subresource. Keep cleanup verbs after disabling the feature so a newly
       rolled API pod can reap residual LB objects. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-serve-lb-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [ "apps" ]
    resources: [ "deployments" ]
    verbs:
      {{- if .Values.serve.externalLoadBalancer.enabled }}
      - create
      {{- end }}
      - get
      - list
      {{- if .Values.serve.externalLoadBalancer.enabled }}
      - patch
      {{- end }}
      - delete
  - apiGroups: [ "" ]
    resources: [ "services" ]
    verbs:
      {{- if .Values.serve.externalLoadBalancer.enabled }}
      - create
      {{- end }}
      - get
      - list
      {{- if .Values.serve.externalLoadBalancer.enabled }}
      - patch
      {{- end }}
      - delete
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "" ]
    resources: [ "pods/log" ]
    verbs: [ "get" ]
  - apiGroups: [ "policy" ]
    resources: [ "poddisruptionbudgets" ]
    verbs:
      {{- if .Values.serve.externalLoadBalancer.enabled }}
      - create
      {{- end }}
      - get
      - list
      {{- if .Values.serve.externalLoadBalancer.enabled }}
      - patch
      {{- end }}
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-serve-lb-role-binding
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "skypilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullName }}-serve-lb-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
