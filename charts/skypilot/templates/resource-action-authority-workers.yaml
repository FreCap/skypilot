{{- $resourceActions := .Values.resourceActions | default (dict) -}}
{{- $authority := get $resourceActions "authorityWorker" | default (dict) -}}
{{- if (get $authority "enabled") -}}
{{- $fullName := include "skypilot.fullname" . -}}
{{- $namespace := .Release.Namespace -}}
{{- $releaseScopeLabel := trunc 63 (sha256sum (printf "%s\n%s" $namespace $fullName)) -}}
{{- if not (regexMatch "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$" $fullName) -}}
{{- fail "resourceActions.authorityWorker requires the rendered Helm full name to be one lowercase DNS label" -}}
{{- end -}}
{{- $installationId := get $authority "installationId" | default "" -}}
{{- $activeCohort := get $authority "activeCohort" | default "" -}}
{{- $cohorts := get $authority "cohorts" | default (list) -}}
{{- $tombstones := get $authority "retirementTombstones" | default (list) -}}
{{- $hasCohorts := gt (len $cohorts) 0 -}}
{{- $hasTombstones := gt (len $tombstones) 0 -}}
{{- $healthPort := get $authority "healthPort" | default 46581 -}}
{{- $preflightPort := get $authority "preflightPort" | default 46583 -}}
{{- $auth := get $authority "auth" | default (dict) -}}
{{- $tls := get $authority "tls" | default (dict) -}}
{{- $authSecret := get $auth "existingSecret" | default "" -}}
{{- $authKey := get $auth "key" | default "" -}}
{{- $externalLB := .Values.serve.externalLoadBalancer | default (dict) -}}
{{- $externalLBAuth := get $externalLB "auth" | default (dict) -}}
{{- $lbSyncAuth := get $externalLBAuth "lbSync" | default (dict) -}}
{{- $controllerAdminAuth := get $externalLBAuth "controllerAdmin" | default (dict) -}}
{{- $lbDataPlaneAuth := get $externalLBAuth "lbDataPlane" | default (dict) -}}
{{- $otherAuthRefs := list (dict "name" "serve.externalLoadBalancer.auth.lbSync" "secret" (get $lbSyncAuth "existingSecret" | default "") "key" (get $lbSyncAuth "key" | default "")) (dict "name" "serve.externalLoadBalancer.auth.controllerAdmin" "secret" (get $controllerAdminAuth "existingSecret" | default "") "key" (get $controllerAdminAuth "key" | default "")) (dict "name" "serve.externalLoadBalancer.auth.lbDataPlane" "secret" (get $lbDataPlaneAuth "existingSecret" | default "") "key" (get $lbDataPlaneAuth "key" | default "")) -}}
{{- $tlsSecret := get $tls "existingSecret" | default "" -}}
{{- $tlsCertKey := get $tls "certKey" | default "" -}}
{{- $tlsPrivateKeyKey := get $tls "privateKeyKey" | default "" -}}
{{- $tlsCaKey := get $tls "caKey" | default "" -}}
{{- $databaseSecret := .Values.apiService.dbConnectionSecretName | default "" -}}
{{- $executorService := .Values.executorService | default (dict) -}}
{{- $resources := get $executorService "resources" | default .Values.apiService.resources -}}
{{- $terminationGrace := get $executorService "terminationGracePeriodSeconds" | default 60 -}}
{{- $nodeSelector := get $executorService "nodeSelector" | default (dict) -}}
{{- $tolerations := get $executorService "tolerations" | default (list) -}}
{{- $defaultNoExecuteTolerations := list (dict "effect" "NoExecute" "key" "node.kubernetes.io/not-ready" "operator" "Exists" "tolerationSeconds" 300) (dict "effect" "NoExecute" "key" "node.kubernetes.io/unreachable" "operator" "Exists" "tolerationSeconds" 300) -}}
{{- if $hasCohorts -}}
{{- range $index, $toleration := $tolerations -}}
{{- if kindIs "map" $toleration -}}
{{- $key := get $toleration "key" | default "" -}}
{{- $effect := get $toleration "effect" -}}
{{- if and (has $key (list "node.kubernetes.io/not-ready" "node.kubernetes.io/unreachable")) (or (empty $effect) (and (kindIs "string" $effect) (eq $effect "NoExecute"))) -}}
{{- fail (printf "resourceActions.authorityWorker executorService.tolerations[%d] collides with a fixed authority-worker NoExecute toleration" $index) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $affinity := get $executorService "affinity" | default (dict) -}}
{{- $topologyKey := "kubernetes.io/hostname" -}}
{{- if hasKey $executorService "topologySpreadTopologyKey" -}}
{{- $topologyKey = get $executorService "topologySpreadTopologyKey" -}}
{{- end -}}
{{- $null := get (fromJson "{\"value\":null}") "value" -}}
{{- if not .Values.apiService.highAvailability.enabled -}}
{{- fail "resourceActions.authorityWorker.enabled=true requires apiService.highAvailability.enabled=true" -}}
{{- end -}}
{{- if ne .Values.requestStore.backend "postgres" -}}
{{- fail "resourceActions.authorityWorker.enabled=true requires requestStore.backend=postgres" -}}
{{- end -}}
{{- if empty $databaseSecret -}}
{{- fail "resourceActions.authorityWorker.enabled=true requires a pre-existing apiService.dbConnectionSecretName" -}}
{{- end -}}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $installationId) -}}
{{- fail "resourceActions.authorityWorker.installationId must be a canonical lowercase UUID" -}}
{{- end -}}
{{- if and (not $hasCohorts) (not $hasTombstones) -}}
{{- fail "resourceActions.authorityWorker.enabled=true requires at least one live cohort or retirement tombstone" -}}
{{- end -}}
{{- if and (not $hasCohorts) (not (empty $activeCohort)) -}}
{{- fail "resourceActions.authorityWorker.activeCohort must be empty when cohorts is empty" -}}
{{- end -}}
{{- if $hasCohorts -}}
{{- if or (lt (int $healthPort) 1) (gt (int $healthPort) 65535) (lt (int $preflightPort) 1) (gt (int $preflightPort) 65535) -}}
{{- fail "resourceActions.authorityWorker healthPort and preflightPort must be valid ports" -}}
{{- end -}}
{{- if ne (int $preflightPort) 46583 -}}
{{- fail "resourceActions.authorityWorker preflightPort must be 46583" -}}
{{- end -}}
{{- if eq (int $healthPort) (int $preflightPort) -}}
{{- fail "resourceActions.authorityWorker healthPort and preflightPort must differ" -}}
{{- end -}}
{{- if or (empty $authSecret) (empty $authKey) -}}
{{- fail "resourceActions.authorityWorker.auth existingSecret and key are required" -}}
{{- end -}}
{{- range $otherAuthRef := $otherAuthRefs -}}
{{- if and (not (empty (get $otherAuthRef "secret"))) (not (empty (get $otherAuthRef "key"))) (eq $authSecret (get $otherAuthRef "secret")) (eq $authKey (get $otherAuthRef "key")) -}}
{{- fail (printf "resourceActions.authorityWorker.auth and %s must reference different Secret keys" (get $otherAuthRef "name")) -}}
{{- end -}}
{{- end -}}
{{- if or (empty $tlsSecret) (empty $tlsCertKey) (empty $tlsPrivateKeyKey) (empty $tlsCaKey) -}}
{{- fail "resourceActions.authorityWorker.tls existingSecret and all key names are required" -}}
{{- end -}}
{{- if gt (len (printf "%s-authority-preflight" $fullName)) 63 -}}
{{- fail "resourceActions.authorityWorker release name produces a Service name longer than 63 characters" -}}
{{- end -}}
{{- end -}}
{{- $ids := dict -}}
{{- $activeMatches := 0 -}}
{{- range $cohort := $cohorts -}}
{{- $id := get $cohort "id" | default "" -}}
{{- $name := printf "%s-authority-%s" $fullName $id -}}
{{- if not (regexMatch "^[a-z0-9](?:[a-z0-9-]{0,40}[a-z0-9])?$" $id) -}}
{{- fail (printf "resourceActions.authorityWorker cohort id %q must be a DNS label of at most 42 characters" $id) -}}
{{- end -}}
{{- if or (gt (len $name) 63) (gt (len (printf "%s-manifest" $name)) 63) (gt (len (printf "%s-qualification" $name)) 63) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q produces a resource name longer than 63 characters" $id) -}}
{{- end -}}
{{- if hasKey $ids $id -}}
{{- fail (printf "resourceActions.authorityWorker cohort id %q is duplicated" $id) -}}
{{- end -}}
{{- $_ := set $ids $id true -}}
{{- if ne (int (get $cohort "replicas")) 2 -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q must have replicas: 2" $id) -}}
{{- end -}}
{{- $image := include "common.image" (dict "root" $ "image" (get $cohort "image")) -}}
{{- if not (regexMatch "^.+@sha256:[0-9a-f]{64}$" $image) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q image must be digest-pinned" $id) -}}
{{- end -}}
{{- if ne (get $cohort "imagePullPolicy") "Always" -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q imagePullPolicy must be Always" $id) -}}
{{- end -}}
{{- $manifestDigest := regexFind "sha256:[0-9a-f]{64}$" $image -}}
{{- $configDigest := get $cohort "ociConfigDigest" | default "" -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $configDigest) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q ociConfigDigest must be a sha256 digest" $id) -}}
{{- end -}}
{{- if eq $manifestDigest $configDigest -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q OCI manifest and config digests must be distinct" $id) -}}
{{- end -}}
{{- range $refName := list "qualificationArtifact" "podTemplateContract" "artifactInventory" "callableInventory" -}}
{{- $ref := get $cohort $refName | default (dict) -}}
{{- if or (not (kindIs "map" $ref)) (ne (len $ref) 3) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q %s must contain exactly repoPath, byteSize, and sha256" $id $refName) -}}
{{- end -}}
{{- range $key := keys $ref -}}
{{- if not (has $key (list "repoPath" "byteSize" "sha256")) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q %s contains unknown key %q" $id $refName $key) -}}
{{- end -}}
{{- end -}}
{{- $repoPath := get $ref "repoPath" | default "" -}}
{{- if or (gt (len $repoPath) 253) (not (regexMatch "^[A-Za-z0-9_-][A-Za-z0-9_.-]*(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*$" $repoPath)) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q %s.repoPath must be a normalized repository-relative path" $id $refName) -}}
{{- end -}}
{{- $byteSize := get $ref "byteSize" | default 0 -}}
{{- $byteSizeKind := kindOf $byteSize -}}
{{- if not (or (eq $byteSizeKind "int") (eq $byteSizeKind "int64") (eq $byteSizeKind "float64")) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q %s.byteSize must be a positive integer" $id $refName) -}}
{{- end -}}
{{- if or (ne (float64 $byteSize) (floor (float64 $byteSize))) (lt (int $byteSize) 1) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q %s.byteSize must be a positive integer" $id $refName) -}}
{{- end -}}
{{- if not (regexMatch "^[0-9a-f]{64}$" (get $ref "sha256" | default "")) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q %s.sha256 must be 64 lowercase hex characters" $id $refName) -}}
{{- end -}}
{{- end -}}
{{- if ne (get (get $cohort "podTemplateContract") "repoPath") "sky/serve/resource_action_provider_preflight.py" -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q podTemplateContract.repoPath must be sky/serve/resource_action_provider_preflight.py" $id) -}}
{{- end -}}
{{- if ne (get (get $cohort "artifactInventory") "repoPath") "sky/serve/resource_action_artifacts/provider_authority_v1/renderer_artifact_inventory.json" -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q artifactInventory.repoPath must name the provider-authority v1 renderer inventory" $id) -}}
{{- end -}}
{{- if ne (get (get $cohort "callableInventory") "repoPath") "sky/serve/resource_action_artifacts/provider_authority_v1/callable_inventory.json" -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q callableInventory.repoPath must name the provider-authority v1 callable inventory" $id) -}}
{{- end -}}
{{- $qualificationRef := get $cohort "qualificationArtifact" -}}
{{- $qualificationRepoPath := get $qualificationRef "repoPath" -}}
{{- if not (hasPrefix "charts/skypilot/files/resource-action-qualifications/" $qualificationRepoPath) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualificationArtifact.repoPath must be under charts/skypilot/files/resource-action-qualifications/" $id) -}}
{{- end -}}
{{- $qualificationBytes := $.Files.Get (trimPrefix "charts/skypilot/" $qualificationRepoPath) -}}
{{- if empty $qualificationBytes -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact is not packaged by this chart" $id) -}}
{{- end -}}
{{- if ne (len $qualificationBytes) (int (get $qualificationRef "byteSize")) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact byteSize does not match packaged bytes" $id) -}}
{{- end -}}
{{- if ne (sha256sum $qualificationBytes) (get $qualificationRef "sha256") -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact sha256 does not match packaged bytes" $id) -}}
{{- end -}}
{{- if gt (len $qualificationBytes) 65536 -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact exceeds 65536 bytes" $id) -}}
{{- end -}}
{{- $qualificationValue := mustFromJson $qualificationBytes -}}
{{- if ne (printf "%s\n" (toRawJson $qualificationValue)) $qualificationBytes -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact must be canonical JSON followed by exactly one LF" $id) -}}
{{- end -}}
{{- if or (not (kindIs "map" $qualificationValue)) (ne (len $qualificationValue) 6) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact must contain exactly six v1 keys" $id) -}}
{{- end -}}
{{- range $key := keys $qualificationValue -}}
{{- if not (has $key (list "version" "requested_reference" "oci_manifest_digest" "oci_config_digest" "source_commit" "platform")) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact contains unknown key %q" $id $key) -}}
{{- end -}}
{{- end -}}
{{- if ne (int (get $qualificationValue "version")) 1 -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact version must be 1" $id) -}}
{{- end -}}
{{- if ne (get $qualificationValue "requested_reference") $image -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact requested_reference differs from image" $id) -}}
{{- end -}}
{{- if ne (get $qualificationValue "oci_manifest_digest") $manifestDigest -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact manifest digest differs from image" $id) -}}
{{- end -}}
{{- if ne (get $qualificationValue "oci_config_digest") $configDigest -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact config digest differs from ociConfigDigest" $id) -}}
{{- end -}}
{{- if not (regexMatch "^[0-9a-f]{40}$" (get $qualificationValue "source_commit" | default "")) -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact source_commit must be 40 lowercase hex characters" $id) -}}
{{- end -}}
{{- if ne (get $qualificationValue "platform") "linux/amd64" -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q qualification artifact platform must be linux/amd64" $id) -}}
{{- end -}}
{{- $scopeHash := sha256sum (printf "%s\n%s\n%s" $namespace $fullName $id) -}}
{{- $cohortId := printf "ra:%s:%s:%s" $installationId $scopeHash $id -}}
{{- if gt (len $cohortId) 253 -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q produces a database key longer than 253 characters" $id) -}}
{{- end -}}
{{- if eq $id $activeCohort -}}
{{- $activeMatches = add1 $activeMatches -}}
{{- end -}}
{{- end -}}
{{- if and $hasCohorts (ne (int $activeMatches) 1) -}}
{{- fail "resourceActions.authorityWorker.activeCohort must name exactly one cohort" -}}
{{- end -}}
{{- $tombstoneIds := dict -}}
{{- range $id := $tombstones -}}
{{- if not (regexMatch "^[a-z0-9](?:[a-z0-9-]{0,40}[a-z0-9])?$" $id) -}}
{{- fail (printf "resourceActions.authorityWorker retirement tombstone %q must be a DNS label of at most 42 characters" $id) -}}
{{- end -}}
{{- $name := printf "%s-authority-%s" $fullName $id -}}
{{- if gt (len $name) 63 -}}
{{- fail (printf "resourceActions.authorityWorker retirement tombstone %q produces a resource name longer than 63 characters" $id) -}}
{{- end -}}
{{- if or (hasKey $ids $id) (hasKey $tombstoneIds $id) -}}
{{- fail (printf "resourceActions.authorityWorker retirement tombstone %q is duplicated or still active" $id) -}}
{{- end -}}
{{- $_ := set $tombstoneIds $id true -}}
{{- end -}}
{{- $pullSecretNames := list -}}
{{- $pullSecretSet := dict -}}
{{- $pullSecrets := list -}}
{{- $nodeSelectorList := list -}}
{{- $normalizedNodeSelector := dict -}}
{{- if $hasCohorts -}}
{{- range $secret := .Values.global.imagePullSecrets | default (list) -}}
{{- if or (not (kindIs "map" $secret)) (ne (len $secret) 1) (empty (get $secret "name")) -}}
{{- fail "resourceActions.authorityWorker global.imagePullSecrets entries must contain exactly one nonempty name" -}}
{{- end -}}
{{- $pullSecretName := get $secret "name" -}}
{{- if hasKey $pullSecretSet $pullSecretName -}}
{{- fail (printf "resourceActions.authorityWorker global.imagePullSecrets contains duplicate name %q" $pullSecretName) -}}
{{- end -}}
{{- $_ := set $pullSecretSet $pullSecretName true -}}
{{- $pullSecretNames = append $pullSecretNames $pullSecretName -}}
{{- end -}}
{{- $pullSecretNames = sortAlpha $pullSecretNames -}}
{{- range $name := $pullSecretNames -}}
{{- $pullSecrets = append $pullSecrets (dict "name" $name) -}}
{{- end -}}
{{- range $key, $value := $nodeSelector -}}
{{- if not (kindIs "string" $value) -}}
{{- fail (printf "resourceActions.authorityWorker executorService.nodeSelector value for %q must be a string" $key) -}}
{{- end -}}
{{- $_ := set $normalizedNodeSelector $key $value -}}
{{- $nodeSelectorList = append $nodeSelectorList (dict "key" $key "value" $value) -}}
{{- end -}}
{{- end -}}
{{- $podSecurityContext := deepCopy (.Values.podSecurityContext | default (dict)) -}}
{{- $containerSecurityContext := deepCopy (.Values.securityContext | default (dict)) -}}
{{- range $cohort := $cohorts }}
{{- $id := get $cohort "id" -}}
{{- $name := printf "%s-authority-%s" $fullName $id -}}
{{- $manifestConfigMapName := printf "%s-manifest" $name -}}
{{- $qualificationConfigMapName := printf "%s-qualification" $name -}}
{{- $image := include "common.image" (dict "root" $ "image" (get $cohort "image")) -}}
{{- $manifestDigest := regexFind "sha256:[0-9a-f]{64}$" $image -}}
{{- $scopeHash := sha256sum (printf "%s\n%s\n%s" $namespace $fullName $id) -}}
{{- $cohortId := printf "ra:%s:%s:%s" $installationId $scopeHash $id -}}
{{- $qualificationRefValues := get $cohort "qualificationArtifact" -}}
{{- $qualificationRepoPath := get $qualificationRefValues "repoPath" -}}
{{- $qualificationBytes := $.Files.Get (trimPrefix "charts/skypilot/" $qualificationRepoPath) -}}
{{- $podTemplateContractValues := get $cohort "podTemplateContract" -}}
{{- $artifactInventoryValues := get $cohort "artifactInventory" -}}
{{- $callableInventoryValues := get $cohort "callableInventory" -}}
{{- $qualificationArtifact := dict "source" "helm_chart_configmap_v1" "repo_path" $qualificationRepoPath "mount_path" "/etc/skypilot/resource-action-authority/qualification.json" "byte_size" (int (get $qualificationRefValues "byteSize")) "sha256" (get $qualificationRefValues "sha256") -}}
{{- $podTemplateContract := dict "repo_path" (get $podTemplateContractValues "repoPath") "byte_size" (int (get $podTemplateContractValues "byteSize")) "sha256" (get $podTemplateContractValues "sha256") -}}
{{- $artifactInventory := dict "repo_path" (get $artifactInventoryValues "repoPath") "byte_size" (int (get $artifactInventoryValues "byteSize")) "sha256" (get $artifactInventoryValues "sha256") -}}
{{- $callableInventory := dict "repo_path" (get $callableInventoryValues "repoPath") "byte_size" (int (get $callableInventoryValues "byteSize")) "sha256" (get $callableInventoryValues "sha256") -}}
{{- $command := list "tini" "--" -}}
{{- $args := list "python" "-m" "sky.server.server" "--deploy" "--host" "0.0.0.0" "--role" "authority-worker" "--role-health-port" (printf "%d" (int $healthPort)) "--authority-preflight-port" (printf "%d" (int $preflightPort)) -}}
{{- $literalEnv := list (dict "name" "SKYPILOT_API_REQUEST_BACKEND" "value" "postgres") (dict "name" "SKYPILOT_API_SERVER_ROLE" "value" "authority-worker") (dict "name" "SKYPILOT_RELEASE_NAME" "value" $fullName) (dict "name" "SKYPILOT_RESOURCE_ACTION_PREFLIGHT_AUTH_TOKENS_FILE" "value" "/etc/skypilot/resource-action-authority/auth/tokens") (dict "name" "SKYPILOT_STATE_DB_MIGRATION_MODE" "value" "verify") -}}
{{- $secretEnv := list (dict "name" "SKYPILOT_DB_CONNECTION_URI" "secret_name" $databaseSecret "key" "connection_string") -}}
{{- $downwardApiFields := list (dict "env" "SKYPILOT_POD_NAME" "field_path" "metadata.name") (dict "env" "SKYPILOT_POD_NAMESPACE" "field_path" "metadata.namespace") (dict "env" "SKYPILOT_POD_UID" "field_path" "metadata.uid") -}}
{{- $podLabels := dict "skypilot.co/authority-cohort" $id "skypilot.co/authority-release-scope" $releaseScopeLabel "skypilot.co/role" "resource-action-authority" -}}
{{- $podLabelList := list (dict "key" "skypilot.co/authority-cohort" "value" $id) (dict "key" "skypilot.co/authority-release-scope" "value" $releaseScopeLabel) (dict "key" "skypilot.co/role" "value" "resource-action-authority") -}}
{{- $topologySpreadConstraints := list -}}
{{- if $topologyKey -}}
{{- $topologySpreadConstraints = list (dict "maxSkew" 1 "topologyKey" $topologyKey "whenUnsatisfiable" "DoNotSchedule" "labelSelector" (dict "matchLabels" $podLabels)) -}}
{{- end -}}
{{- $releaseInputs := dict "version" 1 "namespace" $namespace "helm_full_name" $fullName "cohort_suffix" $id "cohort_id" $cohortId "deployment_name" $name "service_account_name" $name "container_name" "skypilot-authority-worker" "image" $image "image_pull_policy" "Always" "command" $command "args" $args "health_port" (printf "%d" (int $healthPort)) "preflight_port" (printf "%d" (int $preflightPort)) "manifest_config_map" (dict "name" $manifestConfigMapName "key" "manifest.json" "mount_path" "/etc/skypilot/resource-action-authority/manifest.json") "qualification_config_map" (dict "name" $qualificationConfigMapName "key" "qualification.json" "mount_path" "/etc/skypilot/resource-action-authority/qualification.json") "auth_secret" (dict "name" $authSecret "key" $authKey "mount_path" "/etc/skypilot/resource-action-authority/auth/tokens") "tls_secret" (dict "name" $tlsSecret "cert_key" $tlsCertKey "private_key_key" $tlsPrivateKeyKey "ca_key" $tlsCaKey "cert_path" "/etc/skypilot/resource-action-authority/tls/tls.crt" "private_key_path" "/etc/skypilot/resource-action-authority/tls/tls.key" "ca_path" "/etc/skypilot/resource-action-authority/tls/ca.crt") "database_secret" (dict "name" $databaseSecret "key" "connection_string") "downward_api_fields" $downwardApiFields "literal_env" $literalEnv "secret_env" $secretEnv "resources" (deepCopy $resources) "image_pull_secrets" $pullSecretNames "pod_labels" $podLabelList "pod_annotations_without_manifest_hash" (list) "pod_security_context" $podSecurityContext "container_security_context" $containerSecurityContext "node_selector" $nodeSelectorList "tolerations" (deepCopy $tolerations) "topology_spread_constraints" (deepCopy $topologySpreadConstraints) "termination_grace_period_seconds" (int $terminationGrace) -}}
{{- if $affinity -}}
{{- $_ := set $releaseInputs "affinity" (deepCopy $affinity) -}}
{{- else -}}
{{- $_ := set $releaseInputs "affinity" $null -}}
{{- end -}}
{{- $_ := set $releaseInputs "priority_class_name" $null -}}
{{- $_ := set $releaseInputs "runtime_class_name" ($.Values.runtimeClassName | default $null) -}}
{{- $_ := set $releaseInputs "scheduler_name" $null -}}
{{- $env := list -}}
{{- range $entry := $literalEnv -}}
{{- $env = append $env (dict "name" (get $entry "name") "value" (get $entry "value")) -}}
{{- end -}}
{{- range $entry := $secretEnv -}}
{{- $env = append $env (dict "name" (get $entry "name") "valueFrom" (dict "secretKeyRef" (dict "name" (get $entry "secret_name") "key" (get $entry "key")))) -}}
{{- end -}}
{{- range $entry := $downwardApiFields -}}
{{- $env = append $env (dict "name" (get $entry "env") "valueFrom" (dict "fieldRef" (dict "apiVersion" "v1" "fieldPath" (get $entry "field_path")))) -}}
{{- end -}}
{{- $volumeMounts := list (dict "name" "authority-manifest" "mountPath" "/etc/skypilot/resource-action-authority/manifest.json" "subPath" "manifest.json" "readOnly" true) (dict "name" "authority-qualification" "mountPath" "/etc/skypilot/resource-action-authority/qualification.json" "subPath" "qualification.json" "readOnly" true) (dict "name" "authority-auth" "mountPath" "/etc/skypilot/resource-action-authority/auth" "readOnly" true) (dict "name" "authority-tls" "mountPath" "/etc/skypilot/resource-action-authority/tls" "readOnly" true) (dict "name" "skypilot-role-runtime" "mountPath" "/var/run/skypilot") (dict "name" "kube-api-access" "mountPath" "/var/run/secrets/kubernetes.io/serviceaccount" "readOnly" true) -}}
{{- $apiAccessSources := list (dict "serviceAccountToken" (dict "expirationSeconds" 3607 "path" "token")) (dict "configMap" (dict "name" "kube-root-ca.crt" "items" (list (dict "key" "ca.crt" "path" "ca.crt")))) (dict "downwardAPI" (dict "items" (list (dict "path" "namespace" "fieldRef" (dict "apiVersion" "v1" "fieldPath" "metadata.namespace"))))) -}}
{{- $volumes := list (dict "name" "authority-manifest" "configMap" (dict "name" $manifestConfigMapName "defaultMode" 292 "items" (list (dict "key" "manifest.json" "path" "manifest.json")))) (dict "name" "authority-qualification" "configMap" (dict "name" $qualificationConfigMapName "defaultMode" 292 "items" (list (dict "key" "qualification.json" "path" "qualification.json")))) (dict "name" "authority-auth" "secret" (dict "secretName" $authSecret "defaultMode" 256 "items" (list (dict "key" $authKey "path" "tokens")))) (dict "name" "authority-tls" "secret" (dict "secretName" $tlsSecret "defaultMode" 256 "items" (list (dict "key" $tlsCertKey "path" "tls.crt") (dict "key" $tlsPrivateKeyKey "path" "tls.key") (dict "key" $tlsCaKey "path" "ca.crt")))) (dict "name" "skypilot-role-runtime" "emptyDir" (dict)) (dict "name" "kube-api-access" "projected" (dict "defaultMode" 420 "sources" $apiAccessSources)) -}}
{{- $container := dict "name" "skypilot-authority-worker" "image" $image "imagePullPolicy" "Always" "command" $command "args" $args "env" $env "ports" (list (dict "name" "health" "containerPort" (int $healthPort) "protocol" "TCP") (dict "name" "preflight" "containerPort" (int $preflightPort) "protocol" "TCP")) "resources" (deepCopy $resources) "securityContext" $containerSecurityContext "terminationMessagePath" "/dev/termination-log" "terminationMessagePolicy" "File" "lifecycle" (dict "preStop" (dict "exec" (dict "command" (list "/bin/sh" "-c" "touch /var/run/skypilot/draining")))) "startupProbe" (dict "httpGet" (dict "path" "/bootstrapz" "port" "health" "scheme" "HTTP") "failureThreshold" 60 "periodSeconds" 10 "successThreshold" 1 "timeoutSeconds" 1) "livenessProbe" (dict "httpGet" (dict "path" "/livez" "port" "health" "scheme" "HTTP") "failureThreshold" 3 "periodSeconds" 10 "successThreshold" 1 "timeoutSeconds" 1) "readinessProbe" (dict "httpGet" (dict "path" "/bootstrapz" "port" "health" "scheme" "HTTP") "failureThreshold" 3 "periodSeconds" 5 "successThreshold" 1 "timeoutSeconds" 1) "volumeMounts" $volumeMounts -}}
{{- $effectiveTolerations := concat (deepCopy $tolerations) (deepCopy $defaultNoExecuteTolerations) -}}
{{- $podSpec := dict "automountServiceAccountToken" false "serviceAccount" $name "serviceAccountName" $name "terminationGracePeriodSeconds" (int $terminationGrace) "restartPolicy" "Always" "dnsPolicy" "ClusterFirst" "enableServiceLinks" false "hostNetwork" false "hostPID" false "hostIPC" false "schedulerName" "default-scheduler" "priority" 0 "preemptionPolicy" "PreemptLowerPriority" "securityContext" $podSecurityContext "containers" (list $container) "volumes" $volumes "tolerations" $effectiveTolerations -}}
{{- if gt (len $pullSecrets) 0 -}}
{{- $_ := set $podSpec "imagePullSecrets" $pullSecrets -}}
{{- end -}}
{{- if $normalizedNodeSelector -}}
{{- $_ := set $podSpec "nodeSelector" (deepCopy $normalizedNodeSelector) -}}
{{- end -}}
{{- if $affinity -}}
{{- $_ := set $podSpec "affinity" (deepCopy $affinity) -}}
{{- end -}}
{{- if gt (len $topologySpreadConstraints) 0 -}}
{{- $_ := set $podSpec "topologySpreadConstraints" (deepCopy $topologySpreadConstraints) -}}
{{- end -}}
{{- if $.Values.runtimeClassName -}}
{{- $_ := set $podSpec "runtimeClassName" $.Values.runtimeClassName -}}
{{- end -}}
{{- $manifestAnnotation := "skypilot.co/resource-action-manifest-sha256" -}}
{{- $placeholderTemplate := dict "metadata" (dict "labels" $podLabels "annotations" (dict $manifestAnnotation "$MANIFEST_SHA256")) "spec" $podSpec -}}
{{- $expectedTemplateSha256 := sha256sum (toRawJson $placeholderTemplate) -}}
{{- $podTemplateBinding := dict "version" 1 "contract" "authority_worker_pod_template_v1" "projector_artifact_sha256" (get $podTemplateContract "sha256") "release_inputs" $releaseInputs "expected_template_sha256" $expectedTemplateSha256 "manifest_hash_annotation_json_pointer" "/metadata/annotations/skypilot.co~1resource-action-manifest-sha256" "manifest_hash_placeholder" "$MANIFEST_SHA256" -}}
{{- $imageQualification := dict "requested_reference" $image "oci_manifest_digest" $manifestDigest "oci_config_digest" (get $cohort "ociConfigDigest") "qualification_artifact" $qualificationArtifact -}}
{{- $manifest := dict "version" 1 "cohort_id" $cohortId "namespace" $namespace "deployment_name" $name "service_account_name" $name "container_name" "skypilot-authority-worker" "image" $imageQualification "pod_template_contract" $podTemplateContract "pod_template_binding" $podTemplateBinding "artifact_inventory" $artifactInventory "callable_inventory" $callableInventory "claim_contract" "frozen_action_cohort_join_v1" "handler_allowlist" (list "serve_shadow_candidate_launch" "serve_shadow_candidate_down" "serve_resource_action_launch" "serve_resource_action_down") -}}
{{- $manifestJson := toRawJson $manifest -}}
{{- if gt (len $manifestJson) 65536 -}}
{{- fail (printf "resourceActions.authorityWorker cohort %q canonical manifest exceeds 65536 bytes" $id) -}}
{{- end -}}
{{- $manifestSha256 := sha256sum $manifestJson -}}
{{- $preflightManifestName := include "skypilot.resourceActionAuthorityPreflightManifestName" (dict "namespace" $namespace "helmReleaseName" $.Release.Name "cohortSuffix" $id) -}}
{{- $liveTemplate := deepCopy $placeholderTemplate -}}
{{- $_ := set (get (get $liveTemplate "metadata") "annotations") $manifestAnnotation $manifestSha256 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $preflightManifestName }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: resource-action-authority-release-preflight
    skypilot.co/authority-cohort: {{ $id | quote }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
immutable: true
binaryData:
  manifest.json: {{ b64enc $manifestJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $manifestConfigMapName }}
  namespace: {{ $namespace }}
  labels:
    skypilot.co/role: resource-action-authority
    skypilot.co/authority-cohort: {{ $id | quote }}
    skypilot.co/authority-release-scope: {{ $releaseScopeLabel | quote }}
immutable: true
binaryData:
  manifest.json: {{ b64enc $manifestJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $qualificationConfigMapName }}
  namespace: {{ $namespace }}
  labels:
    skypilot.co/role: resource-action-authority
    skypilot.co/authority-cohort: {{ $id | quote }}
    skypilot.co/authority-release-scope: {{ $releaseScopeLabel | quote }}
immutable: true
binaryData:
  qualification.json: {{ b64enc $qualificationBytes | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    skypilot.co/role: resource-action-authority
    skypilot.co/authority-cohort: {{ $id | quote }}
    skypilot.co/authority-release-scope: {{ $releaseScopeLabel | quote }}
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    skypilot.co/role: resource-action-authority
    skypilot.co/authority-cohort: {{ $id | quote }}
    skypilot.co/authority-release-scope: {{ $releaseScopeLabel | quote }}
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      skypilot.co/role: resource-action-authority
      skypilot.co/authority-cohort: {{ $id | quote }}
      skypilot.co/authority-release-scope: {{ $releaseScopeLabel | quote }}
  template:
{{ toYaml $liveTemplate | nindent 4 }}
{{- end }}
{{- if $hasCohorts }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-authority-preflight
  namespace: {{ $namespace }}
spec:
  type: ClusterIP
  selector:
    skypilot.co/role: resource-action-authority
    skypilot.co/authority-cohort: {{ $activeCohort | quote }}
    skypilot.co/authority-release-scope: {{ $releaseScopeLabel | quote }}
  ports:
  - name: preflight
    port: {{ $preflightPort }}
    targetPort: preflight
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-authority-preflight
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      skypilot.co/role: resource-action-authority
      skypilot.co/authority-release-scope: {{ $releaseScopeLabel | quote }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ $fullName }}-controller
          skypilot.co/role: controller
    ports:
    - protocol: TCP
      port: {{ $preflightPort }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-authority-self-attestation
  namespace: {{ $namespace }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames:
  {{- range $cohort := $cohorts }}
  - {{ printf "%s-authority-%s" $fullName (get $cohort "id") }}
  {{- end }}
  verbs: ["get"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  resourceNames:
  {{- range $cohort := $cohorts }}
  - {{ printf "%s-authority-%s" $fullName (get $cohort "id") }}
  {{- end }}
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-authority-self-attestation
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-authority-self-attestation
subjects:
{{- range $cohort := $cohorts }}
- kind: ServiceAccount
  name: {{ printf "%s-authority-%s" $fullName (get $cohort "id") }}
  namespace: {{ $namespace }}
{{- end }}
{{- end }}
{{- if gt (len $tombstones) 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-authority-retirement-verifier
  namespace: {{ $namespace }}
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames:
  {{- range $id := $tombstones }}
  - {{ printf "%s-authority-%s" $fullName $id }}
  {{- end }}
  verbs: ["get"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  resourceNames:
  {{- range $id := $tombstones }}
  - {{ printf "%s-authority-%s" $fullName $id }}
  {{- end }}
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-authority-retirement-verifier
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-authority-retirement-verifier
subjects:
- kind: ServiceAccount
  name: {{ include "skypilot.serviceAccountName" . }}
  namespace: {{ $namespace }}
{{- end }}
{{- end }}
