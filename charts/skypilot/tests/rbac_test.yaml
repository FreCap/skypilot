# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: rbac_test
templates:
  - templates/rbac.yaml
tests:
  - it: should preserve chart-managed service account behavior by default
    release:
      name: test-release
      namespace: test-namespace
    asserts:
      - hasDocuments:
          count: 9
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-release-api-sa
        documentIndex: 0

  - it: should bind chart-managed policies to an external service account
    release:
      name: test-release
      namespace: test-namespace
    set:
      rbac.create: false
      rbac.bindExistingServiceAccount: true
      rbac.serviceAccountName: external-api
    asserts:
      - hasDocuments:
          count: 8
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["namespaces"]
            resourceNames: ["kube-system"]
            verbs: ["get"]
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: external-api
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 3
      - equal:
          path: subjects[0].name
          value: external-api
        documentIndex: 3
      - isKind:
          of: Role
        documentIndex: 4
      - equal:
          path: metadata.name
          value: test-release-config-role
        documentIndex: 4
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["test-release-config"]
              verbs: ["get", "patch"]
        documentIndex: 4
      - isKind:
          of: RoleBinding
        documentIndex: 5
      - equal:
          path: subjects[0].name
          value: external-api
        documentIndex: 5

  - it: should preserve chart-managed service account behavior when the new field is absent
    release:
      name: test-release
      namespace: test-namespace
    set:
      rbac.bindExistingServiceAccount: null
    asserts:
      - hasDocuments:
          count: 9
      - isKind:
          of: ServiceAccount
        documentIndex: 0

  - it: should add physical-cluster identity access to reused legacy cluster rules
    release:
      name: test-release
      namespace: test-namespace
    set:
      rbac.create: false
      rbac.bindExistingServiceAccount: true
      rbac.serviceAccountName: external-api
      rbac.manageRbacPolicies: false
      rbac.clusterRules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]
    asserts:
      - hasDocuments:
          count: 8
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["namespaces"]
              resourceNames: ["kube-system"]
              verbs: ["get"]
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["get", "list"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses"]
              verbs: ["get", "list", "watch"]
        documentIndex: 0

  - it: should render required identity access with empty reused cluster rules
    release:
      name: test-release
      namespace: test-namespace
    set:
      rbac.create: false
      rbac.bindExistingServiceAccount: true
      rbac.serviceAccountName: external-api
      rbac.manageRbacPolicies: false
      rbac.clusterRules: []
    asserts:
      - hasDocuments:
          count: 8
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["namespaces"]
              resourceNames: ["kube-system"]
              verbs: ["get"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses"]
              verbs: ["get", "list", "watch"]
        documentIndex: 0

  - it: should grant release-namespace Pod watch for termination evidence
    release:
      name: test-release
      namespace: test-namespace
    asserts:
      - isKind:
          of: Role
        documentIndex: 7
      - equal:
          path: metadata.name
          value: test-release-serve-lb-role
        documentIndex: 7
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch"]
        documentIndex: 7

  - it: should keep workload and config policies in their respective namespaces
    release:
      name: test-release
      namespace: release-namespace
    set:
      rbac.create: false
      rbac.bindExistingServiceAccount: true
      rbac.serviceAccountName: external-api
      kubernetesCredentials.inclusterNamespace: workload-namespace
    asserts:
      - hasDocuments:
          count: 9
      - isKind:
          of: Namespace
        documentIndex: 2
      - equal:
          path: metadata.name
          value: workload-namespace
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: workload-namespace
        documentIndex: 3
      - equal:
          path: subjects[0].namespace
          value: release-namespace
        documentIndex: 4
      - equal:
          path: metadata.name
          value: test-release-config-role
        documentIndex: 5
      - equal:
          path: metadata.namespace
          value: release-namespace
        documentIndex: 5
      - equal:
          path: subjects[0].name
          value: external-api
        documentIndex: 6
      - equal:
          path: subjects[0].namespace
          value: release-namespace
        documentIndex: 6

  - it: should reject ambiguous service account ownership
    set:
      rbac.create: true
      rbac.bindExistingServiceAccount: true
      rbac.serviceAccountName: external-api
    asserts:
      - failedTemplate:
          errorMessage: "rbac.create and rbac.bindExistingServiceAccount are mutually exclusive"

  - it: should require an explicit external service account name
    set:
      rbac.create: false
      rbac.bindExistingServiceAccount: true
      rbac.serviceAccountName: ""
    asserts:
      - failedTemplate:
          errorMessage: "rbac.serviceAccountName is required when rbac.bindExistingServiceAccount=true"

  - it: should render no objects when chart-managed RBAC is disabled
    set:
      rbac.create: false
      rbac.bindExistingServiceAccount: false
      rbac.serviceAccountName: external-api
    asserts:
      - hasDocuments:
          count: 0
