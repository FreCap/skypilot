# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: external_lb_test
templates:
  - templates/api-deployment.yaml
tests:
  - it: should remain inert when external LB support is disabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_EXTERNAL_LB_ENABLED
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_API_SERVICE_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_API_DEPLOYMENT_NAME
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: skypilot-serve-lb-sync-auth
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: should fail closed when the LB sync Secret name is missing
    set:
      serve.externalLoadBalancer.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbSync.existingSecret is required when serve.externalLoadBalancer.enabled=true"

  - it: should fail closed when the LB sync Secret key is missing
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbSync.key is required when serve.externalLoadBalancer.enabled=true"

  - it: should fail closed when the controller admin Secret name is missing
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
      serve.externalLoadBalancer.auth.lbSync.key: tokens
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.controllerAdmin.existingSecret is required when serve.externalLoadBalancer.enabled=true"

  - it: should fail closed when the controller admin Secret key is missing
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
      serve.externalLoadBalancer.auth.lbSync.key: tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: serve-controller-admin
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.controllerAdmin.key is required when serve.externalLoadBalancer.enabled=true"

  - it: should reject the same Secret key for LB sync and controller admin
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: shared-auth
      serve.externalLoadBalancer.auth.lbSync.key: tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: shared-auth
      serve.externalLoadBalancer.auth.controllerAdmin.key: tokens
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbSync and serve.externalLoadBalancer.auth.controllerAdmin must reference different Secret keys"

  - it: should reject the same Secret key for LB sync and data plane
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: shared-auth
      serve.externalLoadBalancer.auth.lbSync.key: tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: admin-auth
      serve.externalLoadBalancer.auth.controllerAdmin.key: tokens
      serve.externalLoadBalancer.auth.lbDataPlane.existingSecret: shared-auth
      serve.externalLoadBalancer.auth.lbDataPlane.key: tokens
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbSync and serve.externalLoadBalancer.auth.lbDataPlane must reference different Secret keys"

  - it: should reject the same Secret key for controller admin and data plane
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: sync-auth
      serve.externalLoadBalancer.auth.lbSync.key: tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: shared-auth
      serve.externalLoadBalancer.auth.controllerAdmin.key: tokens
      serve.externalLoadBalancer.auth.lbDataPlane.existingSecret: shared-auth
      serve.externalLoadBalancer.auth.lbDataPlane.key: tokens
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.controllerAdmin and serve.externalLoadBalancer.auth.lbDataPlane must reference different Secret keys"

  - it: should allow different keys in one Secret for runtime content checks
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: shared-auth
      serve.externalLoadBalancer.auth.lbSync.key: sync-tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: shared-auth
      serve.externalLoadBalancer.auth.controllerAdmin.key: admin-tokens
      serve.externalLoadBalancer.auth.lbDataPlane.existingSecret: data-auth
      serve.externalLoadBalancer.auth.lbDataPlane.key: data-tokens
    asserts:
      - isKind:
          of: Deployment

  - it: should require data-plane auth
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
      serve.externalLoadBalancer.auth.lbSync.key: tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: serve-controller-admin
      serve.externalLoadBalancer.auth.controllerAdmin.key: tokens
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbDataPlane is required when serve.externalLoadBalancer.enabled=true"

  - it: should reject a data-plane Secret name without a key
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
      serve.externalLoadBalancer.auth.lbSync.key: tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: serve-controller-admin
      serve.externalLoadBalancer.auth.controllerAdmin.key: tokens
      serve.externalLoadBalancer.auth.lbDataPlane.existingSecret: serve-lb-data-plane
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbDataPlane.existingSecret and serve.externalLoadBalancer.auth.lbDataPlane.key must either both be set or both be empty when serve.externalLoadBalancer.enabled=true"

  - it: should reject a data-plane Secret key without a name
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
      serve.externalLoadBalancer.auth.lbSync.key: tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: serve-controller-admin
      serve.externalLoadBalancer.auth.controllerAdmin.key: tokens
      serve.externalLoadBalancer.auth.lbDataPlane.key: data-tokens
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbDataPlane.existingSecret and serve.externalLoadBalancer.auth.lbDataPlane.key must either both be set or both be empty when serve.externalLoadBalancer.enabled=true"

  - it: should reject a null data-plane auth subtree
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
      serve.externalLoadBalancer.auth.lbSync.key: tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: serve-controller-admin
      serve.externalLoadBalancer.auth.controllerAdmin.key: tokens
      serve.externalLoadBalancer.auth.lbDataPlane: null
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbDataPlane is required when serve.externalLoadBalancer.enabled=true"

  - it: should fail with the mandatory-ring error when auth is null
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth: null
    asserts:
      - failedTemplate:
          errorMessage: "serve.externalLoadBalancer.auth.lbSync.existingSecret is required when serve.externalLoadBalancer.enabled=true"

  - it: should render isolated token projections and external LB env contracts
    release:
      name: test-release
      namespace: test-namespace
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
      serve.externalLoadBalancer.auth.lbSync.key: sync-tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: serve-controller-admin
      serve.externalLoadBalancer.auth.controllerAdmin.key: admin-tokens
      serve.externalLoadBalancer.auth.lbDataPlane.existingSecret: serve-lb-data-plane
      serve.externalLoadBalancer.auth.lbDataPlane.key: data-tokens
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_API_SERVICE_URL
            value: http://test-release-api-service.test-namespace.svc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_API_DEPLOYMENT_NAME
            value: test-release-api-server
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_LB_RESOURCES_JSON
            value: '{"limits":{"memory":"512Mi"},"requests":{"cpu":"100m","memory":"128Mi"}}'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_LB_SYNC_AUTH_TOKENS_FILE
            value: /etc/skypilot/serve-auth/lb-sync/tokens
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_CONTROLLER_ADMIN_AUTH_TOKENS_FILE
            value: /etc/skypilot/serve-auth/controller-admin/tokens
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_LB_DATA_PLANE_AUTH_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_LB_AUTH_TOKENS_FILE
            value: /etc/skypilot/serve-auth/lb-data-plane/tokens
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: skypilot-serve-lb-sync-auth
            mountPath: /etc/skypilot/serve-auth/lb-sync
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: skypilot-serve-controller-admin-auth
            mountPath: /etc/skypilot/serve-auth/controller-admin
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: skypilot-serve-lb-auth
            mountPath: /etc/skypilot/serve-auth/lb-data-plane
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: skypilot-serve-lb-sync-auth
            projected:
              defaultMode: 256
              sources:
                - secret:
                    name: serve-lb-sync
                    items:
                      - key: sync-tokens
                        path: tokens
      - contains:
          path: spec.template.spec.volumes
          content:
            name: skypilot-serve-controller-admin-auth
            projected:
              defaultMode: 256
              sources:
                - secret:
                    name: serve-controller-admin
                    items:
                      - key: admin-tokens
                        path: tokens
      - contains:
          path: spec.template.spec.volumes
          content:
            name: skypilot-serve-lb-auth
            projected:
              defaultMode: 256
              sources:
                - secret:
                    name: serve-lb-data-plane
                    items:
                      - key: data-tokens
                        path: tokens

  - it: should render explicitly null resources as an empty object
    set:
      serve.externalLoadBalancer.enabled: true
      serve.externalLoadBalancer.resources: null
      serve.externalLoadBalancer.auth.lbSync.existingSecret: serve-lb-sync
      serve.externalLoadBalancer.auth.lbSync.key: sync-tokens
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: serve-controller-admin
      serve.externalLoadBalancer.auth.controllerAdmin.key: admin-tokens
      serve.externalLoadBalancer.auth.lbDataPlane.existingSecret: serve-lb-data-plane
      serve.externalLoadBalancer.auth.lbDataPlane.key: data-tokens
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVE_LB_RESOURCES_JSON
            value: '{}'
