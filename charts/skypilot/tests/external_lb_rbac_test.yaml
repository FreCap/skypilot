# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: external_lb_rbac_test
templates:
  - templates/rbac.yaml
tests:
  - it: should grant external LB lifecycle permissions in the API release namespace
    release:
      name: test-release
      namespace: test-namespace
    set:
      serve.externalLoadBalancer.enabled: true
      kubernetesCredentials.inclusterNamespace: workload-namespace
    asserts:
      - hasDocuments:
          count: 10
      - isKind:
          of: Role
        documentIndex: 8
      - equal:
          path: metadata.name
          value: test-release-serve-lb-role
        documentIndex: 8
      - equal:
          path: metadata.namespace
          value: test-namespace
        documentIndex: 8
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["create", "get", "list", "patch", "delete"]
        documentIndex: 8
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get"]
        documentIndex: 8
      - isKind:
          of: RoleBinding
        documentIndex: 9
      - equal:
          path: roleRef.name
          value: test-release-serve-lb-role
        documentIndex: 9

  - it: should isolate LB permissions from reused same-namespace defaults
    release:
      name: test-release
      namespace: test-namespace
    set:
      serve.externalLoadBalancer.enabled: true
      rbac.namespaceRules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
    asserts:
      - hasDocuments:
          count: 9
      - equal:
          path: metadata.name
          value: test-release-serve-lb-role
        documentIndex: 7
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get"]
        documentIndex: 7
      - equal:
          path: roleRef.name
          value: test-release-serve-lb-role
        documentIndex: 8

  - it: should retain split-namespace cleanup permission when external LB is disabled
    release:
      name: test-release
      namespace: test-namespace
    set:
      serve.externalLoadBalancer.enabled: false
      kubernetesCredentials.inclusterNamespace: workload-namespace
    asserts:
      - hasDocuments:
          count: 10
      - equal:
          path: metadata.name
          value: test-release-serve-lb-role
        documentIndex: 8
      - equal:
          path: metadata.namespace
          value: test-namespace
        documentIndex: 8
