# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: external_lb_rbac_test
templates:
  - templates/rbac.yaml
tests:
  - it: should grant external LB lifecycle permissions in the API release namespace
    release:
      name: test-release
      namespace: test-namespace
    set:
      serve.externalLoadBalancer.enabled: true
      kubernetesCredentials.inclusterNamespace: workload-namespace
    asserts:
      - hasDocuments:
          count: 8
      - isKind:
          of: Role
        documentIndex: 6
      - equal:
          path: metadata.name
          value: test-release-serve-lb-role
        documentIndex: 6
      - equal:
          path: metadata.namespace
          value: test-namespace
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["create", "get", "list", "patch", "delete"]
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get"]
        documentIndex: 6
      - isKind:
          of: RoleBinding
        documentIndex: 7
      - equal:
          path: roleRef.name
          value: test-release-serve-lb-role
        documentIndex: 7

  - it: should not add a duplicate LB role when workloads use the release namespace
    release:
      name: test-release
      namespace: test-namespace
    set:
      serve.externalLoadBalancer.enabled: true
    asserts:
      - hasDocuments:
          count: 5

  - it: should retain split-namespace cleanup permission when external LB is disabled
    release:
      name: test-release
      namespace: test-namespace
    set:
      serve.externalLoadBalancer.enabled: false
      kubernetesCredentials.inclusterNamespace: workload-namespace
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: metadata.name
          value: test-release-serve-lb-role
        documentIndex: 6
      - equal:
          path: metadata.namespace
          value: test-namespace
        documentIndex: 6
