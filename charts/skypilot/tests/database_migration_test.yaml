# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: database_migration_test
templates:
  - templates/database-migration-job.yaml
tests:
  - it: should create one revision-scoped migration job for an external secret
    set:
      apiService.dbConnectionSecretName: external-db
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: RELEASE-NAME-db-migration-0
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - python
            - -m
            - sky.server.database_migrations
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IS_SKYPILOT_SERVER
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_API_REQUEST_BACKEND
            value: sqlite
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_STATE_DB_MIGRATION_MODE
            value: upgrade
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_DB_CONNECTION_URI
            valueFrom:
              secretKeyRef:
                name: external-db
                key: connection_string
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: should block HA install and upgrade on the revision-scoped migration hook
    set:
      apiService.highAvailability.enabled: true
      apiService.dbConnectionSecretName: external-db
      requestStore.backend: postgres
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: database-migration
      - equal:
          path: metadata.labels["skypilot.co/helm-revision"]
          value: "0"

  - it: should run accepted V1 cleanup only after the deselecting upgrade
    release:
      upgrade: true
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      databaseMigration.authorityV1RetirementPhase: deselect
      resourceActions.authorityWorker.activeCohort: ""
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "10"
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - python
            - -m
            - sky.server.requests.authority_worker_retirement
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_STATE_DB_MIGRATION_MODE
            value: verify
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVER_SERVE_SCHEMA_MIGRATION_CEILING
            value: "037"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_ACCEPTED_V1_CLEANUP_ONLY
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_COHORT_SUFFIXES_JSON
            value: '["p2a-v1"]'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_DESELECTED_SUFFIXES_JSON
            value: '["p2a-v1"]'
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_RELEASE_PREFLIGHT_JSON

  - it: should validate the tombstone ledger before removing V1 objects
    release:
      upgrade: true
    values:
      - fixtures/resource-action-authority-values.yaml
      - fixtures/resource-action-authority-tombstone-values.yaml
    set:
      databaseMigration.authorityV1RetirementPhase: tombstone
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - python
            - -m
            - sky.server.database_migrations
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_STATE_DB_MIGRATION_MODE
            value: upgrade
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVER_SERVE_SCHEMA_MIGRATION_CEILING
            value: "037"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_RELEASE_PREFLIGHT_JSON
            value: '{"enabled":true,"helm_full_name":"release-name","helm_release_name":"RELEASE-NAME","installation_id":"01234567-89ab-cdef-0123-456789abcdef","live_manifest_files":[],"namespace":"NAMESPACE","tombstone_suffixes":["p2a-v1"],"version":1}'
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_ACCEPTED_V1_CLEANUP_ONLY

  - it: should reject accepted V1 retirement during install
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      databaseMigration.authorityV1RetirementPhase: deselect
      resourceActions.authorityWorker.activeCohort: ""
    asserts:
      - failedTemplate:
          errorMessage: authority V1 retirement phases are valid only during Helm upgrade

  - it: should reject a retirement phase when the migration job is disabled
    release:
      upgrade: true
    set:
      databaseMigration.enabled: false
      databaseMigration.authorityV1RetirementPhase: deselect
    asserts:
      - failedTemplate:
          errorMessage: authority V1 retirement phases require databaseMigration.enabled=true

  - it: should reject deselect while a cohort is still selected
    release:
      upgrade: true
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      databaseMigration.authorityV1RetirementPhase: deselect
    asserts:
      - failedTemplate:
          errorMessage: authority V1 retirement phases require resourceActions.authorityWorker.activeCohort to be empty

  - it: should reject tombstone while a live cohort remains rendered
    release:
      upgrade: true
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      databaseMigration.authorityV1RetirementPhase: tombstone
      resourceActions.authorityWorker.activeCohort: ""
    asserts:
      - failedTemplate:
          errorMessage: authority V1 tombstone requires the live cohort inventory to be empty

  - it: should reject chart-managed database secrets in HA mode
    set:
      apiService.highAvailability.enabled: true
      apiService.dbConnectionString: postgresql://user:pass@host:5432/db
    asserts:
      - failedTemplate:
          errorMessage: "apiService.highAvailability.enabled=true requires a pre-existing apiService.dbConnectionSecretName for the blocking migration hook"

  - it: should reserve migration hook annotations in HA mode
    set:
      apiService.highAvailability.enabled: true
      apiService.dbConnectionSecretName: external-db
      requestStore.backend: postgres
      databaseMigration.annotations:
        helm.sh/hook: post-install
    asserts:
      - failedTemplate:
          errorMessage: 'databaseMigration.annotations["helm.sh/hook"] is managed by guarded PostgreSQL mode'

  - it: should run the guarded preflight hook after HA is fully cleared
    release:
      name: stable-release
      namespace: stable-namespace
    set:
      apiService.dbConnectionSecretName: external-db
      apiService.highAvailability.enabled: false
      requestStore.backend: postgres
      resourceActions.authorityWorker.enabled: false
      resourceActions.authorityWorker.installationId: ""
      resourceActions.authorityWorker.cohorts: []
      resourceActions.authorityWorker.retirementTombstones: []
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_RELEASE_PREFLIGHT_JSON
            value: '{"enabled":false,"helm_full_name":"stable-release","helm_release_name":"stable-release","installation_id":"","live_manifest_files":[],"namespace":"stable-namespace","tombstone_suffixes":[],"version":1}'

  - it: should keep the Helm release anchor stable across a full-name override
    release:
      name: stable-release
      namespace: stable-namespace
    set:
      fullnameOverride: proposed-full-name
      apiService.dbConnectionSecretName: external-db
      apiService.highAvailability.enabled: false
      requestStore.backend: postgres
      resourceActions.authorityWorker.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_RELEASE_PREFLIGHT_JSON
            value: '{"enabled":false,"helm_full_name":"proposed-full-name","helm_release_name":"stable-release","installation_id":"","live_manifest_files":[],"namespace":"stable-namespace","tombstone_suffixes":[],"version":1}'

  - it: should mount each enabled cohort manifest for exact pre-apply validation
    values:
      - fixtures/resource-action-authority-values.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_RELEASE_PREFLIGHT_JSON
            value: '{"enabled":true,"helm_full_name":"release-name","helm_release_name":"RELEASE-NAME","installation_id":"01234567-89ab-cdef-0123-456789abcdef","live_manifest_files":[{"cohort_suffix":"p2a-v1","path":"/etc/skypilot/resource-action-authority/release-preflight/p2a-v1/manifest.json"}],"namespace":"NAMESPACE","tombstone_suffixes":[],"version":1}'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: authority-preflight-0
            mountPath: /etc/skypilot/resource-action-authority/release-preflight/p2a-v1/manifest.json
            subPath: manifest.json
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: authority-preflight-0
            configMap:
              name: skypilot-ra-preflight-c3dfc52db6939125f1690179a09930e316d14a84
              defaultMode: 292
              items:
                - key: manifest.json
                  path: manifest.json

  - it: should reserve enabled preflight manifest volume names
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      databaseConnection.extraVolumes:
        - name: authority-preflight-0
          emptyDir: {}
    asserts:
      - failedTemplate:
          errorMessage: volume name "authority-preflight-0" is duplicated or reserved by the chart

  - it: should reserve enabled preflight manifest mount paths
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      databaseConnection.extraVolumeMounts:
        - name: compatibility-manifest
          mountPath: /etc/skypilot/resource-action-authority/release-preflight/p2a-v1/manifest.json
    asserts:
      - failedTemplate:
          errorMessage: volume mount path "/etc/skypilot/resource-action-authority/release-preflight/p2a-v1/manifest.json" is duplicated or reserved by the chart

  - it: should reserve the guarded release proposal environment
    set:
      apiService.dbConnectionSecretName: external-db
      requestStore.backend: postgres
      databaseConnection.extraEnvs:
        - name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_RELEASE_PREFLIGHT_JSON
          value: '{}'
    asserts:
      - failedTemplate:
          errorMessage: environment variable "SKYPILOT_RESOURCE_ACTION_AUTHORITY_RELEASE_PREFLIGHT_JSON" is duplicated or reserved by the chart

  - it: should use the chart-managed connection secret
    set:
      apiService.dbConnectionString: postgresql://user:pass@host:5432/db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_DB_CONNECTION_URI
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-db-connection
                key: connection_string
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_RESOURCE_ACTION_AUTHORITY_RELEASE_PREFLIGHT_JSON

  - it: should migrate the durable request schema when PostgreSQL is selected
    set:
      apiService.dbConnectionSecretName: external-db
      requestStore.backend: postgres
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_API_REQUEST_BACKEND
            value: postgres

  - it: should bootstrap only when fresh-schema isolation is explicit
    set:
      apiService.dbConnectionSecretName: external-db
      databaseMigration.bootstrapFreshSchema: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_STATE_DB_MIGRATION_MODE
            value: bootstrap

  - it: should preserve the revision suffix within the Kubernetes name limit
    set:
      fullnameOverride: a-very-long-skypilot-release-name-that-fills-the-kubernetes-name-limit
      apiService.dbConnectionSecretName: external-db
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,49}-db-migration-0$
      - equal:
          path: metadata.labels.app
          value: a-very-long-skypilot-release-name-that-fills-the-db-migration-0
      - equal:
          path: spec.template.metadata.labels.app
          value: a-very-long-skypilot-release-name-that-fills-the-db-migration-0

  - it: should inherit image policy scheduling but exclude API-only inputs
    set:
      global.imageRegistry: registry.example.com/cache
      global.imagePullSecrets:
        - name: pull-secret
      apiService.image: upstream.example/skypilot:test
      apiService.dbConnectionSecretName: external-db
      apiService.nodeSelector:
        pool: control
      apiService.tolerations:
        - key: control
          operator: Exists
      apiService.extraEnvs:
        - name: API_ONLY_SECRET
          value: must-not-leak
      apiService.extraVolumes:
        - name: api-only-secret
          secret:
            secretName: api-only-secret
      apiService.extraVolumeMounts:
        - name: api-only-secret
          mountPath: /etc/api-only
          readOnly: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/cache/skypilot:test
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: pull-secret
      - equal:
          path: spec.template.spec.nodeSelector.pool
          value: control
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: control
            operator: Exists
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_ONLY_SECRET
            value: must-not-leak
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - isNull:
          path: spec.template.spec.volumes

  - it: should receive shared database connection settings
    set:
      apiService.dbConnectionSecretName: external-db
      databaseConnection.extraEnvs:
        - name: PGSSLMODE
          value: verify-full
      databaseConnection.extraVolumes:
        - name: shared-db-ca
          secret:
            secretName: shared-db-ca
      databaseConnection.extraVolumeMounts:
        - name: shared-db-ca
          mountPath: /etc/shared-db
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLMODE
            value: verify-full
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared-db-ca
            mountPath: /etc/shared-db
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared-db-ca
            secret:
              secretName: shared-db-ca

  - it: should be absent without an external database
    asserts:
      - hasDocuments:
          count: 0

  - it: should be absent when migration ownership is disabled
    set:
      apiService.dbConnectionSecretName: external-db
      databaseMigration.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should reject an extra environment override of migration ownership
    set:
      apiService.dbConnectionSecretName: external-db
      databaseConnection.extraEnvs:
        - name: SKYPILOT_STATE_DB_MIGRATION_MODE
          value: auto
    asserts:
      - failedTemplate:
          errorMessage: "SKYPILOT_STATE_DB_MIGRATION_MODE is managed by databaseMigration and cannot be set through extraEnvs"

  - it: should reject an override of the migration request-store selector
    set:
      apiService.dbConnectionSecretName: external-db
      databaseConnection.extraEnvs:
        - name: SKYPILOT_API_REQUEST_BACKEND
          value: postgres
    asserts:
      - failedTemplate:
          errorMessage: 'environment variable "SKYPILOT_API_REQUEST_BACKEND" is duplicated or reserved by the chart'

  - it: should reject duplicate shared environment names
    set:
      apiService.dbConnectionSecretName: external-db
      global.extraEnvs:
        - name: PGSSLMODE
          value: require
      databaseConnection.extraEnvs:
        - name: PGSSLMODE
          value: verify-full
    asserts:
      - failedTemplate:
          errorMessage: 'environment variable "PGSSLMODE" is duplicated or reserved by the chart'

  - it: should reject the chart-owned database URI environment
    set:
      apiService.dbConnectionSecretName: external-db
      databaseConnection.extraEnvs:
        - name: SKYPILOT_DB_CONNECTION_URI
          value: postgresql://unexpected
    asserts:
      - failedTemplate:
          errorMessage: 'environment variable "SKYPILOT_DB_CONNECTION_URI" is duplicated or reserved by the chart'

  - it: should reject an override of central server database selection
    set:
      apiService.dbConnectionSecretName: external-db
      databaseConnection.extraEnvs:
        - name: IS_SKYPILOT_SERVER
          value: "false"
    asserts:
      - failedTemplate:
          errorMessage: 'environment variable "IS_SKYPILOT_SERVER" is duplicated or reserved by the chart'

  - it: should reject duplicate shared volume names
    set:
      apiService.dbConnectionSecretName: external-db
      databaseConnection.extraVolumes:
        - name: db-material
          secret:
            secretName: first
        - name: db-material
          secret:
            secretName: second
    asserts:
      - failedTemplate:
          errorMessage: 'volume name "db-material" is duplicated or reserved by the chart'

  - it: should reject duplicate shared mount paths
    set:
      apiService.dbConnectionSecretName: external-db
      databaseConnection.extraVolumeMounts:
        - name: first-db-material
          mountPath: /etc/database
        - name: second-db-material
          mountPath: /etc/database
    asserts:
      - failedTemplate:
          errorMessage: 'volume mount path "/etc/database" is duplicated or reserved by the chart'
