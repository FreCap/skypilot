# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: resource_action_authority_workers_test
templates:
  - templates/resource-action-authority-workers.yaml
tests:
  - it: should remain completely dark by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should reject a dotted rendered Helm full name
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      fullnameOverride: bad.name
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker requires the rendered Helm full name to be one lowercase DNS label

  - it: should reject an uppercase rendered Helm full name
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      fullnameOverride: Bad
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker requires the rendered Helm full name to be one lowercase DNS label

  - it: should reject a leading-hyphen rendered Helm full name
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      fullnameOverride: -bad
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker requires the rendered Helm full name to be one lowercase DNS label

  - it: should reject a dotted full name in tombstone-only mode
    values:
      - fixtures/resource-action-authority-values.yaml
      - fixtures/resource-action-authority-tombstone-values.yaml
    set:
      fullnameOverride: bad.name
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker requires the rendered Helm full name to be one lowercase DNS label

  - it: should require an immutable installation UUID before enablement
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      resourceActions.authorityWorker.installationId: ""
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker.installationId must be a canonical lowercase UUID

  - it: should reject identical health and preflight ports
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      resourceActions.authorityWorker.healthPort: 46583
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker healthPort and preflightPort must differ

  - it: should require the PostgreSQL HA topology
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      apiService.highAvailability.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker.enabled=true requires apiService.highAvailability.enabled=true

  - it: should require the purpose authentication Secret
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      resourceActions.authorityWorker.auth.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker.auth existingSecret and key are required

  - it: should reject the LB-sync Secret key as the purpose credential
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      serve.externalLoadBalancer.auth.lbSync.existingSecret: authority-auth
      serve.externalLoadBalancer.auth.lbSync.key: tokens
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker.auth and serve.externalLoadBalancer.auth.lbSync must reference different Secret keys

  - it: should reject the controller-admin Secret key as the purpose credential
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      serve.externalLoadBalancer.auth.controllerAdmin.existingSecret: authority-auth
      serve.externalLoadBalancer.auth.controllerAdmin.key: tokens
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker.auth and serve.externalLoadBalancer.auth.controllerAdmin must reference different Secret keys

  - it: should reject the data-plane Secret key as the purpose credential
    values:
      - fixtures/resource-action-authority-values.yaml
    set:
      serve.externalLoadBalancer.auth.lbDataPlane.existingSecret: authority-auth
      serve.externalLoadBalancer.auth.lbDataPlane.key: tokens
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker.auth and serve.externalLoadBalancer.auth.lbDataPlane must reference different Secret keys

  - it: should require the exact qualification bytes to be chart-packaged
    values:
      - fixtures/resource-action-authority-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'resourceActions.authorityWorker cohort "p2a-v1" qualification artifact is not packaged by this chart'

  - it: should reject configured tolerations that overlap a fixed admission default
    values:
      - fixtures/resource-action-authority-values.yaml
      - fixtures/resource-action-authority-colliding-toleration-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker executorService.tolerations[0] collides with a fixed authority-worker NoExecute toleration

  - it: should retain only exact API verifier RBAC after the last cohort is removed
    values:
      - fixtures/resource-action-authority-values.yaml
      - fixtures/resource-action-authority-tombstone-values.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: kind
          value: Role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: release-name-authority-retirement-verifier
        documentIndex: 0
      - equal:
          path: rules[0].resourceNames
          value:
            - release-name-authority-p2a-v1
        documentIndex: 0
      - equal:
          path: kind
          value: RoleBinding
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: release-name-api-sa
              namespace: NAMESPACE
        documentIndex: 1

  - it: should reject enabled state with neither a live cohort nor a tombstone
    values:
      - fixtures/resource-action-authority-values.yaml
      - fixtures/resource-action-authority-empty-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: resourceActions.authorityWorker.enabled=true requires at least one live cohort or retirement tombstone
