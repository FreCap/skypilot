# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: role_pdbs_test
templates:
  - templates/role-pdbs.yaml
tests:
  - it: should not render role budgets in compatibility mode
    asserts:
      - hasDocuments:
          count: 0

  - it: should preserve desired replicas minus one for every HA role
    set:
      apiService.highAvailability.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: PodDisruptionBudget
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-api
        documentIndex: 0
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentIndex: 0
      - notExists:
          path: spec.minAvailable
        documentIndex: 0
      - equal:
          path: spec.selector.matchLabels.app
          value: RELEASE-NAME-api
        documentIndex: 0
      - isKind:
          of: PodDisruptionBudget
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-executor
        documentIndex: 1
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentIndex: 1
      - notExists:
          path: spec.minAvailable
        documentIndex: 1
      - equal:
          path: spec.selector.matchLabels.app
          value: RELEASE-NAME-executor
        documentIndex: 1
      - isKind:
          of: PodDisruptionBudget
        documentIndex: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-controller
        documentIndex: 2
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentIndex: 2
      - notExists:
          path: spec.minAvailable
        documentIndex: 2
      - equal:
          path: spec.selector.matchLabels.app
          value: RELEASE-NAME-controller
        documentIndex: 2
