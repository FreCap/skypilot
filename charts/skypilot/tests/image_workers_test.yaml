# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: image_workers_test
templates:
  - templates/image-workers.yaml
tests:
  - it: should use PostgreSQL as the guarded-HA config authority
    set:
      apiService.highAvailability.enabled: true
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_SERVER_CONFIG_MODE
            value: postgres
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_GLOBAL_CONFIG
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.volumes

  - it: should omit config projection from every guarded-HA image worker
    set:
      apiService.highAvailability.enabled: true
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
      imageLifecycleWorker.enabled: true
      imageLifecycleWorker.serviceAccount.create: false
      imageLifecycleWorker.serviceAccount.name: lifecycle-worker
      imageCanaryWorker.enabled: true
      imageCanaryWorker.serviceAccount.create: false
      imageCanaryWorker.serviceAccount.name: canary-worker
    asserts:
      - hasDocuments:
          count: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_GLOBAL_CONFIG
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_GLOBAL_CONFIG
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_GLOBAL_CONFIG
        documentIndex: 2
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
        documentIndex: 0
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
        documentIndex: 1
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
        documentIndex: 2
      - notExists:
          path: spec.template.spec.volumes
        documentIndex: 0
      - notExists:
          path: spec.template.spec.volumes
        documentIndex: 1
      - notExists:
          path: spec.template.spec.volumes
        documentIndex: 2

  - it: should retain config projection for a non-HA image worker
    set:
      apiService.highAvailability.enabled: false
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_GLOBAL_CONFIG
            value: /var/skypilot/config/config.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: skypilot-config
            mountPath: /var/skypilot/config
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: skypilot-config
            configMap:
              name: RELEASE-NAME-config

  - it: should keep source credential RBAC names distinct at the DNS limit
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.sourceCredentialSecrets:
        - namespace: shared
          name: first
        - namespace: shared
          name: second
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-img-src-879ab2becc5b
        documentIndex: 1
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-img-src-879ab2becc5b
        documentIndex: 2
      - equal:
          path: roleRef.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-img-src-879ab2becc5b
        documentIndex: 2
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-img-src-7b7b871b8c5d
        documentIndex: 3
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-img-src-7b7b871b8c5d
        documentIndex: 4
      - equal:
          path: roleRef.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-img-src-7b7b871b8c5d
        documentIndex: 4

  - it: should reject duplicate source credential identities
    set:
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.sourceCredentialSecrets:
        - namespace: shared
          name: duplicate
        - namespace: shared
          name: duplicate
    asserts:
      - failedTemplate:
          errorMessage: "imageCopyWorker.sourceCredentialSecrets contains duplicate identity shared/duplicate"

  - it: should verify migrations and mount shared database connection material
    set:
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
      imageLifecycleWorker.enabled: true
      imageLifecycleWorker.serviceAccount.create: false
      imageLifecycleWorker.serviceAccount.name: lifecycle-worker
      imageCanaryWorker.enabled: true
      imageCanaryWorker.serviceAccount.create: false
      imageCanaryWorker.serviceAccount.name: canary-worker
      databaseConnection.extraEnvs:
        - name: PGSSLMODE
          value: verify-full
      databaseConnection.extraVolumes:
        - name: db-ca
          secret:
            secretName: db-ca
      databaseConnection.extraVolumeMounts:
        - name: db-ca
          mountPath: /etc/db
          readOnly: true
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Deployment
        documentIndex: 0
      - isKind:
          of: Deployment
        documentIndex: 1
      - isKind:
          of: Deployment
        documentIndex: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
        documentIndex: 0
      - equal:
          path: spec.strategy.type
          value: Recreate
        documentIndex: 1
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
        documentIndex: 2
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
        documentIndex: 0
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
        documentIndex: 1
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600
        documentIndex: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_STATE_DB_MIGRATION_MODE
            value: verify
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_STATE_DB_MIGRATION_MODE
            value: verify
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_STATE_DB_MIGRATION_MODE
            value: verify
        documentIndex: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLMODE
            value: verify-full
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLMODE
            value: verify-full
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLMODE
            value: verify-full
        documentIndex: 2
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-ca
            mountPath: /etc/db
            readOnly: true
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-ca
            mountPath: /etc/db
            readOnly: true
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-ca
            mountPath: /etc/db
            readOnly: true
        documentIndex: 2
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db-ca
            secret:
              secretName: db-ca
        documentIndex: 0
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db-ca
            secret:
              secretName: db-ca
        documentIndex: 1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db-ca
            secret:
              secretName: db-ca
        documentIndex: 2

  - it: should default missing legacy worker grace values during reuse upgrades
    set:
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
      imageCopyWorker.terminationGracePeriodSeconds: null
      imageLifecycleWorker.enabled: true
      imageLifecycleWorker.serviceAccount.create: false
      imageLifecycleWorker.serviceAccount.name: lifecycle-worker
      imageLifecycleWorker.terminationGracePeriodSeconds: null
      imageCanaryWorker.enabled: true
      imageCanaryWorker.serviceAccount.create: false
      imageCanaryWorker.serviceAccount.name: canary-worker
      imageCanaryWorker.terminationGracePeriodSeconds: null
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
        documentIndex: 0
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
        documentIndex: 1
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600
        documentIndex: 2

  - it: should use auto migration ownership only when the migration job is disabled
    set:
      apiService.dbConnectionSecretName: external-db
      databaseMigration.enabled: false
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_STATE_DB_MIGRATION_MODE
            value: auto

  - it: should render lifecycle retention as an integer environment value
    set:
      apiService.dbConnectionSecretName: external-db
      imageLifecycleWorker.enabled: true
      imageLifecycleWorker.serviceAccount.create: false
      imageLifecycleWorker.serviceAccount.name: lifecycle-worker
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SKYPILOT_IMAGE_RETENTION_SECONDS
            value: "4838400"

  - it: should allow the canary worker to be quiesced at zero replicas
    set:
      apiService.dbConnectionSecretName: external-db
      imageCanaryWorker.enabled: true
      imageCanaryWorker.replicaCount: 0
      imageCanaryWorker.serviceAccount.create: false
      imageCanaryWorker.serviceAccount.name: canary-worker
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.replicas
          value: 0

  - it: should reject a shared database migration ownership override
    set:
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
      databaseConnection.extraEnvs:
        - name: SKYPILOT_STATE_DB_MIGRATION_MODE
          value: auto
    asserts:
      - failedTemplate:
          errorMessage: "SKYPILOT_STATE_DB_MIGRATION_MODE is managed by databaseMigration and cannot be set through extraEnvs"

  - it: should reject a copy worker migration ownership override
    set:
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
      imageCopyWorker.extraEnvs:
        - name: SKYPILOT_STATE_DB_MIGRATION_MODE
          value: auto
    asserts:
      - failedTemplate:
          errorMessage: "SKYPILOT_STATE_DB_MIGRATION_MODE is managed by databaseMigration and cannot be set through extraEnvs"

  - it: should reject a lifecycle worker migration ownership override
    set:
      apiService.dbConnectionSecretName: external-db
      imageLifecycleWorker.enabled: true
      imageLifecycleWorker.serviceAccount.create: false
      imageLifecycleWorker.serviceAccount.name: lifecycle-worker
      imageLifecycleWorker.extraEnvs:
        - name: SKYPILOT_STATE_DB_MIGRATION_MODE
          value: auto
    asserts:
      - failedTemplate:
          errorMessage: "SKYPILOT_STATE_DB_MIGRATION_MODE is managed by databaseMigration and cannot be set through extraEnvs"

  - it: should reject a canary worker migration ownership override
    set:
      apiService.dbConnectionSecretName: external-db
      imageCanaryWorker.enabled: true
      imageCanaryWorker.serviceAccount.create: false
      imageCanaryWorker.serviceAccount.name: canary-worker
      imageCanaryWorker.extraEnvs:
        - name: SKYPILOT_STATE_DB_MIGRATION_MODE
          value: auto
    asserts:
      - failedTemplate:
          errorMessage: "SKYPILOT_STATE_DB_MIGRATION_MODE is managed by databaseMigration and cannot be set through extraEnvs"

  - it: should reject a shared volume colliding with the copy worker config
    set:
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
      databaseConnection.extraVolumes:
        - name: skypilot-config
          secret:
            secretName: unexpected
    asserts:
      - failedTemplate:
          errorMessage: 'volume name "skypilot-config" is duplicated or reserved by the chart'

  - it: should reject a shared mount colliding with qualification manifests
    set:
      apiService.dbConnectionSecretName: external-db
      imageCopyWorker.enabled: true
      imageCopyWorker.serviceAccount.create: false
      imageCopyWorker.serviceAccount.name: copy-worker
      databaseConnection.extraVolumeMounts:
        - name: unexpected
          mountPath: /var/skypilot/image-qualification
    asserts:
      - failedTemplate:
          errorMessage: 'volume mount path "/var/skypilot/image-qualification" is duplicated or reserved by the chart'

  - it: should reject a shared volume colliding with the canary kubeconfig
    set:
      apiService.dbConnectionSecretName: external-db
      imageCanaryWorker.enabled: true
      imageCanaryWorker.serviceAccount.create: false
      imageCanaryWorker.serviceAccount.name: canary-worker
      databaseConnection.extraVolumes:
        - name: kubeconfig
          secret:
            secretName: unexpected
    asserts:
      - failedTemplate:
          errorMessage: 'volume name "kubeconfig" is duplicated or reserved by the chart'
