apiService:
  highAvailability:
    enabled: true
  replicas: 2
  upgradeStrategy: RollingUpdate
  dbConnectionSecretName: external-db
  extraVolumes:
    - name: skypilot-rwx-authority-fence
      persistentVolumeClaim:
        claimName: skypilot-state-authority
        readOnly: true
requestStore:
  backend: postgres
  enforceBuiltinExecutionQuiescenceBackends: true
storage:
  enabled: true
  accessMode: ReadWriteMany
  existingClaim: skypilot-state-rwx
executorService:
  replicas: 2
controllerService:
  replicas: 2
extraInitContainers:
  - name: verify-rwx-authority-fence
    image: registry.example/skypilot-ops@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    command:
      - python
      - -c
      - verify-authority-fence
    env:
      - name: SKYPILOT_RWX_AUTHORITY_FENCE_EXPECTED_SHA256
        value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: SKYPILOT_RWX_AUTHORITY_FENCE_EXPECTED_POSTGRES_EVIDENCE_SHA256
        value: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: skypilot-rwx-authority-fence
        mountPath: /var/run/skypilot/rwx-authority
        readOnly: true
