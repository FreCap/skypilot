serve:
  externalLoadBalancer:
    enabled: true
    priorityClassName: skypilot-serve-lb
    serviceAnnotations:
      example.com/a-listener: enabled
      example.com/z-listener: "4000"
    auth:
      lbSync:
        existingSecret: serve-lb-sync
        key: tokens
      controllerAdmin:
        existingSecret: serve-controller-admin
        key: tokens
      lbDataPlane:
        existingSecret: serve-lb-data-plane
        key: tokens
