# Global configuration for all components in the chart.
global:
  # Override the default imageRegistry for all images in the chart.
  # @schema type: [string, null]
  imageRegistry: null
  # Specify imagePullSecrets for all components in the chart.
  # @schema type: [array, null]; item: object
  imagePullSecrets: null
  # Specify extra environment variables to set on all components in the chart.
  # @schema type: [array, null]; item: object
  extraEnvs: null

# Override the base name of the resources created by this chart.
# @schema type: [string, null]
fullnameOverride: null


apiService:
  # Docker image to use for the API server. The default value will be updated by the release pipeline to be consistent with the SkyPilot release or nightly build.
  # Refer to https://docs.skypilot.co/en/latest/reference/api-server/helm-values-spec.html#helm-values-apiservice-image for more details.
  image: berkeleyskypilot/skypilot-nightly:latest
  # Number of stateless API replicas. highAvailability.enabled requires at
  # least two.
  replicas: 1
  highAvailability:
    # Split public API serving from durable request execution. Requires
    # PostgreSQL, ReadWriteMany storage, RollingUpdate, and executorService.
    # @schema type: [boolean]
    enabled: false
    # Seconds between publishing an unready pod-local drain marker and
    # Kubernetes sending SIGTERM. This must cover the configured readiness
    # probe failure-detection window; the chart validates that relationship.
    # @schema type: [integer]; minimum: 1
    readinessDrainSeconds: 20
  preDeployHook: |-
    # Run commands before deploying the API server, e.g. installing an admin policy.
    # Refer to https://docs.skypilot.co/en/latest/cloud-setup/policy.html for more details about admin policy.
    # Remember to set the admin policy in the config section below.
    echo "Pre-deploy hook"

    # Uncomment the following lines to install the admin policy

    # echo "Installing admin policy"
    # pip install git+https://github.com/michaelvll/admin-policy-examples

  # Upgrade strategy for the API server, available options are:
  # - Recreate: delete the old pod first and create a new one (has downtime).
  # - RollingUpdate: create a new pod first, wait for it to be ready, then
  #   delete the old one. This remains experimental unless guarded high
  #   availability is enabled.
  # Default to Recreate. When set to RollingUpdate, an external database must be configured via .apiService.dbConnectionSecretName or .apiService.dbConnectionString.
  # For persistent storage with RollingUpdate, use storage.accessMode=ReadWriteMany with an RWX-capable storage class.
  # If storage.enabled=false with RollingUpdate, file mounts and logs will be lost on pod restart; consider configuring
  # 'jobs.bucket' in the SkyPilot config to persist file mounts to cloud storage.
  upgradeStrategy: Recreate
  # Rolling update tuning, only applied when upgradeStrategy is RollingUpdate.
  # Defaults reproduce the previous hard-coded behavior: surge a new pod before
  # removing an old one (zero-downtime). For deployments whose api-server pod
  # requests most or all of a node's allocatable resources, a surge replica
  # cannot be scheduled and the rollout stalls; set maxSurge: 0 and
  # maxUnavailable: 1 to roll in place without surging. Values may be integers
  # or percentage strings (e.g. "25%").
  # @schema type: [object, null]
  rollingUpdate:
    # @schema type: [integer, string]
    maxSurge: 1
    # @schema type: [integer, string]
    maxUnavailable: 0
  # Deprecated: use other auth methods instead.
  # Refer to https://docs.skypilot.co/en/latest/reference/auth.html for more details.
  # Enable basic auth and user management in the API server
  # If enabled, the user can be created, updated, and deleted in the Dashboard,
  # and the basic auth will be done in the API server instead of the ingress.
  # If enabled, the basic auth configuration `ingress.authCredentials`
  # and `ingress.authSecret` in the ingress will be ignored.
  enableUserManagement: false
  # Deprecated: use `auth.serviceAccount.enabled` instead.
  # @schema type: [boolean]
  enableServiceAccounts: true
  # Initial basic auth credentials for the API server
  # The user in the credentials will be used to create a new admin user in the API server,
  # and the password can be updated by the user in the Dashboard.
  # If both `initialBasicAuthCredentials` and `initialBasicAuthSecret` are set,
  # `initialBasicAuthSecret` will be used.
  # They are only used when `enableUserManagement` is true.
  initialBasicAuthCredentials: "skypilot:$apr1$c1h4rNxt$2NnL7dIDUV0tWsnuNMGSr/"
  # @schema type: [string, null]
  initialBasicAuthSecret: null
  # Custom header name for user authentication (overrides default 'X-Auth-Request-Email')
  # If not set, the default header 'X-Auth-Request-Email' will be used
  # @schema type: [string, null]
  authUserHeaderName: null
  # The number of seconds to wait for the API server to finish processing the request before shutting down.
  # If the API server is not able to finish processing the request within the grace period, the request will be aborted.
  # The default value is 60 seconds.
  terminationGracePeriodSeconds: 60

  # Dev mode: do not start and probe the server automatically
  devMode:
    enabled: false

  # Liveness and readiness probe configuration for the API server container.
  # @schema type: [object, null]
  livenessProbe:
    httpGet:
      path: /api/health
      port: 46580
    periodSeconds: 30
    timeoutSeconds: 1
  # @schema type: [object, null]
  readinessProbe:
    httpGet:
      path: /api/health/ready
      port: 46580
    failureThreshold: 3
    periodSeconds: 5
    initialDelaySeconds: 5
    timeoutSeconds: 1
  # Startup probe for the API server container. Until it succeeds, liveness
  # and readiness probes are suspended, giving the server a generous budget
  # (10 minutes by default) for pre-bind initialization (database setup,
  # migrations, state recovery) that grows with the amount of managed state.
  # Without it, a slow restart on a large deployment gets killed by the
  # liveness probe and the pod enters CrashLoopBackOff.
  # @schema type: [object, null]
  startupProbe:
    httpGet:
      path: /api/health
      port: 46580
    failureThreshold: 60
    periodSeconds: 10
    timeoutSeconds: 1

  # Set ~/.sky/config.yaml content on the API server
  # This value is IGNORED during an helm upgrade if there is an existing config
  # due to the potential accidental loss of existing config. Use the SkyPilot dashboard to update the config.
  # If remote database is configured (either via dbConnectionSecretName or dbConnectionString), config must be null.
  # In such case, you can add the config via the dashboard once the API server is deployed.
  # Refer to https://docs.skypilot.co/en/latest/reference/config.html for more details.
  # @schema type: [string, null]
  config: null
  # config: |
  #   admin_policy: admin_policy_examples.AddLabelsPolicy
  #
  #   kubernetes:
  #     allowed_contexts:
  #       - gke_sky-dev-465_us-central1-c_skypilot-test-cluster
  #       - gke_sky-dev-465_us-central1-c_skypilot-test-cluster-2
  #
  #   jobs:
  #     controller:
  #       resources:
  #         cpus: 2+
  #
  #   allowed_clouds:
  #     - aws
  #     - kubernetes

  # Use a secret to set the DB connection string for the API server.
  # If configured, SkyPilot uses the external database to store states instead of the SQLite database.
  # Refer to https://docs.skypilot.co/en/latest/reference/api-server/api-server-admin-deploy.html#optional-back-the-api-server-with-a-persistent-database and https://docs.skypilot.co/en/latest/reference/architecture/state.html for more details.
  # If either this field or dbConnectionString is set, config must be null.
  # To specify a config, use the dashboard once the API server is deployed.
  # @schema type: [string, null]
  dbConnectionSecretName: null
  # Set the DB connection string directly. This is a shortcut for setting the DB connection string in a secret.
  # @schema type: [string, null]
  dbConnectionString: null

  # Set ~/.sky/ssh_node_pools.yaml content on the API server
  # Updating this value will not restart the API server but it will take tens of seconds to take effect on the API server.
  # You can verify config updates on the server by exec-ing into the pod and running `cat ~/.sky/ssh_node_pools.yaml`
  # Refer to https://docs.skypilot.co/en/latest/reservations/existing-machines.html#defining-ssh-node-pools for more details.
  # @schema type: [string, null]
  sshNodePools: null
  # sshNodePools: |
  #  my-cluster:
  #    hosts:
  #      - 1.2.3.4
  #      - 1.2.3.5
  #  my-box:
  #    hosts:
  #      - hostname_in_ssh_config
  # Optional secret that contains SSH keys for the API server to use, all the entries in the secret will be mounted to ~/.ssh/ directory in the API server.
  # @schema type: [string, null]
  sshKeySecret: null
  # Metrics configuration for the API server.
  # Refer to https://docs.skypilot.co/en/latest/reference/api-server/examples/api-server-metrics-setup.html for more details.
  metrics:
    # Whether to enable metrics collection, default to false. If this is enabled and the API server image does not support metrics, the deployment will fail.
    enabled: false
    # The port to expose the metrics on, default to 9090.
    port: 9090
    # NOTE: model-serving (/endpoints-metrics) federation + dashboards are
    # gated separately by prometheus.scrapeEndpointMetrics.
  # Custom annotations for the API server deployment
  # @schema type: [object, null]
  annotations: null

  # Skip resource check for the API server, not recommended for production deployment
  skipResourceCheck: false
  # Set resource requests and limits for the API server
  # @schema skipProperties:true
  resources:
    # Request a moderate amount of resources for an remote API server by default, which meets the
    # basic requirements for team usage at medium scale.
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  # Extra environment variables to set before starting the API server. Example:
  # extraEnvs:
  #   - name: MY_ADDITIONAL_ENV_VAR
  #     value: "my_value"
  # @schema type: [array, null]; item: object
  extraEnvs: null

  # Extra volumes to mount to the API server. Example:
  # extraVolumes:
  #   - name: my-volume
  #     secret:
  #       secretName: my-secret
  # @schema type: [array, null]; item: object
  extraVolumes: null

  # Extra volume mounts to mount to the API server. Example:
  # extraVolumeMounts:
  #   - name: my-volume
  #     mountPath: /my-path
  #     subPath: my-file
  # @schema type: [array, null]; item: object
  extraVolumeMounts: null

  # Additional containers to run alongside the API server. Example:
  # sidecarContainers:
  #   - name: my-sidecar
  #     image: busybox
  #     args: ["sleep", "3600"]
  # @schema type: [array, null]; item: object
  sidecarContainers: null

  # [Internal] Enable developer mode for SkyPilot
  skypilotDev: false

  # Whether to save server logs to a file (/root/.sky/api_server/server.log)
  # in addition to stdout. When false, logs are only written to stdout (container logs).
  serveServerLog: true

  # Configure how to manage API server logs
  logs:
    retention:
      # Whether to enable log retention
      enabled: true
      # The size of the log file to retain
      size: 10M

  # Image pull policy for the API server pod
  # @schema type: [string, null]
  imagePullPolicy: Always

  # Add scheduling constraints to the API server pod. The same values are applied to
  # oauth2-proxy and the bundled oauth2-proxy-redis Deployment when OAuth is enabled,
  # so auth stays on the same node pool as the API. See
  # https://docs.skypilot.co/en/latest/reference/api-server/helm-values-spec.html
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Spread API server pods across topology domains. The default spreads across
  # nodes; set topology.kubernetes.io/zone to spread across zones, or "" to
  # disable the constraint. When set, a topologySpreadConstraints entry is
  # rendered with
  # maxSkew=1, whenUnsatisfiable=DoNotSchedule, and a labelSelector
  # that matches the API server pods automatically.
  # @schema type: [string, null]
  topologySpreadTopologyKey: kubernetes.io/hostname

# Active-active workers that claim durable requests from PostgreSQL. This
# Deployment is rendered only when apiService.highAvailability.enabled=true.
executorService:
  # HA mode requires at least two, enforced contextually by the template.
  # @schema type: [integer]; minimum: 0
  replicas: 2
  # Uses apiService.image when null.
  # @schema type: [string, null]
  image: null
  # Uses apiService.imagePullPolicy when null.
  # @schema type: [string, null]
  imagePullPolicy: null
  # Dependency-free liveness and readiness port.
  # @schema type: [integer]; minimum: 1; maximum: 65535
  healthPort: 46581
  # @schema type: [integer]; minimum: 1
  terminationGracePeriodSeconds: 60
  # @schema skipProperties:true
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  # @schema type: [array, null]; item: object
  extraEnvs: null
  # @schema type: [array, null]; item: object
  extraVolumes: null
  # @schema type: [array, null]; item: object
  extraVolumeMounts: null
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # @schema type: [string, null]
  topologySpreadTopologyKey: kubernetes.io/hostname

# Active-standby owners of controller-class requests and singleton maintenance.
# Both replicas remain Ready; PostgreSQL leadership fencing permits only one to
# spawn controller workers or subsystem children at a time. This Deployment is
# rendered only when apiService.highAvailability.enabled=true.
controllerService:
  # HA mode requires at least two, enforced contextually by the template.
  # @schema type: [integer]; minimum: 0
  replicas: 2
  # Uses apiService.image when null.
  # @schema type: [string, null]
  image: null
  # Uses apiService.imagePullPolicy when null.
  # @schema type: [string, null]
  imagePullPolicy: null
  # Dependency-free liveness and readiness port.
  # @schema type: [integer]; minimum: 1; maximum: 65535
  healthPort: 46582
  # @schema type: [integer]; minimum: 1
  terminationGracePeriodSeconds: 60
  # @schema skipProperties:true
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  # @schema type: [array, null]; item: object
  extraEnvs: null
  # @schema type: [array, null]; item: object
  extraVolumes: null
  # @schema type: [array, null]; item: object
  extraVolumeMounts: null
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # @schema type: [string, null]
  topologySpreadTopologyKey: kubernetes.io/hostname

# Dedicated normal-executor cohorts for private Serve resource actions.  This
# surface is dark by default; enabling it requires registered Serve033 cohort
# identities that exactly match the immutable routing inputs rendered here.
resourceActions:
  authorityWorker:
    # @schema type: [boolean]
    enabled: false
    # Cohort selected for new preparation references.  Existing DRAINING
    # cohorts remain listed until all of their frozen work is released.
    # @schema type: string
    activeCohort: ""
    # @schema type: array; itemProperties: {"id": {"type": "string", "minLength": 1, "maxLength": 63}, "replicas": {"type": "integer"}, "image": {"type": "string", "minLength": 1}, "imagePullPolicy": {"type": "string"}}
    cohorts: []
    # Cohort IDs whose removed Deployment/ServiceAccount names remain visible
    # to the surviving retirement verifier.
    # @schema type: array; item: string
    retirementTombstones: []
    # @schema type: [integer]; minimum: 1; maximum: 65535
    healthPort: 46581
    # The future authenticated preflight endpoint.  The routing slice exposes
    # no mutation service and does not treat this Service as activation proof.
    # @schema type: [integer]; minimum: 1; maximum: 65535
    preflightPort: 46583
    auth:
      # @schema type: string
      existingSecret: ""
      # @schema type: string
      key: tokens
    tls:
      # @schema type: string
      existingSecret: ""
      # @schema type: string
      certKey: tls.crt
      # @schema type: string
      privateKeyKey: tls.key
      # @schema type: string
      caKey: ca.crt

# Environment and files required by every central PostgreSQL client. Use these
# for private CA bundles, client certificates, or shared libpq settings instead
# of apiService.extra* so the migration Job and managed image workers receive
# the same connection material without receiving unrelated API-only volumes.
databaseConnection:
  # @schema type: [array, null]; item: object
  extraEnvs: null
  # @schema type: [array, null]; item: object
  extraVolumes: null
  # @schema type: [array, null]; item: object
  extraVolumeMounts: null

# Persistence and delivery backend for API request envelopes. PostgreSQL is an
# explicit compatibility milestone: it is production-safe for one all-role
# pod, while role-split multi-replica mode is enabled by later milestones.
requestStore:
  # @schema enum: [sqlite, postgres]; required: true
  backend: sqlite
  # Shared maintenance gate used by the one-way SQLite cutover command.
  # @schema type: string; minLength: 1; required: true
  cutoverGatePath: /root/.sky/api-request-cutover.json

# Run central PostgreSQL schema upgrades in a revision-scoped Kubernetes Job.
# API replicas verify the resulting revision and never execute deployment DDL.
# Guarded HA runs the Job as a blocking pre-install and pre-upgrade hook and
# therefore requires a pre-existing apiService.dbConnectionSecretName.
# Compatibility mode keeps a regular Job so a chart-managed dbConnectionString
# Secret can be created first.
databaseMigration:
  # @schema type: [boolean]
  enabled: true
  # Allow the migration Job to initialize a new, isolated, empty PostgreSQL
  # schema. Leave false for every existing database and staged upgrade.
  # @schema type: [boolean]
  bootstrapFreshSchema: false
  # @schema type: [integer]; minimum: 0
  backoffLimit: 3
  # @schema type: [integer]; minimum: 1
  activeDeadlineSeconds: 600
  # @schema type: [integer]; minimum: 0
  ttlSecondsAfterFinished: 86400
  # @schema type: [object, null]
  annotations: null
  # @schema skipProperties:true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Managed container image distribution workers. All services are inert unless
# explicitly enabled and require the same external PostgreSQL database as the
# API server. They intentionally use independent Kubernetes service accounts so
# AWS workload identity can grant copy, lifecycle, and canary permissions
# separately.
imageCopyWorker:
  # @schema type: [boolean]
  enabled: false
  # @schema type: [integer]; minimum: 1
  replicaCount: 1
  # Maximum provider-I/O claims handled concurrently by each replica.
  # @schema type: [integer]; minimum: 1
  maxInFlight: 4
  # Dedicated dependency-free probe and Prometheus port.
  # @schema type: [integer]; minimum: 1; maximum: 65535
  healthPort: 8081
  # @schema type: [integer]; minimum: 5
  livenessDeadlineSeconds: 30
  # Maximum time for already-submitted work to drain after SIGTERM.
  # @schema type: [integer]; minimum: 1
  terminationGracePeriodSeconds: 30
  # Uses apiService.image when null.
  # @schema type: [string, null]
  image: null
  # Uses apiService.imagePullPolicy when null.
  # @schema type: [string, null]
  imagePullPolicy: null
  # Optional ConfigMap whose JSON entries are secret-free Terraform
  # qualification manifests. Entries are ingested asynchronously.
  # @schema type: [string, null]
  qualificationManifestConfigMapName: null
  # Exact source dockerconfig Secrets this process may read. The chart grants
  # resourceNames-scoped RBAC only for chart-created service accounts.
  # @schema type: [array]; item: object; maxItems: 64; itemProperties: {"namespace": {"type": "string", "minLength": 1, "maxLength": 253}, "name": {"type": "string", "minLength": 1, "maxLength": 253}}
  sourceCredentialSecrets: []
  serviceAccount:
    # Create the worker service account. Set false with name to use an existing
    # Terraform-managed account.
    # @schema type: [boolean]
    create: true
    # @schema type: [string, null]
    name: null
    # For example, an eks.amazonaws.com/role-arn IRSA annotation.
    # @schema type: [object, null]
    annotations: null
  # @schema skipProperties:true
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  # @schema type: [array, null]; item: object
  extraEnvs: null
  nodeSelector: {}
  tolerations: []
  affinity: {}

imageLifecycleWorker:
  # @schema type: [boolean]
  enabled: false
  # @schema type: [integer]; minimum: 1
  replicaCount: 1
  # @schema type: [integer]; minimum: 1
  maxInFlight: 4
  # @schema type: [integer]; minimum: 1; maximum: 65535
  healthPort: 8081
  # @schema type: [integer]; minimum: 5
  livenessDeadlineSeconds: 30
  # Maximum time for already-submitted work to drain after SIGTERM.
  # @schema type: [integer]; minimum: 1
  terminationGracePeriodSeconds: 30
  # Uses apiService.image when null.
  # @schema type: [string, null]
  image: null
  # Uses apiService.imagePullPolicy when null.
  # @schema type: [string, null]
  imagePullPolicy: null
  # Regional cache retention. Canonical manifests are never evicted.
  # @schema type: [integer]; minimum: 1
  retentionSeconds: 4838400
  serviceAccount:
    # @schema type: [boolean]
    create: true
    # @schema type: [string, null]
    name: null
    # @schema type: [object, null]
    annotations: null
  # @schema skipProperties:true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  # @schema type: [array, null]; item: object
  extraEnvs: null
  nodeSelector: {}
  tolerations: []
  affinity: {}

imageCanaryWorker:
  # @schema type: [boolean]
  enabled: false
  # Zero is supported for protocol-boundary maintenance and safe quiescing.
  # @schema type: [integer]; minimum: 0
  replicaCount: 1
  # Maximum temporary compute canaries handled concurrently by each replica.
  # @schema type: [integer]; minimum: 1
  maxInFlight: 2
  # @schema type: [integer]; minimum: 1; maximum: 65535
  healthPort: 8081
  # @schema type: [integer]; minimum: 5
  livenessDeadlineSeconds: 30
  # Active canaries observe SIGTERM and enter uncancelled provider teardown.
  # This covers cancellation, the 300-second EC2 settling loop, and API margin.
  # @schema type: [integer]; minimum: 600
  terminationGracePeriodSeconds: 600
  # Uses apiService.image when null.
  # @schema type: [string, null]
  image: null
  # Uses apiService.imagePullPolicy when null.
  # @schema type: [string, null]
  imagePullPolicy: null
  # Optional Secret containing a `config` key with the qualified EKS contexts.
  # In-cluster-only qualification does not require it.
  # @schema type: [string, null]
  kubeconfigSecretName: null
  serviceAccount:
    # @schema type: [boolean]
    create: true
    # @schema type: [string, null]
    name: null
    # @schema type: [object, null]
    annotations: null
  # @schema skipProperties:true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  # @schema type: [array, null]; item: object
  extraEnvs: null
  nodeSelector: {}
  tolerations: []
  affinity: {}

# SkyServe (model serving) configuration.
serve:
  # Portable external load balancer support for controller-owned SkyServe LBs.
  # When enabled, each service's LB runs in its own Deployment and syncs through
  # a route implemented on every API pod. The shared api-server Service is the
  # stable rendezvous point; the proxy resolves the current controller owner
  # from the database without rolling the LB during controller failover.
  externalLoadBalancer:
    # Enable/disable external load balancer support. Inert by default. Enabling
    # this requires all three authentication rings below. Data-plane auth is
    # mandatory because every generated inference Service is a provider-default
    # LoadBalancer. Before changing true -> false, down every SkyServe service
    # and verify no skypilot-serve-lb labeled Deployment or Service remains in
    # the Helm release namespace.
    enabled: false
    # Resources for each per-service LB container. Explicit requests keep LBs
    # out of the BestEffort QoS class and make fleet-scale scheduling visible.
    # Set this to null to omit resource requests and limits.
    # @schema type: [object, null]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Authentication rings are intentionally separate so an inference client
    # or LB compromise cannot grant controller-administration privileges.
    # Each Secret value is a newline-delimited token ring. Keep the current and
    # previous token during rotation within ONE ring; projected Secret volumes
    # update in place. The lbSync and controllerAdmin rings must remain
    # disjoint in content, and cannot reference the same Secret key.
    # @schema type: [object, null]
    auth:
      # Tokens presented by an external LB when syncing replica/load state.
      lbSync:
        # Name of an existing Secret in the release namespace.
        existingSecret: ""
        # Key containing the newline-delimited token ring.
        key: ""
      # Tokens accepted only for controller administration and recovery.
      controllerAdmin:
        # Name of an existing Secret in the release namespace.
        existingSecret: ""
        # Key containing the newline-delimited token ring.
        key: ""
      # Tokens accepted from inference clients by the external LB.
      lbDataPlane:
        # Both fields are required when external load balancers are enabled.
        # Clients send the selected token as:
        # X-SkyPilot-Serve-Authorization: Bearer <token>
        # The LB consumes this header, preserving Authorization for the model.
        # Name of an existing Secret in the release namespace.
        existingSecret: ""
        # Key containing the newline-delimited token ring.
        key: ""

# Authentication configuration for the API server
# Refer to https://docs.skypilot.co/en/latest/reference/auth.html for more details.
# @schema type: [object, null]
auth:
  # OAuth Proxy based authentication for the API server
  # @schema type: [object, null]
  oauth:
    # Enable/disable OAuth2 Proxy based authentication on API server
    # Mutually exclusive with authentication on ingress, including basic auth and OAuth2 Proxy on ingress.
    # @schema type: [boolean]
    enabled: false
    # OIDC issuer URL (e.g. Okta domain URL), required when enabled=true
    # @schema type: [string, null]
    oidc-issuer-url: null
    # Client ID from OIDC provider (Okta) (required when enabled=true)
    client-id: ""
    # Client Secret from OIDC provider (Okta) (required when enabled=true)
    client-secret: ""
    # Alternative: Get both client ID and client secret from a Kubernetes secret
    # If set to a secret name, both client-id and client-secret values above are ignored
    # The secret must contain keys named either "client-id" and "client-secret" OR "client_id" and "client_secret"
    # Both dash and underscore formats are supported for compatibility with different secret managers
    # (e.g., HashiCorp Vault requires underscore format due to key naming constraints)
    # If empty/null, the above client-id and client-secret values are used instead
    # See https://docs.skypilot.co/en/latest/reference/auth.html#oauth-client-secret
    client-details-from-secret: ""
    # Email domains to allow (use "*" for all domains)
    email-domain: "*"
    # Session storage settings ("cookie" or "redis")
    session-store-type: "redis"
    # Redis connection URL (redis://host[:port][/db-number])
    # If left as null and session-store-type is redis, a Redis instance will be deployed automatically
    # If set, this external Redis instance will be used
    # @schema type: [string, null]
    redis-url: null
    # Secret containing Redis connection URL (redis_url: 'redis://host[:port][/db-number]').
    # This is used to set redis url from an existing secret and is mutually exclusive with the redis-url field.
    # Refer to redis-url for more details.
    # @schema type: [string, null]
    redis-secret: null
    # Redis container image for session storage
    # @schema type: [string, null]
    redis-image: "redis:7-alpine"
    # Cookie timing settings (in seconds)
    # @schema type: [string, number, null]
    cookie-refresh: null  # refresh tokens after this duration (Access token lifespan minus 1 min)
    # @schema type: [string, number, null]
    cookie-expire: null  # cookie expiration time (should match refresh token lifespan)
    use-https: false

  # Service account token based authentication for the API server
  # @schema type: [object, null]
  serviceAccount:
    # Enable service account tokens for automated API access
    # If enabled, users can create bearer tokens (JWT based) for authentication.
    # JWT secrets are automatically stored in the database for persistence across restarts.
    # Default to `.apiService.enableServiceAccounts` (true) for backward compatibility, setting this will override the default value.
    # This is mutually exclusive with basic auth on ingress.
    # For backward compatibility, this can be used with OAuth2 Proxy on ingress at the same time.
    # @schema type: [boolean, null]
    enabled: null

  # Proxy authentication configuration.
  # Use this when deploying behind an external authentication proxy
  # (e.g., AWS ALB with Cognito, Azure Front Door, custom ingress auth).
  # When enabled, the API server trusts the identity header from the proxy.
  # This is mutually exclusive with auth.oauth and ingress.oauth2-proxy.
  # @schema type: [object, null]
  externalProxy:
    # Enable proxy authentication.
    # @schema type: [boolean]
    enabled: false
    # Header name containing the user identity.
    # @schema type: [string]
    headerName: 'X-Auth-Request-Email'
    # Header format: 'plaintext' or 'jwt'.
    # Use 'jwt' for headers that contain JWT tokens.
    # Use 'plaintext' for headers that contain plain identity strings.
    # @schema type: [string]
    headerFormat: 'plaintext'
    # JWT claim to extract identity from (only used when headerFormat is 'jwt').
    # @schema type: [string]
    jwtIdentityClaim: 'sub'

storage:
  # Enable/disable persistent storage
  # With this enabled, SkyPilot will use a PV to persist the internal data like states, logs, lock files, catalog, etc.
  # Persisted data includes:
  # - Managed job logs (accessible via `sky jobs logs <job_id>` and `sky jobs logs --controller <job_id>`)
  # - File mounts uploaded during managed job submission
  # - API server state and configuration
  # Note: Transient cluster logs (sky-*) and api_server logs are NOT persisted to minimize storage usage.
  # Refer to https://docs.skypilot.co/en/latest/reference/architecture/state.html for more details.
  #
  # IMPORTANT: When using RollingUpdate upgrade strategy:
  # - ReadWriteOnce (RWO): NOT supported - the PVC cannot be mounted by both old and new pods during rolling update.
  # - ReadWriteMany (RWX): Supported - requires an RWX-capable storage class (e.g., NFS-backed storage like Google Filestore,
  #   AWS EFS, Azure Files, or an NFS provisioner). Both pods can mount the same PVC during the rolling update.
  # - storage.enabled=false: Supported - but file mounts and logs will be lost on pod restart. Consider configuring
  #   'jobs.bucket' in the SkyPilot config to use cloud storage for file mounts.
  enabled: true
  # Storage class name - leave empty to use cluster default
  # For RWX storage with RollingUpdate, use a storage class that supports ReadWriteMany access mode:
  # - GKE: Create a Filestore-backed storage class (https://cloud.google.com/filestore/docs/accessing-fileshares)
  # - EKS: Use EFS CSI driver (https://docs.aws.amazon.com/eks/latest/userguide/efs-csi.html)
  # - AKS: Use Azure Files (https://docs.microsoft.com/azure/aks/azure-files-dynamic-pv)
  storageClassName: ""
  # Access modes - ReadWriteOnce or ReadWriteMany depending on what is supported by the storage class
  # When using RollingUpdate upgrade strategy, ReadWriteMany is required for persistent storage.
  accessMode: ReadWriteOnce
  # Storage size
  size: 10Gi
  # Optional selector for matching specific PVs
  selector: {}
    # matchLabels:
    #   environment: prod
  # Optional volume name for binding to specific PV
  volumeName: ""
  # Optional annotations
  annotations: {}


ingress:
  # Whether to use a unified ingress resource for the API server and other services like Grafana.
  # @schema type: [boolean]
  unified: false
  enabled: true
  # Name of the secret containing basic auth credentials for ingress. If not specified, a new secret will be created using authCredentials
  # Example:
  # WEB_USERNAME=skypilot
  # WEB_PASSWORD=skypilot
  # AUTH_STRING=$(htpasswd -nb $WEB_USERNAME $WEB_PASSWORD)
  # kubectl create secret generic basic-auth \
  #   --from-literal=auth=$AUTH_STRING \
  #   -n $NAMESPACE
  # @schema type: [string, null]
  authSecret: null
  # TODO(aylei): deprecate skypilot managed proxy auth to reduce our maintenance burden, replace with examples instead.
  # Basic auth credentials in format "username:encrypted_password" (only used if ingress.authSecret is not set).
  # This will only be honored when ingress-nginx is used.
  # @schema type: [string, null]
  authCredentials: null
  # Host to exclusively accept traffic from (optional) - will respond to all host requests if not set
  # @schema type: [string, null]
  host: null
  # The base path of API server, you may use different path to expose multiple API server through a unified ingress-controller
  path: '/'
  # Ingress class name (for newer Kubernetes versions)
  ingressClassName: nginx
  # Custom annotations for the ingress
  # @schema type: [object, null]
  annotations: null
  # Enable cookie-based session affinity (sticky sessions) on compatibility
  # RollingUpdate deployments. Guarded HA always disables affinity because
  # every request and follow-up is replica-independent.
  sessionAffinity: true

  # TODO(aylei): deprecate skypilot managed proxy auth to reduce our maintenance burden, replace with examples instead.
  # OAuth2 Proxy configuration for authentication
  oauth2-proxy:
    # Enable/disable OAuth2 Proxy deployment
    enabled: false
    # Docker image for OAuth2 Proxy
    image: "quay.io/oauth2-proxy/oauth2-proxy:v7.9.0"
    # Okta domain URL for OIDC issuer (required when enabled=true)
    # @schema type: [string, null]
    oidc-issuer-url: null
    # Client ID from OIDC provider (Okta) (required when enabled=true)
    client-id: ""
    # Client Secret from OIDC provider (Okta) (required when enabled=true)
    client-secret: ""
    # Alternative: Get both client ID and client secret from a Kubernetes secret
    # If set to a secret name, both client-id and client-secret values above are ignored
    # The secret must contain keys named either "client-id" and "client-secret" OR "client_id" and "client_secret"
    # Both dash and underscore formats are supported for compatibility with different secret managers
    # (e.g., HashiCorp Vault requires underscore format due to key naming constraints)
    # If empty/null, the above client-id and client-secret values are used instead
    # See https://docs.skypilot.co/en/latest/reference/auth.html#oauth-client-secret
    client-details-from-secret: ""
    # Use HTTPS (set to true for production environments)
    use-https: false
    # Email domains to allow (use "*" for all domains)
    email-domain: "*"
    # Session storage settings ("cookie" or "redis")
    session-store-type: "redis"
    # Redis connection URL (redis://host[:port][/db-number])
    # If left as null and session-store-type is redis, a Redis instance will be deployed automatically
    # If set, this external Redis instance will be used
    # @schema type: [string, null]
    redis-url: null
    # Redis container image for session storage
    # @schema type: [string, null]
    redis-image: "redis:7-alpine"
    # Cookie timing settings (in seconds)
    # @schema type: [string, number, null]
    cookie-refresh: null  # refresh tokens after this duration (Access token lifespan minus 1 min)
    # @schema type: [string, number, null]
    cookie-expire: null  # cookie expiration time (should match refresh token lifespan)

  # TLS settings to enable https ingress
  tls:
    enabled: false

ingress-nginx:
  enabled: true
  controller:
    allowSnippetAnnotations: true
    service:
      type: LoadBalancer
      # Default annotations for the ingress controller service. We want an L4 loadbalancer by default for maximum compatibility,
      # especially for websocket SSH tunneling. Different cloud providers may require different annotations.
      # Annotations with no side effects are aggregated below to simplify the usage.
      # @schema skipProperties:true
      annotations:
        # For AWS service reconciled by cloud-controller-manager, use NLB by default.
        # If you are using AWS Load Balancer Controller, refer to the following doc to configure annotations:
        # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/service/annotations/
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        # For GKE, use backend service-based external passthrough Network Load Balancer as per best practices.
        # Ref: https://cloud.google.com/kubernetes-engine/docs/concepts/service-load-balancer#load_balancer_types
        cloud.google.com/l4-rbs: "enabled"
        # For Azure, override the healthz check protocol to TCP probe to avoid HTTP auth issues.
        service.beta.kubernetes.io/port_443_health-probe_protocol: "TCP"
        service.beta.kubernetes.io/port_80_health-probe_protocol: "TCP"
    config:
      use-gzip: "true"
      gzip-level: 5
      gzip-min-length: 1000
      http-snippet: |
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

# RBAC controls the in-cluster permissions for the SkyPilot API server.
rbac:
  # Create the API service account and RBAC policies.
  create: true
  # Create RBAC policies for a pre-existing, externally managed API service
  # account in the release namespace. This is mutually exclusive with create,
  # requires serviceAccountName, and does not transfer Helm ownership. The
  # policies include exact get/patch access to the release config ConfigMap.
  bindExistingServiceAccount: false
  # If not specified, the service account name will be generated by the chart.
  serviceAccountName: ""
  # Namespace-scoped rules granted to kubernetesCredentials.inclusterNamespace
  # (or the release namespace when it is unset). When external SkyServe LB
  # support is or was used with a distinct workload namespace, the chart adds
  # a separate least-privilege LB Role in the release namespace automatically.
  # It remains rendered while the feature is disabled so old LB objects can be
  # cleaned up safely after the disabling rollout.
  namespaceRules:
    # Required for managing pods and their lifecycle
    - apiGroups: [ "" ]
      resources: [ "pods", "pods/status", "pods/exec", "pods/portforward", "pods/log" ]
      verbs: [ "*" ]
    # Required for managing services for SkyPilot Pods
    - apiGroups: [ "" ]
      resources: [ "services" ]
      verbs: [ "*" ]
    # Required for managing SSH keys
    - apiGroups: [ "" ]
      resources: [ "secrets" ]
      verbs: [ "*" ]
    # Required for retrieving reason when Pod scheduling fails.
    - apiGroups: [ "" ]
      resources: [ "events" ]
      verbs: [ "get", "list", "watch" ]
    # Required for syncing workspace config changes to ConfigMap
    - apiGroups: [ "" ]
      resources: [ "configmaps" ]
      verbs: [ "get", "patch" ]
    # Required for high-availability controller
    - apiGroups: ["apps"]
      resources: ["deployments", "deployments/status"]
      verbs: ["*"]
    - apiGroups: [""]
      resources: ["persistentvolumeclaims"]
      verbs: ["*"]
  # Cluster-scoped rules for API server.
  clusterRules:
    # Required for getting node resources.
    - apiGroups: [ "" ]
      resources: [ "nodes" ]
      verbs: [ "get", "list", "watch" ]
    # Required for querying GPUs.
    - apiGroups: [ "" ]
      resources: [ "pods" ]
      verbs: [ "get", "list", "watch" ]
    # Required for autodetecting runtime classes
    - apiGroups: [ "node.k8s.io" ]
      resources: [ "runtimeclasses" ]
      verbs: [ "get", "list", "watch" ]
    # Required for exposing services.
    - apiGroups: [ "networking.k8s.io" ]
      resources: [ "ingressclasses" ]
      verbs: [ "get", "list", "watch" ]
    # Required for accessing ingress service.
    # TODO(aylei): unify the ingress of API server and task pods, then remove this.
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["list", "get"]
  # This allows the API server to grant permissions to SkyPilot Pods and system components.
  # `kubernetes.remote_identity` must be specified in the sky config if this is disabled.
  manageRbacPolicies: true
  # This allows the API server to manage system components in the skypilot-system namespace.
  # Required for object store mounting.
  # You can disable this if you do not need additional capabilities of system components like
  # object store mounting or you manage system components manually, i.e. outside of SkyPilot.
  manageSystemComponents: true

  # Custom annotations for the API server service account.
  # @schema type: [object, null]
  serviceAccountAnnotations: null

# Refer to https://docs.skypilot.co/en/latest/reference/api-server/api-server-admin-deploy.html#optional-configure-cloud-accounts for more details to configure different cloud accounts.
# kubernetesCredentials add additional kubernetes cluster permissions to the API server.
kubernetesCredentials:
  # Enable/disable using the API server's cluster for workloads
  useApiServerCluster: true
  # Use the `kube-credentials` secret containing the kubeconfig to authenticate to Kubernetes
  useKubeconfig: false
  # Name of the secret containing the kubeconfig file. Only used if useKubeconfig is true.
  kubeconfigSecretName: kube-credentials
  # Namespace to use for in-cluster resources
  # @schema type: [string, null]
  inclusterNamespace: null

awsCredentials:
  enabled: false
  # Name of the secret containing the aws config and credentials. Only used if enabled is true.
  awsSecretName: aws-credentials

  # Set to true to mount a complete AWS config directory, including the config and the credentials file with multiple profiles.
  # Credentials should be defined in the `credentials` file. If a non-default profile is used, the profile must be additionally be declared in the `config` file.
  # This is required for using different AWS profiles with different workspaces.
  useCredentialsFile: false

  # Key name used to set AWS_ACCESS_KEY_ID.
  accessKeyIdKeyName: aws_access_key_id
  # Key name used to set AWS_SECRET_ACCESS_KEY.
  secretAccessKeyKeyName: aws_secret_access_key


gcpCredentials:
  enabled: false
  # TODO(romilb): This can be made optional by using the project in the key json by default.
  # @schema type: [string, null]
  projectId: null
  # Name of the secret containing the gcp credentials. Only used if enabled is true.
  gcpSecretName: gcp-credentials
  # Docker image to use for initializing the GCP credentials.
  # @schema type: [string, null]
  image: google/cloud-sdk:latest

# Populate RunPod credentials from the secret with key `api_key`
runpodCredentials:
  enabled: false
  # Name of the secret containing the RunPod credentials. Only used if enabled is true.
  runpodSecretName: runpod-credentials

# Populate Digital Ocean credentials from the secret with key `api_key`
digitaloceanCredentials:
  enabled: false
  # Name of the secret containing the Digital Ocean credentials. Only used if enabled is true.
  digitaloceanSecretName: digitalocean-credentials

# Populate Lambda credentials from the secret with key `api_key`
lambdaCredentials:
  enabled: false
  # Name of the secret containing the Lambda credentials. Only used if enabled is true.
  lambdaSecretName: lambda-credentials

# Populate Vast credentials from the secret with key `api_key`
vastCredentials:
  enabled: false
  # Name of the secret containing the Vast credentials. Only used if enabled is true.
  vastSecretName: vast-credentials

# Populate Nebius credentials from the secret with nebius credentials.
nebiusCredentials:
  enabled: false
  # @schema type: [string, null]
  tenantId: null
  # Name of the secret containing the Nebius credentials. Only used if enabled is true.
  nebiusSecretName: nebius-credentials

r2Credentials:
  enabled: false
  # Name of the secret containing the r2 credentials. Only used if enabled is true.
  r2SecretName: r2-credentials

coreweaveCredentials:
  enabled: false
  # Name of the secret containing the coreweave credentials. Only used if enabled is true.
  coreweaveSecretName: coreweave-credentials

# Slurm cluster SSH configuration
# Refer to https://docs.skypilot.co/en/latest/reference/slurm/slurm-getting-started.html for more details.
slurmCredentials:
  # Content of ~/.slurm/config (SSH config format)
  # Pass via --set-file slurmCredentials.config=/path/to/slurm/config
  # @schema type: [string, null]
  config: null
  # Example:
  # config: |
  #   Host mycluster1
  #       HostName login.mycluster1.myorg.com
  #       User myusername
  #       IdentityFile ~/.ssh/id_rsa

# Extra init containers to run before the api container
# @schema type: [array, null]; item: object
extraInitContainers: null

# Set securityContext for the api pod
# @schema type: [object, null]
podSecurityContext: {}

# Set securityContext for the api container inside the api pod
securityContext:
  capabilities:
    drop:
    - ALL
  allowPrivilegeEscalation: false

# Set the runtime class
# @schema type: [string, null]
runtimeClassName:

# Set configuration for Prometheus helm chart
# Refer to https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml for available values.
# @schema skipProperties:true
prometheus:
  # By default, the API server will be annotated with well-known annotations (prometheus.io/*) to be discovered by prometheus.
  # Set this to true will remove the well-known annotations and use a dedicated scrape config instead, which can be helpful when
  # you do not want the API server to be discovered by other prometheus instances.
  # @schema type: [boolean, null]
  useDedicatedScrapeConfig: false
  # Add a scrape job for the API server's /endpoints-metrics federation
  # (model-serving engine metrics, e.g. vLLM, from every connected Kubernetes
  # context) and provision the serving Grafana dashboards. Opt-in: leave false
  # unless you run model-serving workloads.
  # @schema type: [boolean, null]
  scrapeEndpointMetrics: false
  enabled: false
  # Keep the installation minimal by default. If you want to monitor more resources other than the API server,
  # it is recommended to install and manage prometheus separately.
  # SkyPilot API server will be automatically discovered by the prometheus if it runs with the default kubernetes discovery configuration.
  server:
    persistentVolume:
      enabled: true
      size: 50Gi
    retention: "1000d"
    # The Prometheus documentations recommends setting the retention size to be 80-85% of the persistent volume size.
    # ref: https://prometheus.io/docs/prometheus/latest/storage/#right-sizing-retention-size
    # 43GB is roughly 80% of the 50Gi persistent volume size. We use Gi for the PV size and GB for the retention size
    # because these are the units set by the Prometheus chart schema for each respective field.
    retentionSize: "43GB"
  # Configure additional scrape configs using extraScrapeConfigs
  extraScrapeConfigs: |
    # Static scrape target for SkyPilot API server GPU metrics
    - job_name: 'skypilot-api-server-gpu-metrics'
      static_configs:
        # Use the API service created by this Helm chart
        - targets: ['{{ include "skypilot.fullname" . }}-api-service.{{ .Release.Namespace }}.svc.cluster.local:9090']
      metrics_path: '/gpu-metrics'
      scrape_interval: 60s
      scrape_timeout: 45s
      # Add labels to identify these metrics
      metric_relabel_configs:
      - action: replace
        source_labels: [node, Hostname]
        regex: ;(.+)
        target_label: node
        replacement: $1
    {{- if .Values.scrapeEndpointMetrics }}
    # Static scrape target for SkyPilot API server endpoint serving
    # metrics. The /endpoints-metrics endpoint federates the serving
    # engines' native series (vllm:* today) from every remote Kubernetes
    # context the API server can see, with a cluster=<context> label
    # injected on each series so the serving Grafana dashboards can
    # filter by cluster.
    - job_name: 'skypilot-api-server-endpoints-metrics'
      honor_labels: true
      static_configs:
        - targets: ['{{ include "skypilot.fullname" . }}-api-service.{{ .Release.Namespace }}.svc.cluster.local:9090']
      metrics_path: '/endpoints-metrics'
      scrape_interval: 60s
      scrape_timeout: 45s
    {{- end }}
    {{ if .Values.useDedicatedScrapeConfig }}
    - job_name: 'skypilot-api-server-metrics'
      honor_labels: true
      scrape_interval: 30s
      scrape_timeout: 20s
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - '{{ .Release.Namespace }}'
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_skypilot_co_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_skypilot_co_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__meta_kubernetes_pod_annotation_skypilot_co_port, __meta_kubernetes_pod_ip]
          action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: $2:$1
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_phase]
          regex: Pending|Succeeded|Failed|Completed
          action: drop
        - source_labels: [__meta_kubernetes_pod_node_name]
          action: replace
          target_label: node
    {{ end}}
  kube-state-metrics:
    enabled: true
    # TODO (kyuds): remove skypilot-cluster label in v0.12.0; deprecated in favor of skypilot-cluster-name.
    metricLabelsAllowlist:
      - pods=[skypilot-cluster,skypilot-cluster-name]
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  alertmanager:
    enabled: false

# Set configuration for Grafana helm chart
# Refer to https://github.com/grafana/helm-charts/blob/main/charts/grafana/README.md for available values.
# @schema skipProperties:true
grafana:
  enabled: false
  # Use Recreate strategy to avoid PVC mount conflicts during upgrades
  # Since Grafana uses ReadWriteOnce PVC, RollingUpdate would fail when
  # trying to mount the same PVC on two pods simultaneously
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    size: 10Gi
  # Uncomment the following to serve under a dedicated LoadBalancer
  # service:
  #   type: LoadBalancer
  # Serve under a subpath of the same ingress controller of the API server
  ingress:
    # Helm cannot template the auth secret for grafana ingress in values.yaml,
    # so we disable ingress of grafana by default to avoid conflicts with the
    # ingress with auth managed by our chart.
    enabled: false
    # Hack: this is used by our chart to control whether to create an ingress with auth for grafana.
    # The grafana subchart will NOT use this field, just keep this field here to make the configuration
    # of grafana coherent instead of spreading across different structs.
    enableAuthedIngress: true
    path: "/grafana"
    ingressClassName: nginx
    # @schema type: [array]; item: string
    # If you set hosts to null, the Grafana Helm chart will use its default value ([chart-example.local]).
    # To match all hosts, set hosts to an empty array ([]).
    hosts: []
    # Custom annotations for the ingress
    annotations: null

  grafana.ini:
    server:
      domain: localhost
      root_url: "%(protocol)s://%(domain)s/grafana"
      enforce_domain: false
      serve_from_sub_path: true
    security:
      allow_embedding: true
    auth.proxy:
      enabled: true
      header_name: "X-WEBAUTH-USER"
      header_property: "username"
      auto_sign_up: true
    auth:
      disable_login_form: true
      disable_signout_menu: true
    auth.anonymous:
      enabled: false
    auth.basic:
      enabled: false
  sidecar:
    # Enable datasources discovery in grafana sidecar.
    datasources:
      enabled: true
      initDatasources: true
    # Enable dashboards discovery in grafana sidecar.
    dashboards:
      enabled: true
  # Add dashboard provider configuration to load dashboards from default directory
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/default
